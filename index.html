<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pluse</title>
<meta name="description" content="Pluse — tu sistema personal: hábitos, tareas, proyectos, entrenamiento y revisión semanal.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#131211">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "black" deja la barra de estado por encima del contenido, en vez de
     que la app se meta abajo de la isla dinámica -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pluse">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
img{max-width:100%}

:root{
  --ground:#131211;
  --rail:#191716;
  --surface:#201E1C;
  --surface2:#282523;
  --surface3:#322E2B;
  --border:#2E2A27;
  --border2:#3E3936;
  --text:#FFFFFF;
  --muted:#A09892;
  --faint:#928A84;
  --line:rgba(255,255,255,.06);
  --accent:#D93A2F;
  --accent-2:#E85449;
  --accent-soft:rgba(217,58,47,.15);
  --accent-text:#F0796E;
  --accent-ink:#FFFFFF;
  --good:#5FB055; --good-soft:rgba(95,176,85,.15);
  --bad:#D2417E;  --bad-soft:rgba(210,65,126,.15);
  --info:#5B94E0; --info-soft:rgba(91,148,224,.15);
  --purple:#8A4FE0;

  /* joyas: oscuras y vivas como el rojo, para que cada sección tenga la suya.
     La variante -t es la misma joya aclarada, para cuando pinta texto chico. */
  --blue:#2E6FD9;    --blue-soft:rgba(46,111,217,.16);   --blue-t:#7CA6F2;
  --teal:#10938F;    --teal-soft:rgba(16,147,143,.16);   --teal-t:#4FC9C4;
  --green:#268A47;   --green-soft:rgba(38,138,71,.16);   --green-t:#5FC57E;
  --amber:#C08A1E;   --amber-soft:rgba(192,138,30,.16);  --amber-t:#E5B54A;
  --violet:#8A4FE0;  --violet-soft:rgba(138,79,224,.16); --violet-t:#B48CF0;
  --magenta:#C42A6E; --magenta-soft:rgba(196,42,110,.16);--magenta-t:#EE6FA3;
  --orange:#D9691F;  --orange-soft:rgba(217,105,31,.16); --orange-t:#F09A5C;
  --indigo:#4757D9;  --indigo-soft:rgba(71,87,217,.16);  --indigo-t:#8B96EE;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px -24px rgba(0,0,0,.9);
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:Figtree,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:800; letter-spacing:-.02em; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0; text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
@keyframes viewIn{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.content.fade{animation:viewIn .18s cubic-bezier(.2,.7,.3,1)}
.btn,.chip,.icon-btn,.round,.check,.seg button,.step,.score button,.mood,.swatch,
.emoji-grid button,.hcard,.res,.pick,.note-item,.nav a{transition:background .14s, border-color .14s, color .14s, transform .14s}
.hcard:hover{transform:translateY(-2px)}
.btn:active,.round:active,.icon-btn:active,.hcard:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface3); border-radius:var(--r-sm)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:224px minmax(0,1fr); min-height:100vh}
.rail{
  background:var(--rail); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:16px 12px 14px;
}
.brand{display:flex; align-items:center; gap:9px; padding:2px 6px 14px}
.brand-mark{
  width:26px; height:26px; border-radius:var(--r-sm); background:var(--accent); color:#fff;
  display:grid; place-items:center; flex:none;
}
.brand-mark svg{width:16px; height:16px}
.brand-name{font-weight:800; font-size:16px; letter-spacing:-.02em}
.raildate{padding:0 8px 14px; border-bottom:1px solid var(--border); margin-bottom:12px}
.raildate .d{font-weight:700; font-size:14px; letter-spacing:-.01em}
.raildate .life{font-size:11px; color:var(--accent-text); line-height:1.35; margin-top:3px}
.nav{display:flex; flex-direction:column; gap:1px; overflow-y:auto}
.nav-group{
  font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); padding:14px 10px 5px;
}
.nav-group:first-child{padding-top:2px}
.nav a{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-sm);
  color:var(--muted); text-decoration:none; font-weight:600; font-size:14px;
}
.nav a svg{width:16px; height:16px; color:var(--accent); flex:none}
.nav a:hover{background:var(--surface2); color:var(--text)}
.nav a[aria-current="page"]{background:var(--surface2); color:var(--text)}
.nav .count{
  margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:600;
  background:var(--accent); color:#fff; border-radius:99px; padding:1px 6px; min-width:19px; text-align:center;
}
.rail-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:7px}
.sync{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--faint); padding:2px 8px; width:100%}
.dot{width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none}
.dot.ok{background:var(--good)} .dot.local{background:var(--accent)} .dot.err{background:var(--bad)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:flex-start; gap:14px; padding:20px 26px 14px;
  position:sticky; top:0; z-index:30; background:var(--ground);
  background:color-mix(in srgb, var(--ground) 90%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--border);
}
.topbar h1{font-size:27px}
.topbar .sub{color:var(--muted); font-size:14px; margin-top:2px}
.top-acts{margin-left:auto; display:flex; gap:8px; align-items:center; flex:none}
.round{
  width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
  display:grid; place-items:center; color:var(--accent); flex:none;
}
.round:hover{background:var(--surface2)}
.round svg{width:16px; height:16px}
.content{padding:20px 26px 60px; max-width:1240px; width:100%}

/* el degradado avisa que el contenido sigue hacia el costado */
.scroll-x{
  overflow-x:auto; overflow-y:hidden;
  background:
    linear-gradient(90deg, var(--surface) 30%, rgba(32,30,28,0)) left/34px 100% no-repeat local,
    linear-gradient(90deg, rgba(32,30,28,0), var(--surface) 70%) right/34px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.45), rgba(0,0,0,0)) left/16px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.45), rgba(0,0,0,0)) right/16px 100% no-repeat scroll;
}
.scroll-x.on-ground{
  background:
    linear-gradient(90deg, var(--ground) 30%, rgba(19,18,17,0)) left/34px 100% no-repeat local,
    linear-gradient(90deg, rgba(19,18,17,0), var(--ground) 70%) right/34px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.45), rgba(0,0,0,0)) left/16px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.45), rgba(0,0,0,0)) right/16px 100% no-repeat scroll;
}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 14px;
  border-radius:var(--r-sm); border:1px solid var(--border2); background:var(--surface);
  font-weight:600; font-size:14px; color:var(--text); white-space:nowrap;
}
.btn:hover{background:var(--surface2)}
.btn svg{width:14px; height:14px}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.pri:hover{background:var(--accent-2); border-color:var(--accent-2)}
.btn.out{background:transparent; border-color:var(--accent-text); color:var(--accent-text)}
.btn.out:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px; font-size:12.5px}
.btn.danger{color:var(--bad); border-color:rgba(210,96,126,.5)}
.btn.solid-danger{background:var(--bad); border-color:var(--bad); color:#fff}
.icon-btn{
  width:30px; height:30px; border-radius:var(--r-sm); display:grid; place-items:center;
  border:1px solid transparent; color:var(--accent);
}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:15px; height:15px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r)}
.pad{padding:16px 18px}
.sec{margin-bottom:22px}
.sec-title{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.sec-title h2{font-size:16px; font-weight:700}
.sec-title .aside{margin-left:auto; font-size:12.5px; color:var(--muted); font-weight:600}
.card-title{font-size:16px; font-weight:700; margin-bottom:12px; letter-spacing:-.01em}
.muted{color:var(--muted)}
.empty{padding:34px 20px; text-align:center; color:var(--muted); font-size:14px;
  border:1px dashed var(--border2); border-radius:var(--r);
  display:flex; flex-direction:column; align-items:center; gap:4px}
.empty .ei{width:40px; height:40px; border-radius:50%; background:var(--surface2); color:var(--accent);
  display:grid; place-items:center; margin-bottom:6px}
.empty .ei svg{width:19px; height:19px}
.empty b{font-size:16px; font-weight:700; color:var(--text)}
.empty .btn{margin-top:12px}

.seg{display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:2px}
.seg button{padding:5px 13px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface3); color:var(--text)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{padding:5px 11px; border-radius:99px; border:1px solid var(--border); background:var(--surface);
  font-size:12.5px; font-weight:600; color:var(--muted)}
.chip:hover{color:var(--text); border-color:var(--border2)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.pill{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px;
  font-size:11px; font-weight:700; letter-spacing:.01em}
.pill.alta{background:var(--bad-soft); color:var(--bad)}
.pill.media{background:var(--amber-soft); color:var(--amber-t)}
.pill.baja{background:var(--surface3); color:var(--muted)}
.pill.tag{background:var(--surface3); color:var(--muted); font-weight:600}
.pill.rep{background:var(--indigo-soft); color:var(--indigo-t)}
.pill.activo{background:var(--accent-soft); color:var(--accent-text)}
.pill.pausado{background:var(--surface3); color:var(--muted)}
.pill.terminado{background:var(--good-soft); color:var(--good)}
.pill.date{background:var(--accent); color:#fff; font-family:"JetBrains Mono",monospace; font-size:11px}
.streak-pill{display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border);
  border-radius:99px; padding:4px 12px 4px 8px; font-size:12.5px; color:var(--muted)}
.streak-pill b{font-family:"JetBrains Mono",monospace; color:var(--text); font-size:14px}

/* tarjetas de racha */
.streaks{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:24px}
.streak-card{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:14px 16px}
.streak-card .ico{width:38px; height:38px; border-radius:50%; background:var(--surface3); display:grid;
  place-items:center; font-size:16px; flex:none}
.streak-card .n{font-family:"JetBrains Mono",monospace; font-size:22px; font-weight:700; line-height:1.1}
.streak-card .l{font-size:11px; color:var(--muted); margin-top:1px}

/* fila de hábitos de hoy */
.hrow{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px}
.hcard{
  flex:none; width:78px; min-height:84px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:8px 8px 7px; display:flex; flex-direction:column; gap:3px; position:relative;
}
.hcard .e{font-size:17px; line-height:1}
.hcard .n{
  font-size:11px; font-weight:600; line-height:1.15; color:var(--muted);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.hcard .mark{width:15px; height:15px; border-radius:50%; border:1.5px solid var(--border2); margin-top:auto;
  display:grid; place-items:center; color:transparent}
.hcard .mark svg{width:10px; height:10px; stroke-width:3.4}
.hcard.on{background:var(--hc,var(--accent)); border-color:var(--hc,var(--accent))}
.hcard.on .n{color:var(--hi,#fff); font-weight:700}
.hcard.on .mark{background:var(--hi,#fff); border-color:var(--hi,#fff); color:var(--hc,var(--accent))}

/* grilla del inicio */
.home-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; align-items:start}
.accent-card{background:linear-gradient(150deg,var(--accent),#A94E2A); border-radius:var(--r); padding:16px 18px; color:#fff}
.accent-card .k{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.85}
.accent-card h3{font-size:20px; margin-top:8px; line-height:1.28}
.accent-card p{margin:6px 0 0; font-size:14px; opacity:.9}
.accent-card .btn{background:#fff; border-color:#fff; color:var(--accent); margin-top:12px}
.moods{display:flex; gap:6px}
.mood{width:100%; aspect-ratio:1; max-height:40px; border-radius:var(--r-sm); background:var(--surface2);
  display:grid; place-items:center; font-size:20px; border:1.5px solid transparent}
.mood:hover{background:var(--surface3)}
.mood[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.field-line{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:9px 11px; font-size:14px; outline:none}
.field-line:focus{border-color:var(--accent)}
.prize{border:1px solid var(--accent); border-radius:var(--r-sm); padding:10px 12px; background:var(--accent-soft)}
.prize .k{font-size:11px; font-weight:700; color:var(--accent-text); display:flex; gap:5px; align-items:center; margin-bottom:6px}
.agenda{display:flex; flex-direction:column; gap:0}
.ag{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px}
.ag:last-child{border-bottom:none}
.ag .t{color:var(--faint); font-family:"JetBrains Mono",monospace; font-size:11px; flex:none; width:46px}
.ag .b{border-left:2px solid var(--accent); padding-left:9px; flex:1; min-width:0}

/* filas */
.rows{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); overflow:hidden}
.row{display:flex; align-items:center; gap:11px; padding:10px 14px; border-top:1px solid var(--border)}
.row:first-child{border-top:none}
.row:hover{background:var(--surface2)}
.row .grow{flex:1; min-width:0}
.row .t{font-weight:600; font-size:14px; overflow-wrap:anywhere}
.row .m{font-size:11px; color:var(--faint); display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:2px}
.row-acts{display:flex; gap:2px; opacity:0}
.row:hover .row-acts, .row:focus-within .row-acts{opacity:1}
@media (hover:none){.row-acts{opacity:1}}
.check{width:19px; height:19px; border-radius:6px; border:1.5px solid var(--border2); flex:none;
  display:grid; place-items:center; color:transparent}
.check svg{width:12px; height:12px; stroke-width:3}
.check:hover{border-color:var(--accent)}
.check[aria-pressed="true"]{background:var(--hc,var(--accent)); border-color:var(--hc,var(--accent)); color:#fff}
.check:hover{border-color:var(--hc,var(--accent))}
.done .t{text-decoration:line-through; color:var(--faint)}
.ico-circle{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; flex:none; font-size:14px}

/* aviso pendientes */
.alert{border:1px solid rgba(210,96,126,.45); background:var(--bad-soft); border-radius:var(--r);
  padding:13px 15px 11px; margin-bottom:20px; display:flex; flex-direction:column; gap:8px}
.alert-head{display:flex; align-items:center; gap:10px; font-size:14px}
.alert-head svg{width:17px; height:17px; color:var(--bad); flex:none}
.alert-head b{flex:1; font-weight:700; min-width:0}
.alert-list{display:flex; flex-direction:column; border-top:1px solid rgba(210,96,126,.25)}
.alert-row{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid rgba(210,96,126,.18)}
.alert-row:last-child{border-bottom:none}
.alert-row .grow{flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.alert-row .ago{font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700; color:var(--bad); flex:none}
.alert .more{font-size:12.5px; color:var(--muted); padding-top:6px}

/* hábitos: gráfico, dona, matriz */
.chart-wrap{width:100%; overflow-x:auto}
.donut-row{display:flex; align-items:center; gap:18px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border)}
.donut{position:relative; width:66px; height:66px; flex:none}
.donut span{position:absolute; inset:0; display:grid; place-items:center; font-family:"JetBrains Mono",monospace;
  font-size:14px; font-weight:700}
.kv{flex:1; display:flex; flex-direction:column; gap:5px; font-size:14px}
.kv div{display:flex; gap:12px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{margin-left:auto; font-family:"JetBrains Mono",monospace; font-weight:700}
.matrix{overflow-x:auto; padding-bottom:4px}
.mx{border-collapse:separate; border-spacing:3px; font-size:11px}
.mx th{font-weight:700; color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:0}
.mx th.wk{font-size:11px; letter-spacing:.1em; padding-bottom:3px}
.mx td.name{white-space:nowrap; padding-right:10px; font-size:12.5px; font-weight:600}
.mx td.goal{font-family:"JetBrains Mono",monospace; color:var(--muted); padding-right:8px; font-size:11px}
.mx .cell{width:19px; height:19px; border-radius:5px; border:1px solid var(--border2); display:grid;
  place-items:center; color:transparent; padding:0}
.mx .cell svg{width:11px; height:11px; stroke-width:3.4}
.mx .cell.on{color:#fff; border-color:transparent}
.mx .cell.fut{opacity:.3}
.mx .cell:hover{border-color:var(--accent)}
.year-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:14px}
.ymonth .ml{font-size:11px; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:capitalize}
.ycells{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.ycells i{aspect-ratio:1; border-radius:3px; background:var(--surface2); display:block}

/* semana */
.weekdays{display:flex; gap:5px}
.wd{width:26px; height:26px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
  display:grid; place-items:center; font-size:11px; font-weight:700; color:var(--muted)}
.wd[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.weeknav{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:9px 14px; margin-bottom:14px}
.weeknav .lbl{flex:1; text-align:center}
.weeknav .lbl b{font-size:14px; font-weight:700}
.weeknav .lbl a{display:block; font-size:11px; color:var(--accent-text); text-decoration:none}
.week{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.day{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:13px 14px;
  display:flex; flex-direction:column; gap:9px}
.day.today{border-color:var(--accent)}
.day.drop{border-color:var(--accent); background:var(--accent-soft)}
.day-head{display:flex; align-items:center; gap:8px}
.day-head h3{font-size:14px; font-weight:700}
.day-lab{font-size:11px; font-weight:800; letter-spacing:.12em; color:var(--faint); text-transform:uppercase}
.progline{height:3px; border-radius:3px; background:var(--surface3); overflow:hidden}
.progline i{display:block; height:100%; background:var(--pc,var(--accent)); border-radius:3px}
.wtask{display:flex; align-items:flex-start; gap:8px; font-size:12.5px; line-height:1.35; padding:3px 0; cursor:grab}
.wtask .tx{flex:1; min-width:0; overflow-wrap:anywhere}
.wtask.done .tx{text-decoration:line-through; color:var(--faint)}
.wtask .mini{opacity:0}
.wtask:hover .mini{opacity:1}
@media (hover:none){.wtask .mini{opacity:1}}
.mini{width:19px; height:19px; border-radius:6px; display:grid; place-items:center; color:var(--faint); flex:none}
.mini:hover{background:var(--surface3); color:var(--text)}
.mini svg{width:12px; height:12px}
.addline{display:flex; gap:6px; align-items:center}
.addline input{flex:1; min-width:0; background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:7px 10px; font-size:12.5px; outline:none}
.addline input:focus{border-color:var(--accent)}
.addline button{width:28px; height:28px; border-radius:var(--r-sm); background:var(--surface3); display:grid;
  place-items:center; flex:none; color:var(--text)}
.addline button:hover{background:var(--accent); color:#fff}
.badge{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; padding:1px 6px;
  border-radius:99px; font-family:"JetBrains Mono",monospace}
.badge.h{background:var(--good-soft); color:var(--good)}
.badge.t{background:var(--info-soft); color:var(--info)}

/* barras y gráficos */
.bars{display:flex; flex-direction:column; gap:10px}
.bar-row{display:flex; flex-direction:column; gap:4px}
.bar-top{display:flex; align-items:baseline; gap:8px; font-size:14px}
.bar-top .amt{margin-left:auto; font-family:"JetBrains Mono",monospace; font-weight:700}
.bar-top .pct{font-size:11px; color:var(--faint); font-family:"JetBrains Mono",monospace; min-width:34px; text-align:right}
.track{height:7px; border-radius:99px; background:var(--surface3); overflow:hidden; position:relative}
.track i{display:block; height:100%; border-radius:99px; background:var(--pc,var(--accent))}
.track i.over{background:var(--bad)}
.track .budget-mark{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); opacity:.5}
.bar-sub{font-size:11px; color:var(--faint)}
.vbars{display:flex; align-items:flex-end; gap:9px; height:118px; padding-top:6px}
.vb{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0}
.vb .stack{width:100%; display:flex; gap:2px; align-items:flex-end; height:100%}
.vb .stack i{flex:1; border-radius:4px 4px 0 0; min-height:2px; display:block}
.vb .lbl{font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden}
.legend{display:flex; gap:14px; font-size:12.5px; color:var(--muted); align-items:center; margin-top:12px;
  padding-top:12px; border-top:1px solid var(--border)}
.legend b{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:5px}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:22px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:13px 15px 13px 17px;
  position:relative; overflow:hidden}
.tile::after{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--tint,transparent)}
.tile[style*="--tint"] .v{color:var(--tint)}
.tile.accent{--tint:var(--accent)} .tile.good{--tint:var(--good)} .tile.bad{--tint:var(--bad)}
.tile .k{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); font-weight:700}
.tile .v{font-family:"JetBrains Mono",monospace; font-size:22px; font-weight:700; letter-spacing:-.03em; margin-top:5px; line-height:1.1}
.tile .s{font-size:11px; color:var(--muted); margin-top:2px}
.tile.accent .v{color:var(--accent-text)} .tile.good .v{color:var(--good)} .tile.bad .v{color:var(--bad)}

/* entrenamiento */
.exs{margin-top:8px; border-top:1px solid var(--border)}
.ex{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px}
.ex:last-child{border-bottom:none}
.ex .nums{font-family:"JetBrains Mono",monospace; color:var(--muted); font-size:12.5px}
.ex-editor{display:flex; flex-direction:column; gap:7px}
.ex-line,.ex-head{display:grid; grid-template-columns:minmax(0,1fr) 52px 52px 60px 28px; gap:6px; align-items:center}
.ex-head{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); font-weight:700}
.ex-line input{padding:7px 8px; font-size:12.5px}

/* proyectos */
.projs{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px; align-items:start}
.proj{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:15px 16px;
  display:flex; flex-direction:column; gap:10px}
.proj.terminado{opacity:.6}
.proj-top{display:flex; align-items:center; gap:9px}
.proj-top h3{font-size:14px; flex:1; min-width:0; font-weight:700}
.dot-color{width:10px; height:10px; border-radius:3px; flex:none}
.proj .meta{display:flex; gap:9px; font-size:11px; color:var(--faint); flex-wrap:wrap}
.proj .acts{display:flex; gap:5px; align-items:center; margin-top:2px}
.filter-note{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent-text); font-size:12.5px; font-weight:700}

/* anotaciones */
.cats{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; align-items:start}
.cat{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden}
.cat-head{display:flex; align-items:center; gap:9px; padding:12px 14px; width:100%}
.cat-head .chev{color:var(--faint); display:grid; place-items:center; transition:transform .15s}
.cat-head .chev svg{width:13px; height:13px}
.cat.open .chev{transform:rotate(90deg)}
.cat-head b{font-size:14px; font-weight:700}
.cat-head .cnt{font-size:11px; color:var(--faint)}
.cat-body{border-top:1px solid var(--border); padding:6px 8px 8px; display:flex; flex-direction:column; gap:4px}
.note-item{padding:8px 10px; border-radius:var(--r-sm); background:var(--surface2); display:flex; gap:8px; align-items:flex-start}
.note-item:hover{background:var(--surface3)}
.note-item .ni{flex:1; min-width:0}
.note-item .nt{font-size:14px; font-weight:600}
.note-item .nb{font-size:11px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.search{display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--border);
  border-radius:var(--r-sm); background:var(--surface); flex:1; min-width:170px; max-width:300px}
.search input{border:none; background:none; outline:none; width:100%; font-size:14px}
.search svg{width:15px; height:15px; color:var(--faint); flex:none}

/* modal / form */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.68); display:grid; place-items:center; padding:18px;
  z-index:100; overflow:auto}
.modal{background:var(--surface); border:1px solid var(--border2); border-radius:var(--r); width:min(540px,100%);
  box-shadow:0 26px 70px -22px rgba(0,0,0,.9); max-height:calc(100vh - 36px); display:flex; flex-direction:column}
.modal header{padding:17px 20px 11px; display:flex; align-items:center; gap:10px}
.modal header h2{font-size:16px}
.modal .fields{padding:4px 20px 8px; overflow:auto; display:grid; grid-template-columns:1fr 1fr; gap:13px}
.modal footer{padding:13px 20px 17px; display:flex; gap:9px; align-items:center; border-top:1px solid var(--border); margin-top:6px}
.spacer{margin-left:auto}
.f{display:flex; flex-direction:column; gap:5px; min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:700}
.f input,.f select,.f textarea{padding:9px 11px; border:1px solid var(--border2); border-radius:var(--r-sm);
  background:var(--ground); font-size:14px; width:100%; outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f textarea{min-height:96px; resize:vertical; font-family:inherit; line-height:1.55}
.f .help{font-size:11px; color:var(--faint)}
.swatches{display:grid; grid-template-columns:repeat(7,1fr); gap:7px}
.swatch{width:100%; aspect-ratio:1; max-height:30px; border-radius:var(--r-sm); border:2px solid transparent; position:relative}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-pressed="true"]{border-color:#fff; box-shadow:0 0 0 2px var(--ground)}
.emoji-pick{display:flex; flex-direction:column; gap:8px}
.emoji-grid{display:grid; grid-template-columns:repeat(14,1fr); gap:5px}
.emoji-grid button{aspect-ratio:1; border-radius:var(--r-sm); background:var(--surface2); border:1.5px solid transparent;
  display:grid; place-items:center; font-size:14px; line-height:1}
.emoji-grid button:hover{background:var(--surface3)}
.emoji-grid button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.emoji-free{padding:8px 11px; border:1px solid var(--border2); border-radius:var(--r-sm);
  background:var(--ground); font-size:14px; outline:none; width:100%}
.emoji-free:focus{border-color:var(--accent)}
@media (max-width:620px){
  .emoji-grid{grid-template-columns:repeat(7,1fr)}
  .swatches{grid-template-columns:repeat(7,1fr)}
}
.daypick{display:flex; gap:5px}
.daypick button{flex:1; padding:7px 0; border:1px solid var(--border2); border-radius:var(--r-sm); font-size:11px;
  font-weight:700; background:var(--ground); color:var(--muted); text-align:center}
.daypick button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.menu{position:absolute; right:0; top:calc(100% + 7px); background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--r); box-shadow:var(--shadow); padding:6px; min-width:200px; z-index:60}
.menu button{display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border-radius:var(--r-sm); font-size:14px}
.menu button:hover{background:var(--surface2)}
.menu button svg{width:15px; height:15px; color:var(--accent)}
.wrap-rel{position:relative}
.kbd{font-family:"JetBrains Mono",monospace; font-size:11px; padding:1px 5px; border-radius:5px;
  border:1px solid var(--border2); color:var(--faint)}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:200; background:var(--surface);
  border:1px solid var(--border2); color:var(--text); padding:11px 16px; border-radius:99px; font-size:14px;
  font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:12px}
.toast button{color:var(--accent-text); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em;
  display:flex; align-items:center; gap:5px}
.toast button svg{width:13px; height:13px}

/* buscador */
.search-bar{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border)}
.search-bar svg{width:17px; height:17px; color:var(--faint); flex:none}
.search-bar input{border:none; background:none; outline:none; width:100%; font-size:14px}
.res-list{max-height:54vh; overflow:auto; padding:6px}
.res-group{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); font-weight:800; padding:9px 10px 5px}
.res{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:var(--r-sm)}
.res:hover{background:var(--surface2)}
.res svg{width:15px; height:15px; color:var(--accent); flex:none}
.res .rt{flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.res .rs{font-size:11px; color:var(--faint); flex:none}

/* ajustes */
.setting{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border)}
.setting:last-child{border-bottom:none}
.setting .sl{flex:1; min-width:0}
.setting .sl b{display:block; font-size:14px; font-weight:700}
.setting .sl span{font-size:12.5px; color:var(--faint)}
.setting select,.setting input[type=date]{padding:7px 10px; border:1px solid var(--border2);
  border-radius:var(--r-sm); background:var(--ground); font-size:14px}
.file-btn{display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:var(--r-sm);
  cursor:pointer; border:1px solid var(--border2); background:var(--surface); font-weight:600; font-size:14px}
.file-btn:hover{background:var(--surface2)}
.file-btn svg{width:14px; height:14px}
.file-btn input{display:none}

/* ---------- ritual matutino ---------- */
.ritual-grid{display:grid; grid-template-columns:1.15fr 1fr; gap:14px; align-items:start}
.mission-input{
  width:100%; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.28); border-radius:var(--r-sm);
  padding:11px 13px; margin-top:9px; color:#fff; font-size:16px; font-weight:700; outline:none;
}
.mission-input::placeholder{color:rgba(255,255,255,.6); font-weight:600}
.mission-input:focus{border-color:#fff; background:rgba(0,0,0,.28)}
.energy{display:flex; gap:6px}
.energy button{flex:1; height:14px; border-radius:5px; background:var(--surface3); border:1px solid var(--border2)}
.energy button.on{background:var(--accent); border-color:var(--accent)}
.energy button:hover{border-color:var(--accent)}
.pick{display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border-radius:var(--r-sm);
  font-size:14px; background:var(--surface2); margin-bottom:6px}
.pick:hover{background:var(--surface3)}
.pick .tick{width:18px; height:18px; border-radius:6px; border:1.5px solid var(--border2); display:grid;
  place-items:center; color:transparent; flex:none}
.pick .tick svg{width:11px; height:11px; stroke-width:3}
.pick[aria-pressed="true"]{background:var(--accent-soft)}
.pick[aria-pressed="true"] .tick{background:var(--accent); border-color:var(--accent); color:#fff}
.logro{display:flex; align-items:center; gap:9px; font-size:12.5px; background:var(--surface2);
  border-radius:var(--r-sm); padding:8px 11px}
.logro span{font-size:14px}

/* ---------- objetivos ---------- */
.tabs{display:inline-flex; gap:8px; margin-bottom:16px}
.tabs button{display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface); font-size:14px; font-weight:600; color:var(--muted)}
.tabs button svg{width:15px; height:15px}
.tabs button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.group{border:1px solid var(--violet); border-radius:var(--r); background:var(--violet-soft); overflow:hidden}
.group-head{display:flex; align-items:center; gap:9px; width:100%; padding:12px 15px; font-size:14px}
.group-head b{font-weight:700}
.group-head .cnt{margin-left:auto; font-family:"JetBrains Mono",monospace; color:var(--muted); font-size:12.5px}
.group-head .chev{display:grid; place-items:center; color:var(--accent-text); transition:transform .15s}
.group-head .chev svg{width:14px; height:14px}
.group.open .chev{transform:rotate(90deg)}
.group-body{padding:4px 14px 14px}
.pick-row{display:flex; align-items:center; gap:9px; padding:6px 0; font-size:14px}
.pick-row .mini{opacity:0}
.pick-row:hover .mini{opacity:1}
@media (hover:none){.pick-row .mini{opacity:1}}
.goal-cols{display:grid; grid-template-columns:320px minmax(0,1fr); gap:14px; align-items:start}
@media (max-width:860px){ .goal-cols{grid-template-columns:1fr} }

/* ---------- rueda de la vida ---------- */
.wheel-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
.area-row{padding:7px 0; border-bottom:1px solid var(--border)}
.area-row:last-of-type{border-bottom:none}
.area-row input[type=range]{width:100%; margin-top:5px; accent-color:var(--accent); background:transparent}

/* ---------- estadísticas ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-items:start}
.rank{display:flex; align-items:center; gap:9px; padding:7px 0; font-size:14px; border-bottom:1px solid var(--border)}
.rank:last-child{border-bottom:none}
.rank .e{font-size:14px; flex:none}
.rank .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank .rbar{width:70px; height:6px; border-radius:99px; background:var(--surface3); overflow:hidden; flex:none}
.rank .rbar i{display:block; height:100%; border-radius:99px; background:var(--accent)}

/* ---------- enfoque / memento mori ---------- */
.focus-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
.timer{position:relative; width:200px; height:200px}
.timer span{position:absolute; inset:0; display:grid; place-items:center; font-size:40px; font-weight:700; letter-spacing:-.03em}
.play-btn{width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center}
.play-btn:hover{background:var(--accent-2)}
.play-btn svg{width:22px; height:22px}
.card-title svg{width:15px; height:15px; vertical-align:-2px; color:var(--accent); margin-right:5px}
.quote{margin:14px 0 0; padding:12px 14px; border-radius:var(--r-sm); background:var(--surface2);
  border-left:3px solid var(--accent); font-size:14px; color:var(--muted); font-style:italic}
.quote span{display:block; margin-top:6px; font-style:normal; font-size:11px; color:var(--faint)}

/* ---------- subtareas ---------- */
.row-wrap{border-top:1px solid var(--border)}
.row-wrap:first-child{border-top:none}
.row-wrap .row{border-top:none}
.pill.subs{background:var(--surface3); color:var(--muted); cursor:pointer}
.pill.subs:hover{color:var(--text)}
.pill.subs.full{background:var(--good-soft); color:var(--good)}
.submini{margin-left:6px; font-size:11px; color:var(--faint); background:var(--surface3);
  border-radius:99px; padding:0 5px}
.sublist{padding:2px 14px 12px 44px; display:flex; flex-direction:column; gap:2px; background:var(--surface2)}
.subrow{display:flex; align-items:center; gap:9px; padding:5px 0; font-size:14px}
.subrow .mini{opacity:0}
.subrow:hover .mini{opacity:1}
@media (hover:none){.subrow .mini{opacity:1}}
.check.sm{width:16px; height:16px; border-radius:5px}
.check.sm svg{width:10px; height:10px}
.sub-editor{display:flex; flex-direction:column; gap:6px}
.sub-line{display:grid; grid-template-columns:18px minmax(0,1fr) 28px; gap:8px; align-items:center}
.sub-line input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent)}
.sub-line input[data-sub=title]{padding:7px 9px; font-size:14px; border:1px solid var(--border2);
  border-radius:var(--r-sm); background:var(--ground); outline:none}
.sub-line input[data-sub=title]:focus{border-color:var(--accent)}

/* ---------- planificador: agarre por teclado ---------- */
.wtask:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm)}
.wtask.grabbed{
  background:var(--accent-soft); outline:2px dashed var(--accent); outline-offset:2px;
  border-radius:var(--r-sm); cursor:grabbing;
}

/* ---------- revisión semanal ---------- */
.steps{display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; padding-bottom:2px}
.step{display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:99px; flex:none;
  border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:12.5px; font-weight:600}
.step .n{width:19px; height:19px; border-radius:50%; background:var(--surface3); display:grid; place-items:center;
  font-family:"JetBrains Mono",monospace; font-size:11px; flex:none}
.step:hover{color:var(--text)}
.step.past{color:var(--text)}
.step.past .n{background:var(--teal); color:#fff}
.step.on{background:var(--teal); border-color:var(--teal); color:#fff}
.step.on .n{background:rgba(255,255,255,.25); color:#fff}
.rep-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.rep{background:var(--surface2); border-radius:var(--r-sm); padding:12px 14px; display:flex; flex-direction:column; gap:2px;
  border-left:3px solid var(--tint,var(--border2))}
.rep .v{color:var(--tint,var(--text))}
.rep .k{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:700}
.rep .v{font-size:22px; font-weight:700; letter-spacing:-.02em}
.rep .s{font-size:11px; color:var(--muted)}
.rev-text{width:100%; min-height:150px; resize:vertical; padding:13px 15px; font-family:inherit; font-size:14px;
  line-height:1.6; border:1px solid var(--border2); border-radius:var(--r-sm); background:var(--ground); outline:none}
.rev-text:focus{border-color:var(--accent)}
.score{display:flex; gap:5px; flex-wrap:wrap}
.score button{width:38px; height:38px; border-radius:var(--r-sm); border:1px solid var(--border2); background:var(--surface2);
  font-weight:700; font-size:14px; color:var(--muted); display:grid; place-items:center}
.score button:hover{border-color:var(--accent); color:var(--text)}
.score button.on{background:var(--accent-soft); color:var(--accent-text); border-color:var(--accent)}
.score button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}

/* responsive */
@media (max-width:1000px){
  .ritual-grid,.wheel-grid,.stats-grid,.focus-grid{grid-template-columns:1fr}
}

@media (max-width:1100px){ .home-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .week{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:900px){ .week{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .app{grid-template-columns:72px minmax(0,1fr)}
  .rail{padding:12px 7px}
  .brand{justify-content:center; padding:0 0 10px}
  .brand-text,.raildate,.rail-foot .btn span,.sync #sync-label{display:none}
  /* en la columna angosta los títulos de grupo se vuelven una línea */
  .nav-group{
    font-size:0; padding:8px 6px 7px; border-top:1px solid var(--border); margin-top:2px;
  }
  .nav-group:first-child{border-top:none; margin-top:0; padding-top:0}
  .nav a{flex-direction:column; gap:4px; padding:9px 2px; font-size:11px; text-align:center; letter-spacing:0}
  .nav a svg{width:21px; height:21px}
  .nav .count{position:absolute; margin:0; transform:translate(16px,-8px)}
  .nav a{position:relative}
  .sync{justify-content:center; padding:0}
  .rail-foot .btn{padding:8px 0}
  .content{padding:14px 13px 40px}
  .topbar{padding:14px 13px 12px}
  .topbar h1{font-size:20px}
  .home-grid,.week,.projs,.cats{grid-template-columns:1fr}
  .modal .fields{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .streaks{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
}

/* ---------- meta ⇄ proyecto ---------- */
.goal-item{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border)}
.goal-item:last-child{border-bottom:none}
.goal-item .check{margin-top:1px}
.goal-item .gi{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.goal-item .gt{font-size:14px; font-weight:600; text-align:left; width:100%}
.goal-item .gt:hover{color:var(--accent-text)}
.goal-item.done .gt{text-decoration:line-through; color:var(--faint)}
.goal-item .glink{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
.goal-item .glink.sin{color:var(--faint); font-style:italic}
.goal-item .progline{height:3px}
.goal-item .mini{opacity:0; margin-top:2px}
.goal-item:hover .mini{opacity:1}
@media (hover:none){.goal-item .mini{opacity:1}}
.serves{
  display:flex; align-items:flex-start; gap:7px; font-size:12.5px; color:var(--muted);
  background:var(--surface2); border-radius:var(--r-sm); padding:8px 10px; width:100%; text-align:left;
}
.serves svg{width:14px; height:14px; color:var(--accent); flex:none; margin-top:1px}
.serves b{color:var(--text); font-weight:600}
.serves .mono{color:var(--faint)}
.serves.vacia{color:var(--faint); border:1px dashed var(--border2); background:transparent}
.serves.vacia:hover{border-color:var(--accent-text); color:var(--accent-text)}
.serves.vacia:hover svg{color:var(--accent)}

/* ---------- proyecto: área y plazo ---------- */
.proj-tags{display:flex; gap:6px; flex-wrap:wrap}
.pill.plazo{background:var(--accent-soft); color:var(--accent-text)}
.group-body .pick-row .btn{opacity:0}
.group-body .pick-row:hover .btn{opacity:1}
@media (hover:none){.group-body .pick-row .btn{opacity:1}}

/* ---------- inicio: tarjetas de resumen ---------- */
.home-grid .col{display:flex; flex-direction:column; gap:14px}
.mini-head{display:flex; align-items:center; gap:9px}
.mini-head h3{font-size:16px; font-weight:700; letter-spacing:-.01em}
.mini-head .ma{font-size:12.5px; color:var(--faint); font-family:"JetBrains Mono",monospace}
.mini-card .mini-head{margin-bottom:12px}
.ver{
  margin-left:auto; font-size:12.5px; font-weight:600; color:var(--accent-text);
  text-decoration:none; white-space:nowrap; flex:none;
}
.ver:hover{text-decoration:underline}
.sec-title .ver{margin-left:0}
.mini-rows{display:flex; flex-direction:column; gap:11px}
.mrow{display:flex; align-items:center; gap:10px}
.mrow .mi{font-size:16px; flex:none; width:22px; text-align:center}
.mrow .mb{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.mrow .mt{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mrow .mv{font-size:12.5px; color:var(--muted); flex:none}
.warn-line{
  display:flex; align-items:center; gap:7px; margin-top:11px; padding:8px 10px;
  border-radius:var(--r-sm); background:var(--bad-soft); color:var(--bad);
  font-size:12.5px; font-weight:600; text-decoration:none;
}
.warn-line svg{width:15px; height:15px; flex:none}
.ok-line{
  display:flex; align-items:flex-start; gap:7px; font-size:13px; color:var(--good);
}
.ok-line svg{width:15px; height:15px; flex:none; margin-top:2px}

/* ---------- inicio: jerarquía en tres niveles ---------- */
/* 1 · el ancla del día */
.hero{
  position:relative; overflow:hidden; margin-bottom:26px; padding:20px 24px;
  border:1px solid var(--border); border-radius:var(--r);
  background:
    radial-gradient(130% 180% at 0% 0%, rgba(217,58,47,.17), rgba(217,58,47,0) 62%),
    var(--surface);
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
}
.ring{position:relative; width:90px; height:90px; flex:none}
.ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:"JetBrains Mono",monospace; font-size:22px; font-weight:700; letter-spacing:-.03em;
}
.ring i{font-size:12.5px; font-style:normal; color:var(--muted); margin-left:1px}
.hero-main{flex:1; min-width:210px}
.hero-main .hl{font-size:20px; font-weight:800; letter-spacing:-.025em}
.hero-main .hs{font-size:13px; color:var(--muted); margin-top:3px}
.hero-stats{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.hstat{
  display:inline-flex; align-items:center; gap:7px; padding:5px 13px 5px 10px; border-radius:99px;
  background:var(--surface2); border:1px solid var(--border); font-size:12.5px; color:var(--muted);
  text-decoration:none;
}
.hstat b{font-family:"JetBrains Mono",monospace; color:var(--text); font-size:14px; font-weight:700}
.hstat.alerta{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.hstat.alerta b{color:var(--bad)}
.hstat.alerta svg{width:14px; height:14px}
.hstat.alerta:hover{filter:brightness(1.15)}

/* 2 · la tarjeta protagonista */
.home-grid{grid-template-columns:1.45fr 1fr}
.hoy-card{border-left:3px solid var(--accent)}
.hoy-head{display:flex; align-items:center; gap:9px; margin-bottom:12px}
.hoy-head h3{font-size:20px; font-weight:800; letter-spacing:-.025em}
.hoy-head .ma{font-size:12.5px; color:var(--faint); margin-left:auto}
.hoy-tasks{display:flex; flex-direction:column; gap:3px; padding-top:2px}
.hoy-tasks .wtask{padding:5px 0; font-size:14px}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}

/* 3 · los resúmenes, con título de cejilla */
.mini-card .mini-head h3{
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--faint);
}
.mini-card{background:var(--rail)}
.wk-top{display:flex; align-items:center; gap:16px; margin-bottom:14px}
.wk-n{font-size:22px; font-weight:700; letter-spacing:-.03em}

/* hábitos del día con más presencia */
.hcard .hst{
  position:absolute; top:6px; right:7px; font-family:"JetBrains Mono",monospace; font-size:10px;
  font-weight:700; color:var(--hc,var(--accent-text)); opacity:.9;
}
.hcard.on .hst{color:var(--hi,#fff); opacity:.7}
.hcard:not(.on):hover{border-color:var(--hc,var(--border2))}

@media (max-width:900px){ .home-grid{grid-template-columns:1fr} .pair{grid-template-columns:1fr} }
@media (max-width:560px){
  .hero{padding:16px; gap:16px}
  .ring{width:72px; height:72px}
  .ring svg{width:72px; height:72px}
  .ring span{font-size:20px}
}

/* ---------- una joya por sección ---------- */
/* --pc pinta la cejilla de la tarjeta y sus barras de progreso */
.mini-card .mini-head h3{color:var(--accent-text)}
.mini-card .ver{color:var(--accent-text)}
.mini-card .track i{background:var(--pc,var(--accent))}
/* el panel de hábitos trabaja en azul */
.donut-row .kv span:last-child{color:var(--blue-t)}
/* el sueño destacado, en violeta */
.group-head b{color:var(--accent-text)}
.serves svg{color:var(--violet-t)}
/* el ranking de estadísticas, en naranja */
.rank .rbar i{background:var(--orange)}


/* ---------- la barra superior en pantallas de teléfono ---------- */
@media (max-width:820px){
  .topbar{align-items:center; gap:8px}
  .topbar > div:first-child{min-width:0; overflow:hidden}
  .topbar h1{font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .topbar .sub{display:none}
  .top-acts{gap:6px}
  .round{width:32px; height:32px}
}
@media (max-width:430px){
  /* sólo el signo: el título del panel ya dice qué se agrega */
  #add-btn{
    width:34px; height:34px; padding:0; border-radius:50%;
    font-size:0; justify-content:center;
  }
  #add-btn::after{content:"＋"; font-size:19px; font-weight:700; line-height:1}
}


/* ---------- espacio para la isla dinámica y la barra de gestos ---------- */
.topbar{padding-top:calc(14px + env(safe-area-inset-top))}
.rail{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.content{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
@media (max-width:820px){
  .topbar{padding-top:calc(10px + env(safe-area-inset-top))}
  .rail{padding-top:calc(12px + env(safe-area-inset-top))}
}
#nueva-version{
  position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:300;
  display:flex; align-items:center; gap:14px; padding:11px 16px; border-radius:99px;
  background:var(--surface); border:1px solid var(--border2); box-shadow:var(--shadow);
  font-size:14px; font-weight:600;
}
#nueva-version button{color:var(--accent-text); font-weight:700; font-size:12.5px;
  text-transform:uppercase; letter-spacing:.06em}

</style>
</head>
<body>

<div class="app">
  <aside class="rail">

      <div class="brand-mark" id="brand-mark"></div>

    </div>

</div>

<div id="toast-root"></div>

<script>

/* =====================================================================
   Pluse — sistema personal
   inicio · hábitos · tareas · proyectos · semana · entreno · finanzas · notas
   ===================================================================== */

const S = (p, extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const ICON = {
  hoy: S('<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/><path d="M10 20v-5h4v5"/>'),
  habitos: S('<path d="M12 3.2c2.7 3.3 4.6 5.6 4.6 8.4a4.6 4.6 0 0 1-9.2 0c0-1.5.7-2.7 1.9-3.9.1 1.4.9 2 1.5 2 .8 0 1.1-.9.6-2-.7-1.7-.4-3.2.6-4.5Z"/>'),
  tareas: S('<path d="M4 6.5 5.6 8l2.6-2.8M4 12.5 5.6 14l2.6-2.8M4 18.5 5.6 20l2.6-2.8M12 6.6h8M12 12.6h8M12 18.6h5"/>'),
  proyectos: S('<path d="M12 3.4 4 7.2l8 3.8 8-3.8z"/><path d="M4 12.2l8 3.8 8-3.8"/><path d="M4 16.8l8 3.8 8-3.8"/>'),
  semana: S('<rect x="3" y="5" width="18" height="16" rx="2.4"/><path d="M8 3v4M16 3v4M3 10.5h18"/>'),
  entrenamiento: S('<path d="M6.5 7.5v9M17.5 7.5v9M3.5 10v4M20.5 10v4M6.5 12h11"/>'),
  finanzas: S('<path d="M3 20V4M3 20h18"/><path d="M6.5 15.5 10 11l3.2 2.3L20 6"/><path d="M16.6 6h3.6v3.6"/>'),
  anotaciones: S('<path d="M6.5 3h8L19 7.5V21h-12.5z"/><path d="M14 3v5h5M9.5 12h6M9.5 16h4"/>'),
  ajustes: S('<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/>'),
  check: S('<path d="M4.5 12.5l4.5 4.5 10-10"/>'),
  plus: S('<path d="M12 5v14M5 12h14"/>'),
  pencil: S('<path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M14.5 5.5 18.5 9.5"/>'),
  trash: S('<path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"/>'),
  left: S('<path d="M14.5 5 8 12l6.5 7"/>'),
  right: S('<path d="M9.5 5 16 12l-6.5 7"/>'),
  search: S('<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>'),
  bell: S('<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/>'),
  x: S('<path d="M6 6l12 12M18 6 6 18"/>'),
  down: S('<path d="M12 4v12M7 11.5l5 5 5-5M5 20h14"/>'),
  up: S('<path d="M12 20V8M7 12.5l5-5 5 5M5 4h14"/>'),
  undo: S('<path d="M4 9h10.5a4.5 4.5 0 0 1 0 9H8"/><path d="M7.5 5 3.5 9l4 4"/>'),
  alerta: S('<path d="M12 4.2 21 20H3z"/><path d="M12 10.2v4.2M12 17.2h.01"/>'),
  clock: S('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>'),
  pin: S('<path d="M9 3h6l-1 6 4 3.5H6L10 9z"/><path d="M12 12.5V21"/>'),
  chev: S('<path d="M9.5 5 16 12l-6.5 7"/>'),
  repeat: S('<path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19"/><path d="M16 3l3 3-3 3"/><path d="M20 13v1.5A3.5 3.5 0 0 1 16.5 18H5"/><path d="M8 21l-3-3 3-3"/>'),
  ritual: S('<circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"/>'),
  objetivos: S('<circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'),
  rueda: S('<circle cx="12" cy="12" r="8.6"/><path d="M12 3.4V12l7.4 4.3"/>'),
  estadisticas: S('<path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/>'),
  enfoque: S('<circle cx="12" cy="13" r="7.6"/><path d="M12 9.5V13l2.4 1.6M9.4 2.6h5.2"/>'),
  play: S('<path d="M8 5.5 18.5 12 8 18.5z" fill="currentColor" stroke="none"/>'),
  pause: S('<path d="M9 5v14M15 5v14" stroke-width="2.6"/>'),
  reset: S('<path d="M4 9h10.5a4.5 4.5 0 0 1 0 9H8"/><path d="M7.5 5 3.5 9l4 4"/>'),
  star: S('<path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.8 1.1-5.9L3.5 9.8l5.9-.8z"/>'),
  hourglass: S('<path d="M7 3h10M7 21h10"/><path d="M7 3c0 4.5 5 6.4 5 9s-5 4.5-5 9"/><path d="M17 3c0 4.5-5 6.4-5 9s5 4.5 5 9"/>'),
  user: S('<circle cx="12" cy="8.4" r="3.6"/><path d="M5 20c1.4-3.6 4-5.4 7-5.4s5.6 1.8 7 5.4"/>'),
  revision: S('<path d="M4.5 4.5h15v15h-15z"/><path d="M8 9.5l1.6 1.6 3-3.2M8 15.5l1.6 1.6 3-3.2M14.5 10h3M14.5 16h3"/>'),
  case: S('<rect x="3" y="7.5" width="18" height="12" rx="2.2"/><path d="M9 7.5V5.6h6V7.5"/>'),
};
document.getElementById('brand-mark').innerHTML =
  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 1.8 5.8 13.9h4.9L8.9 22.2 18.2 9.8h-5.1z" fill="currentColor"/></svg>';
{
  const aj = document.getElementById('ajustes-btn');
  if(aj) aj.innerHTML = ICON.ajustes + '<span>Ajustes</span>';
  const sb = document.getElementById('search-btn'); if(sb) sb.innerHTML = ICON.search;
  const nb = document.getElementById('notif-btn'); if(nb) nb.innerHTML = ICON.bell;
}

/* ---------- fechas ---------- */
const DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DOWL = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DOWX = ['L','M','X','J','V','S','D'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON3 = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const TODAY = iso(today());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dowIdx = d => (d.getDay()+6)%7;
const startOfWeek = d => addDays(d, -dowIdx(d));
const fmtLong = d => `${d.getDate()} de ${MONTHS[d.getMonth()]}, ${d.getFullYear()}`;
const fmtShort = d => `${d.getDate()}/${pad(d.getMonth()+1)}`;
const fmtBadge = d => `${d.getDate()}/${MON3[d.getMonth()]}`;
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const daysInMonth = mk => new Date(+mk.slice(0,4), +mk.slice(5,7), 0).getDate();

/* ---------- utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const sum = a => a.reduce((t,x)=>t+x,0);
const clone = o => JSON.parse(JSON.stringify(o));
/* Catorce colores para hábitos y proyectos: toda la rueda cromática, a la

/* Sobre los claros —amarillo, lima, verde— el blanco no se lee: la tinta
   se elige midiendo la luminancia real del color. */
function inkFor(hex){
  const n = parseInt(String(hex).slice(1), 16);
  if(isNaN(n)) return '#FFFFFF';
  const lin = v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); };
  const L = .2126*lin((n>>16)&255) + .7152*lin((n>>8)&255) + .0722*lin(n&255);
  return L > .20 ? '#191512' : '#FFFFFF';
}

const LS = 'brujula.v1';
let db = null, dirty = new Set(), flushTimer = null, retryN = 0;
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS); if(!raw) return false;
    const p = JSON.parse(raw); let any = false;
    DOCS.forEach(k => { if(p[k] && typeof p[k]==='object'){ state[k] = Object.assign(blank()[k], p[k]); any = true; } });
    return any;
  }catch(e){ return false; }
}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function setSync(kind){
  const dot = document.getElementById('sync-dot'), lbl = document.getElementById('sync-label');
  const map = {ok:['ok','Sincronizado'], saving:['ok','Guardando…'], local:['local','Guardado en este equipo'], err:['err','Sin guardar · reintentar']};
  const [c,t] = map[kind] || map.local;
  if(dot) dot.className = 'dot ' + c;
  if(lbl) lbl.textContent = t;
}
function touch(...keys){
  keys.forEach(k => { state[k].updatedAt = Date.now(); dirty.add(k); });
  saveLocal();
  if(db){ setSync('saving'); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500); }
}
async function flush(){
  if(!db || !dirty.size) return;
  const keys = [...dirty], failed = [];
  for(const k of keys){
    try{ await db.doc('app/'+k).set(clone(state[k])); dirty.delete(k); }
    catch(e){ failed.push(k); }
  }
  if(failed.length){
    retryN = Math.min(retryN+1, 5); setSync('err');
    clearTimeout(flushTimer); flushTimer = setTimeout(flush, 2000*retryN);
  } else { retryN = 0; setSync('ok'); }
}
async function initDb(){
  try{
    if(!window.claude || typeof window.claude.use !== 'function') return;
    const d = await window.claude.use('db'); if(!d) return;
    db = d; let adopted = false;
    for(const k of DOCS){
      try{
        const s = await db.doc('app/'+k).get();
        if(s.exists){
          const data = clone(s.data());
          if((data.updatedAt||0) >= (state[k].updatedAt||0)){ state[k] = Object.assign(blank()[k], data); adopted = true; }
          else dirty.add(k);
        }
      }catch(e){}
    }
    setSync('ok');
    if(adopted){ if(migrate()) touch('habits','projects','tasks','goals','settings'); saveLocal(); render(); }
    if(dirty.size) flush();
    for(const k of DOCS){
      db.doc('app/'+k).onSnapshot(s => {
        if(!s.exists) return;
        const data = clone(s.data());
        if((data.updatedAt||0) > (state[k].updatedAt||0)){
          state[k] = Object.assign(blank()[k], data); saveLocal(); render();
        }
      }, () => {});
    }
  }catch(e){}
}
/* El color de cada hábito y proyecto queda guardado en su ficha, así que un
   cambio de paleta no alcanza a lo que ya existe. En vez de depender de un
   número de versión —que ya me falló una vez— esto revisa si el color
   guardado sigue siendo parte de la paleta actual, y si no, lo reparte.
   Cualquier cambio futuro de paleta se aplica solo. */
function repaint(){
  const vigente = HCOLORS.map(c => c.toUpperCase());
  let changed = false;
  const fix = (list, paso) => list.forEach((x,i) => {
    if(!vigente.includes(String(x.color||'').toUpperCase())){
      x.color = HCOLORS[(i*paso) % HCOLORS.length];
      changed = true;
    }
  });
  fix(state.habits.list, 1);
  fix(state.projects.list, 3);
  return changed;
}
function migrate(){
  const v = state.settings.migrated || 0;
  const pintado = repaint();
  if(v >= 5) return pintado;
  if(v >= 4){
    /* El color de cada hábito y proyecto está guardado, así que un cambio de
       paleta hay que aplicarlo también a lo que ya existe. Se reparten por
       índice para que queden bien separados entre sí. */
    state.habits.list.forEach((h,i) => { h.color = HCOLORS[i % HCOLORS.length]; });
    state.projects.list.forEach((p,i) => { p.color = HCOLORS[(i*3+1) % HCOLORS.length]; });
    state.settings.migrated = 5;
    return true;
  }
  if(v >= 3){
    /* Objetivos se disuelve dentro de Proyectos: la meta era el resultado
       y el proyecto el trabajo, y en la práctica eran la misma ficha. */
    const dueOf = g => {
      if(!g.period) return '';
      if(g.horizon === 'semana') return iso(addDays(parse(g.period), 6));
      if(g.horizon === 'mes'){ const [y,m] = g.period.split('-').map(Number); return iso(new Date(y, m, 0)); }
      if(g.horizon === 'anio') return `${g.period}-12-31`;
      return '';
    };
    (state.goals.list || []).forEach((g,i) => {
      const p = g.projectId ? state.projects.list.find(x => x.id === g.projectId) : null;
      if(p){
        /* la meta ya apuntaba a un proyecto: se funden en uno solo */
        p.horizon = p.horizon || g.horizon || '';
        p.area = p.area || g.area || '';
        if(!p.due) p.due = dueOf(g);
        if(g.done && p.status !== 'terminado'){ p.status = 'terminado'; p.closedAt = g.doneAt || Date.now(); }
        return;
      }
      state.projects.list.push({id:uid(), name:g.title, emoji:'🎯', color:HCOLORS[i % HCOLORS.length],
        status: g.done ? 'terminado' : 'activo', closedAt: g.done ? (g.doneAt || Date.now()) : null,
        due: dueOf(g), horizon: g.horizon || '', area: g.area || '', notes:'', created: g.created || Date.now()});
    });
    state.goals.list = [];
    state.settings.migrated = 4;
    migrate();
    return true;
  }
  if(v >= 2){
    /* metas por trimestre → metas por semana / mes / año */
    state.goals.list.forEach(g => {
      if(!g.horizon){
        g.horizon = 'anio';
        g.period = String(g.year || today().getFullYear());
        delete g.quarter; delete g.year;
      }
    });
    state.settings.migrated = 3;
    migrate();            /* y de ahí sigue al paso siguiente */
    return true;
  }
  const names = [...new Set(state.tasks.list.map(t => t.project).filter(Boolean))];
  names.forEach((n,i) => {
    if(!state.projects.list.some(p => p.name.toLowerCase() === n.toLowerCase()))
      state.projects.list.push({id:uid(), name:n, color:HCOLORS[i%HCOLORS.length], status:'activo', due:'', notes:'', created:Date.now()});
  });
  state.tasks.list.forEach(t => {
    if(!t.projectId && t.project){
      const p = state.projects.list.find(x => x.name.toLowerCase() === t.project.toLowerCase());
      if(p) t.projectId = p.id;
    }
    if(!t.repeat) t.repeat = 'no';
  });
  state.settings.migrated = 2;
  migrate();              /* y de ahí sigue al paso siguiente */
  return true;
}

const habitDone = (h,d) => !!(state.habits.logs[h.id] && state.habits.logs[h.id][d]);
const isDue = (h,d) => h.freq === 'days' ? (h.days||[]).includes(dowIdx(d)) : true;
function weekCount(h, ws){ let c = 0; for(let i=0;i<7;i++) if(habitDone(h, iso(addDays(ws,i)))) c++; return c; }
function streak(h){
  const from = today();
  if(h.freq === 'weekly'){
    const target = h.target || 3;
    let s = 0, ws = startOfWeek(from), first = true, g = 0;
    while(g++ < 260){
      const c = weekCount(h, ws);
      if(c >= target) s++; else if(!first) break;
      ws = addDays(ws,-7); first = false;
    }
    return s;
  }
  let s = 0, d = new Date(from), g = 0;
  if(isDue(h,d) && !habitDone(h, iso(d))) d = addDays(d,-1);
  while(g++ < 1200){
    if(!isDue(h,d)){ d = addDays(d,-1); continue; }
    if(habitDone(h, iso(d))){ s++; d = addDays(d,-1); } else break;
  }
  return s;
}
function bestStreak(h){
  const dates = Object.keys(state.habits.logs[h.id] || {}).sort();
  if(!dates.length) return 0;
  const end = today();
  if(h.freq === 'weekly'){
    const target = h.target || 3;
    let ws = startOfWeek(parse(dates[0])), best = 0, run = 0;
    while(ws <= end){ if(weekCount(h,ws) >= target){ run++; best = Math.max(best,run); } else run = 0; ws = addDays(ws,7); }
    return best;
  }
  let d = parse(dates[0]), best = 0, run = 0;
  while(d <= end){
    if(isDue(h,d)){ if(habitDone(h, iso(d))){ run++; best = Math.max(best,run); } else run = 0; }
    d = addDays(d,1);
  }
  return best;
}
function rate30(h){
  let due = 0, done = 0;
  for(let i=0;i<30;i++){
    const d = addDays(today(),-i);
    if(h.freq === 'weekly' || isDue(h,d)){ due++; if(habitDone(h, iso(d))) done++; }
  }
  return due ? Math.round(done/due*100) : 0;
}

/* ---------- gráficos ---------- */
function areaChart(vals, labels, col){
  col = col || 'var(--accent)';
  const w = 760, h = 200, pl = 26, pb = 22, pt = 10, pr = 6, n = vals.length;
  if(!n) return '';
  const max = Math.max(1, ...vals);
  const X = i => pl + (w-pl-pr) * (n===1 ? .5 : i/(n-1));
  const Y = v => pt + (h-pt-pb) * (1 - v/max);
  let d = `M ${X(0).toFixed(1)} ${Y(vals[0]).toFixed(1)}`;
  for(let i=0;i<n-1;i++){
    const x0=X(i), y0=Y(vals[i]), x1=X(i+1), y1=Y(vals[i+1]), cx=(x0+x1)/2;
    d += ` C ${cx.toFixed(1)} ${y0.toFixed(1)} ${cx.toFixed(1)} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  const area = `${d} L ${X(n-1).toFixed(1)} ${h-pb} L ${X(0).toFixed(1)} ${h-pb} Z`;
  const steps = Math.min(max, 5);
  let grid = '';
  for(let i=0;i<=steps;i++){
    const v = Math.round(max*i/steps), y = Y(v);
    grid += `<line x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${pl-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--faint)">${v}</text>`;
  }
  let xl = '';
  labels.forEach((l,i) => { if(l) xl += `<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${l}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block;min-width:540px" role="img" aria-label="Hábitos completados por día">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".42"/>
      <stop offset="100%" stop-color="${col}" stop-opacity=".02"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ag)"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>${xl}</svg>`;
}
function ringBig(pct){
  const c = 2*Math.PI*38;
  return `<div class="ring"><svg viewBox="0 0 90 90" width="90" height="90" aria-hidden="true">
    <circle cx="45" cy="45" r="38" fill="none" stroke="var(--surface3)" stroke-width="8"/>
    <circle cx="45" cy="45" r="38" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-clamp(pct,0,100)/100)).toFixed(1)}"
      transform="rotate(-90 45 45)"/></svg><span>${pct}<i>%</i></span></div>`;
}
function donut(pct, col){
  col = col || 'var(--accent)';
  const c = 2*Math.PI*28;

/* ---------- vista: hábitos ---------- */
function viewHabitos(){
  const list = state.habits.list;
  if(!list.length) return `${sampleBanner()}<div class="empty" style="padding:44px 20px">
    <div style="font-size:14px;color:var(--text);font-weight:700;margin-bottom:6px">Sin hábitos todavía</div>
    Empezá con uno solo y sumá cuando ya sea automático.
    <div style="margin-top:14px"><button class="btn pri" data-act="new-habit">${ICON.plus} Crear hábito</button></div></div>`;

  const mode = ui.habitMode, mk = ui.month, [my,mm] = mk.split('-');
  const maxStreak = Math.max(0, ...list.map(streak));
  const head = `
  ${sampleBanner()}
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <span class="streak-pill">🔥 <b>${maxStreak}</b> Racha diaria</span>
    <div class="seg" style="margin-left:auto">
      ${[['diario','Diario'],['mensual','Mensual'],['anual','Anual']].map(([k,l]) =>
        `<button data-act="habit-mode" data-mode="${k}" aria-pressed="${mode===k}">${l}</button>`).join('')}</div>
  </div>`;

  if(mode === 'diario'){
    const wk = startOfWeek(today());
    return head + `<div class="sec">
      <div class="sec-title"><h2>Esta semana</h2><span class="aside">${fmtShort(wk)} — ${fmtShort(addDays(wk,6))}</span></div>
      <div class="card">${list.map(h => {
        const s = streak(h);
        return `<div style="padding:13px 16px;border-top:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:11px;margin-bottom:9px">
            <button class="ico-circle" data-act="edit-habit" data-id="${h.id}" title="Cambiar ícono y color"
              style="background:${h.color}22;box-shadow:inset 0 0 0 1.5px ${h.color}">${h.emoji?esc(h.emoji):'✅'}</button>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:14px">${esc(h.name)}</div>
              <div style="font-size:11px;color:var(--faint)">${esc(freqLabel(h))} · récord ${bestStreak(h)} · ${rate30(h)}% en 30 días</div>
            </div>
            <span class="mono" style="color:var(--accent-text);font-weight:700">${s}</span>
            <button class="icon-btn" data-act="edit-habit" data-id="${h.id}" title="Editar">${ICON.pencil}</button>
          </div>
          <div style="display:flex;gap:5px">${Array.from({length:7},(_,i) => {
            const d = addDays(wk,i), di = iso(d), on = habitDone(h,di), fut = di > TODAY;
            const off = h.freq === 'days' && !isDue(h,d);
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
              <span style="font-size:11px;color:${di===TODAY?'var(--accent)':'var(--faint)'};font-weight:700">${DOW[i]}</span>
              <button class="cell" ${fut?'disabled':''} data-act="toggle-habit" data-id="${h.id}" data-date="${di}"
                aria-label="${DOW[i]}" style="width:100%;height:26px;border-radius:7px;border:1px solid ${on?'transparent':'var(--border2)'};
                background:${on?h.color:'transparent'};color:${on?'#fff':'transparent'};display:grid;place-items:center;
                ${fut?'opacity:.3':''}${off&&!on?';border-style:dashed':''}">${ICON.check}</button>
            </div>`;
          }).join('')}</div></div>`;
      }).join('')}</div></div>`;
  }

  if(mode === 'anual'){
    const year = +my;
    return head + `<div class="sec">
      <div class="sec-title"><h2>${year}</h2>
        <span class="aside">${sum(list.map(h => Object.keys(state.habits.logs[h.id]||{}).filter(d => d.startsWith(year)).length))} marcas en el año</span></div>
      <div class="year-grid">${Array.from({length:12},(_,m) => {
        const nd = new Date(year, m+1, 0).getDate();
        const first = dowIdx(new Date(year, m, 1));
        let cells = '';
        for(let i=0;i<first;i++) cells += '<i style="background:transparent"></i>';
        for(let d=1;d<=nd;d++){
          const di = `${year}-${pad(m+1)}-${pad(d)}`;
          const dd = new Date(year,m,d);
          const dueN = list.filter(h => isDue(h,dd)).length;
          const doneN = list.filter(h => habitDone(h,di)).length;
          const r = dueN ? doneN/dueN : 0;
          const fut = di > TODAY;
          cells += `<i title="${d}/${m+1} · ${doneN}/${dueN}" style="background:${r>0?`color-mix(in srgb, var(--accent) ${Math.round(r*100)}%, var(--surface2))`:'var(--surface2)'};${fut?'opacity:.35':''}"></i>`;
        }
        return `<div class="ymonth card pad"><div class="ml">${MONTHS[m]}</div><div class="ycells">${cells}</div></div>`;
      }).join('')}</div></div>`;
  }

  /* mensual */
  const nd = daysInMonth(mk);
  const vals = [], labels = [];
  for(let d=1;d<=nd;d++){
    const di = `${mk}-${pad(d)}`;
    vals.push(list.filter(h => habitDone(h,di)).length);
    labels.push(d===1||d%5===0 ? String(d) : '');
  }
  const goalTotal = sum(list.map(h => habitGoal(h,mk)));
  const doneTotal = sum(vals);
  const pct = goalTotal ? Math.round(doneTotal/goalTotal*100) : 0;
  const first = dowIdx(new Date(+my, +mm-1, 1));
  const groups = [];
  for(let d=1;d<=nd;d++){
    const wi = Math.floor((d-1+first)/7);
    if(!groups[wi]) groups[wi] = {n:wi+1, span:0};
    groups[wi].span++;
  }

  return head + `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <h2 style="font-size:16px;text-transform:capitalize">${MONTHS[+mm-1]} ${my}</h2>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="round" data-act="month-shift" data-delta="-1" aria-label="Mes anterior">${ICON.left}</button>
      <button class="round" data-act="month-shift" data-delta="1" aria-label="Mes siguiente">${ICON.right}</button>
    </div>
  </div>

  <div class="card pad sec">
    <div class="card-title">Progreso del mes</div>
    <div class="chart-wrap scroll-x">${areaChart(vals, labels, 'var(--blue)')}</div>
    <div class="donut-row">${donut(pct, 'var(--blue)')}
      <div class="kv">
        <div><span>Completados</span><span>${doneTotal}</span></div>
        <div><span>Restantes</span><span>${Math.max(0, goalTotal-doneTotal)}</span></div>
        <div><span>Número de días</span><span>${nd}</span></div>
      </div></div>
  </div>

  <div class="card pad">
    <div class="card-title">Hábitos diarios</div>
    <div class="matrix scroll-x"><table class="mx">
      <thead>
        <tr><th></th><th></th>${groups.map((g,i) =>
          `<th class="wk" colspan="${g.span}" style="color:${WEEKC[i%WEEKC.length]}">SEMANA ${g.n}</th>`).join('')}</tr>
        <tr><th></th><th class="goal" style="font-size:11px">Meta</th>${Array.from({length:nd},(_,i) => {
          const d = new Date(+my, +mm-1, i+1);
          return `<th><div style="color:var(--faint)">${DOW[dowIdx(d)].toLowerCase()}</div><div style="color:var(--muted);font-size:11px">${i+1}</div></th>`;
        }).join('')}</tr>
      </thead>
      <tbody>${list.map(h => `<tr>
        <td class="name"><button data-act="edit-habit" data-id="${h.id}" title="Cambiar ícono y color"
          style="display:inline-flex;align-items:center;gap:6px;font:inherit">
          <span class="dot-color" style="background:${h.color}"></span>${h.emoji?esc(h.emoji)+' ':''}${esc(h.name)}</button></td>
        <td class="goal">${habitGoal(h,mk)}</td>
        ${Array.from({length:nd},(_,i) => {
          const d = new Date(+my, +mm-1, i+1), di = `${mk}-${pad(i+1)}`;
          const on = habitDone(h,di), fut = di > TODAY;
          const c = WEEKC[Math.floor((i+first)/7) % WEEKC.length];
          return `<td><button class="cell ${on?'on':''} ${fut?'fut':''}" ${fut?'disabled':''}
            data-act="toggle-habit" data-id="${h.id}" data-date="${di}" aria-label="${esc(h.name)} ${i+1}"
            style="${on?`background:${c}`:''}">${ICON.check}</button></td>`;
        }).join('')}</tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ---------- vista: tareas ---------- */
const subsOf = t => Array.isArray(t.subs) ? t.subs : [];
const subsDone = t => subsOf(t).filter(s => s.done).length;
function taskRow(t, showDate){

  const pn = projName(t);
  const subs = subsOf(t), sd = subsDone(t);
