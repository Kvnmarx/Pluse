  return `<div class="row-wrap ${t.done?'done':''}">
    <div class="row">
      <button class="check" data-act="toggle-task" data-id="${t.id}" aria-pressed="${!!t.done}" aria-label="Completar"
        style="--hc:${t.projectId?projColor(t):'var(--accent)'}">${ICON.check}</button>
      <div class="grow"><div class="t">${esc(t.title)}</div>
        <div class="m"><span class="pill ${t.priority}">${t.priority}</span>
          ${pn?`<span class="pill tag" style="color:${projColor(t)}">${projEmoji(t)}${esc(pn)}</span>`:''}
          ${t.repeat&&t.repeat!=='no'?`<span class="pill rep">${esc(REPLABEL[t.repeat]||t.repeat)}</span>`:''}
          ${subs.length?`<button class="pill subs ${sd===subs.length?'full':''}" data-act="expand-task" data-id="${t.id}"
            aria-expanded="${open}">${sd}/${subs.length} subtareas</button>`:''}
          ${t.date?`<span style="${late?'color:var(--bad);font-weight:700':''}">${late?'Atrasada · ':''}${(showDate||late)?fmtShort(parse(t.date)):(t.date===TODAY?'Hoy':fmtShort(parse(t.date)))}</span>`:'<span>Sin fecha</span>'}
          ${t.notes?`<span title="${esc(t.notes)}">· ${esc(t.notes.slice(0,40))}${t.notes.length>40?'…':''}</span>`:''}</div></div>
      <div class="row-acts">
        <button class="icon-btn" data-act="edit-task" data-id="${t.id}" title="Editar">${ICON.pencil}</button>
        <button class="icon-btn" data-act="del-task" data-id="${t.id}" title="Borrar">${ICON.trash}</button></div>
    </div>
    ${open && subs.length ? `<div class="sublist">${subs.map(s => `<div class="subrow">
      <button class="check sm" data-act="toggle-sub" data-id="${t.id}" data-sid="${s.id}" aria-pressed="${!!s.done}"
        aria-label="Completar ${esc(s.title)}">${ICON.check}</button>
      <span style="flex:1;min-width:0${s.done?';text-decoration:line-through;color:var(--faint)':''}">${esc(s.title)}</span>
      <button class="mini" data-act="del-sub" data-id="${t.id}" data-sid="${s.id}" title="Borrar">${ICON.x}</button></div>`).join('')}
      <div class="addline" style="margin-top:6px"><input data-addsub="${t.id}" placeholder="Nueva subtarea">
        <button data-act="add-sub" data-id="${t.id}" aria-label="Agregar">${ICON.plus}</button></div>
    </div>` : ''}
  </div>`;
}
function viewTareas(){
  const F = ui.taskFilter;
  const wkEnd = iso(addDays(startOfWeek(today()),6));
  const all = ui.taskProject ? state.tasks.list.filter(t => t.projectId === ui.taskProject) : state.tasks.list;
  const filters = [
    ['hoy','Hoy', all.filter(t=>!t.done && t.date && t.date<=TODAY)],
    ['semana','Esta semana', all.filter(t=>!t.done && t.date && t.date<=wkEnd)],
    ['sinfecha','Sin fecha', all.filter(t=>!t.done && !t.date)],
    ['todas','Todas', all.filter(t=>!t.done)],
    ['hechas','Completadas', all.filter(t=>t.done)],
  ];
  const active = filters.find(f => f[0]===F) || filters[0];
  const list = sortTasks(active[2]);
  const proj = ui.taskProject ? projById(ui.taskProject) : null;
  const late = sortTasks(all.filter(t => !t.done && t.date && t.date < TODAY));
  const byProj = state.projects.list.map(p => ({p, ...projStats(p)})).filter(x => x.open > 0).sort((a,b)=>b.open-a.open);

  return `
  ${sampleBanner()}
  ${late.length ? `<section class="alert" aria-label="Tareas pendientes">
    <div class="alert-head">${ICON.alerta}
      <b>${late.length} tarea${late.length===1?'':'s'} quedó pendiente${late.length===1?'':'s'} de días anteriores</b>
      <button class="btn sm" data-act="reschedule-overdue">Pasar todas a hoy</button></div>
    <div class="alert-list">${late.slice(0,6).map(t => `<div class="alert-row">
      <button class="check" data-act="toggle-task" data-id="${t.id}" aria-label="Completar">${ICON.check}</button>
      <span class="grow">${esc(t.title)}</span>
      <span class="ago">${daysBetween(t.date,TODAY)} d</span>
      <button class="btn sm" data-act="task-to-today" data-id="${t.id}">Hoy</button></div>`).join('')}
      ${late.length>6?`<div class="more">y ${late.length-6} más en la lista de abajo.</div>`:''}</div></section>` : ''}
  ${proj ? `<div class="filter-note" style="margin-bottom:16px">Proyecto: ${esc(proj.name)}
    <button data-act="clear-proj-filter" aria-label="Quitar filtro" style="display:grid;place-items:center;color:inherit">${ICON.x}</button></div>` : ''}

  <div class="tiles">
    <div class="tile" style="--tint:#6E92B8"><div class="k">Abiertas</div><div class="v">${all.filter(t=>!t.done).length}</div><div class="s">${byProj.length} proyecto${byProj.length===1?'':'s'} con pendientes</div></div>

    <div class="tile accent"><div class="k">Prioridad alta</div><div class="v">${all.filter(t=>!t.done&&t.priority==='alta').length}</div><div class="s">Sin completar</div></div>

  ${byProj.length ? `<div class="sec">
    <div class="sec-title"><h2>Pendientes por proyecto</h2>
      <a class="aside" href="#/proyectos" style="color:var(--accent-text);text-decoration:none">Ver proyectos →</a></div>
    <div class="card pad bars">${byProj.map(({p,open,total,pct}) => `<div class="bar-row">
      <div class="bar-top"><span>${esc(p.name)}</span><span class="pct">${pct}%</span><span class="amt">${open}/${total}</span></div>
      <div class="track"><i style="width:${Math.round(open/byProj[0].open*100)}%;background:${p.color}"></i></div></div>`).join('')}</div>
  </div>` : ''}`;
}

  <div class="sec-title" style="flex-wrap:wrap">

          <button class="icon-btn" data-act="edit-project" data-id="${p.id}" title="Editar">${ICON.pencil}</button>

  }).join('')}</div>` : emptyState(ICON.proyectos, 'Nada en este filtro',

/* ---------- vista: semana ---------- */
function viewSemana(){
  const ws = parse(ui.weekStart);
  const days = Array.from({length:7},(_,i)=>addDays(ws,i));
  const a = ws, b = addDays(ws,6);
  const rango = a.getMonth() === b.getMonth()
    ? `${a.getDate()} al ${b.getDate()} de ${MONTHS[a.getMonth()]}`
    : `${a.getDate()} de ${MONTHS[a.getMonth()]} al ${b.getDate()} de ${MONTHS[b.getMonth()]}`;

  return `
  ${sampleBanner()}
  <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
    <div class="weekdays">${DOWX.map((x,i) => {
      const d = addDays(ws,i), ts = tasksOn(iso(d));
      const allDone = ts.length && ts.every(t => t.done);
      return `<button class="wd" aria-pressed="${iso(d)===TODAY}" title="${DOWL[i]}${allDone?' · completo':''}"
        data-act="scroll-day" data-date="${iso(d)}">${x}</button>`;
    }).join('')}</div>
  </div>
  <div class="weeknav">
    <button class="round" data-act="week-shift" data-delta="-1" aria-label="Semana anterior">${ICON.left}</button>
    <div class="lbl"><b>${rango}</b><a href="#" data-act="week-today">Volver a hoy</a></div>
    <button class="round" data-act="week-shift" data-delta="1" aria-label="Semana siguiente">${ICON.right}</button>
  </div>
  <div class="week">${days.map((d,i) => {
    const di = iso(d), ts = tasksOn(di), tr = trainOn(di);
    const done = ts.filter(t=>t.done).length;
    const hDue = state.habits.list.filter(h => isDue(h,d));
    const hDone = hDue.filter(h => habitDone(h,di)).length;
    const j = jday(di);
    return `<div class="day ${di===TODAY?'today':''}" id="day-${di}" data-drop="${di}">
      <div class="day-head"><h3>${DOWL[i]}</h3><span class="pill date">${fmtBadge(d)}</span>
        <span style="margin-left:auto;display:flex;gap:4px;align-items:center">
          ${hDue.length?`<span class="badge h" title="Hábitos">${hDone}/${hDue.length}</span>`:''}
          ${tr.length?`<span class="badge t" title="Entrenamiento">${sum(tr.map(s=>+s.minutes||0))}′</span>`:''}
          <button class="mini" data-act="clear-day" data-date="${di}" title="Borrar las tareas del día">${ICON.trash}</button>
        </span></div>
      ${tr.length?`<div><div class="day-lab">Entreno</div><div class="agenda">${tr.map(s =>
        `<div class="ag"><span class="t">${s.minutes}′</span><span class="b">${esc(s.type)}</span></div>`).join('')}</div></div>`:''}
      <div>
        <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:5px">
          <span class="mono">${done}/${ts.length}</span> tareas</div>
        <div class="progline"><i style="width:${ts.length?Math.round(done/ts.length*100):0}%"></i></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px">${ts.map(t => {
        const subs = subsOf(t);
        return `
        <div class="wtask ${t.done?'done':''} ${kbDrag&&kbDrag.id===t.id?'grabbed':''}" draggable="true" data-drag="${t.id}"
          tabindex="0" role="button" aria-grabbed="${!!(kbDrag&&kbDrag.id===t.id)}"
          aria-label="${esc(t.title)}, ${DOWL[i]}. Enter para agarrarla y moverla con las flechas.">
          <button class="check" data-act="toggle-task" data-id="${t.id}" aria-pressed="${!!t.done}" aria-label="Completar">${ICON.check}</button>
          <span class="tx">${t.repeat&&t.repeat!=='no'?'🔁 ':''}${esc(t.title)}${subs.length?`<span class="submini mono">${subsDone(t)}/${subs.length}</span>`:''}</span>
          <button class="mini" data-act="shift-task" data-id="${t.id}" data-delta="1" title="Pasar al día siguiente">${ICON.clock}</button>
          <button class="mini" data-act="del-task" data-id="${t.id}" title="Borrar">${ICON.x}</button>
        </div>`; }).join('') || `<div class="muted" style="font-size:12.5px;padding:2px 0">Sin tareas todavía.</div>`}</div>
      <div class="addline"><input data-addday="${di}" placeholder="Nueva tarea" aria-label="Nueva tarea en ${DOWL[i]}">
        <button data-act="add-day-task" data-date="${di}" aria-label="Agregar">${ICON.plus}</button></div>
      <div class="prize"><div class="k">🏆 Tu premio</div>
        <input class="field-line" data-j="prize" data-date="${di}" placeholder="¿Con qué te vas a premiar?" value="${esc(j.prize||'')}"></div>
    </div>`;
  }).join('')}</div>
  <p class="muted" style="font-size:12.5px;margin-top:14px">
    Arrastrá una tarea a otro día para moverla, o con el teclado:
    <span class="kbd">Tab</span> hasta la tarea, <span class="kbd">Enter</span> para agarrarla,
    <span class="kbd">←</span> <span class="kbd">→</span> para cambiar de día,
    <span class="kbd">↑</span> <span class="kbd">↓</span> para saltar una semana,
    <span class="kbd">Enter</span> para soltarla y <span class="kbd">Esc</span> para cancelar.</p>`;

/* ---------- vista: entrenamiento ---------- */
function viewEntrenamiento(){
  const list = [...state.training.list].sort((a,b)=>b.date.localeCompare(a.date));
  const wk = startOfWeek(today());
  const wkS = list.filter(s => s.date >= iso(wk) && s.date <= TODAY);
  const last8 = Array.from({length:8},(_,i) => {
    const s = addDays(wk,-(7-i)*7), e = addDays(s,6);
    const it = list.filter(x => x.date >= iso(s) && x.date <= iso(e));
    const porTipo = TTYPES.map(t => ({t, min: sum(it.filter(x => x.type === t).map(x => +x.minutes||0))})).filter(x => x.min);
    return {s, min:sum(it.map(x=>+x.minutes||0)), n:it.length, porTipo};
  });
  const maxMin = Math.max(60, ...last8.map(w=>w.min));
  const byType = TTYPES.map(t => ({t, n:list.filter(s=>s.type===t).length})).filter(x=>x.n);
  const vol30 = sum(list.filter(s => s.date <= TODAY && daysBetween(s.date,TODAY) <= 30).map(volume));
  const prs = {};
  list.forEach(s => (s.exercises||[]).forEach(e => {
    if(!e.name || !(+e.kg > 0)) return;
    if(!prs[e.name] || +e.kg > prs[e.name].kg) prs[e.name] = {kg:+e.kg, reps:+e.reps||0, date:s.date};
  }));
  const prList = Object.entries(prs).sort((a,b)=>b[1].kg-a[1].kg).slice(0,6);

  return `
  ${sampleBanner()}
  <div class="tiles">
    <div class="tile accent"><div class="k">Esta semana</div><div class="v">${wkS.length}</div><div class="s">${sum(wkS.map(s=>+s.minutes||0))} minutos</div></div>
    <div class="tile" style="--tint:#6E92B8"><div class="k">Sesiones totales</div><div class="v">${list.length}</div><div class="s">${byType.map(x=>`${x.t} ${x.n}`).join(' · ')||'—'}</div></div>
    <div class="tile" style="--tint:#9E82B2"><div class="k">Volumen 30 días</div><div class="v" style="font-size:20px">${moneyK(vol30)} kg</div><div class="s">Series × reps × peso</div></div>
    <div class="tile" style="--tint:#5C9B95"><div class="k">Promedio</div><div class="v">${list.length?Math.round(sum(list.map(s=>+s.minutes||0))/list.length):0}′</div><div class="s">Por sesión</div></div>
  </div>

  <div class="card pad sec">
    <div class="card-title">Minutos por semana <span class="muted" style="font-weight:500;font-size:12.5px">· por tipo de sesión</span></div>
    <div class="vbars">${last8.map(w => `<div class="vb">
      <div class="stack" style="flex-direction:column;justify-content:flex-end;gap:2px">
        ${w.porTipo.length ? w.porTipo.map(({t,min}) =>
          `<i style="width:100%;flex:none;height:${Math.round(min/maxMin*100)}%;background:${TYPE_COLORS[t]};border-radius:${t===w.porTipo[0].t?'4px 4px 0 0':'0'}" title="${t}: ${min} min"></i>`).join('')
        : `<i style="width:100%;flex:none;height:2px;background:var(--surface3)"></i>`}
      </div>
      <div class="lbl">${fmtShort(w.s)}</div></div>`).join('')}</div>
    <div class="legend" style="flex-wrap:wrap">
      ${TTYPES.map(t => `<span><b style="background:${TYPE_COLORS[t]}"></b>${t}</span>`).join('')}
      <span class="mono" style="margin-left:auto">Pico ${maxMin}′</span></div>
  </div>

  ${prList.length ? `<div class="card pad sec"><div class="card-title">Récords personales</div>
    ${prList.map(([n,r]) => `<div class="ex"><span>${esc(n)}</span>
      <span class="nums">${r.kg} kg × ${r.reps} · ${fmtShort(parse(r.date))}</span></div>`).join('')}</div>` : ''}

  <div class="sec">
    <div class="sec-title"><h2>Sesiones</h2></div>
    ${list.length ? `<div class="rows">${list.map(s => {
      const open = ui.openTraining === s.id;
      return `<div class="row" style="flex-direction:column;align-items:stretch;gap:0">
        <div style="display:flex;align-items:center;gap:11px">
          <div class="ico-circle" style="background:var(--info-soft);color:var(--info)">${ICON.entrenamiento}</div>
          <div class="grow"><div class="t">${esc(s.type)} · <span class="mono">${s.minutes}′</span>
            ${volume(s)?`<span class="mono" style="color:var(--faint);font-weight:400"> · ${moneyK(volume(s))} kg</span>`:''}</div>
            <div class="m"><span>${DOWL[dowIdx(parse(s.date))]} ${fmtShort(parse(s.date))}</span>
              ${s.intensity?`<span class="pill tag">intensidad ${s.intensity}/5</span>`:''}
              ${s.notes?`<span>· ${esc(s.notes.slice(0,46))}${s.notes.length>46?'…':''}</span>`:''}</div></div>
          <div class="row-acts">
            ${(s.exercises||[]).length?`<button class="btn sm" data-act="expand-training" data-id="${s.id}">${open?'Ocultar':`${s.exercises.length} ejercicios`}</button>`:''}
            <button class="icon-btn" data-act="edit-training" data-id="${s.id}" title="Editar">${ICON.pencil}</button>
            <button class="icon-btn" data-act="del-training" data-id="${s.id}" title="Borrar">${ICON.trash}</button></div></div>
        ${open?`<div class="exs">${s.exercises.map(e => `<div class="ex"><span>${esc(e.name)}</span>
          <span class="nums">${e.sets||0} × ${e.reps||0}${+e.kg?` · ${e.kg} kg`:''}</span></div>`).join('')}</div>`:''}
      </div>`;
    }).join('')}</div>` : emptyState(ICON.entrenamiento, 'Sin entrenamientos',
      'Registrá tu primera sesión y vas a ver tu volumen, tus minutos y tus récords.',
      '<button class="btn sm" data-act="new-training">Registrar sesión</button>')}
  </div>`;
}

/* ---------- vista: finanzas ---------- */
function viewFinanzas(){
  const mk = ui.month, mt = monthTotals(mk);
  const list = [...txnsInMonth(mk)].sort((a,b)=>b.date.localeCompare(a.date));
  const gastos = list.filter(t=>t.kind==='gasto');
  const byCat = CATS.gasto.map(c => ({c, v:sum(gastos.filter(t=>t.cat===c).map(t=>+t.amount||0))}))
    .filter(x => x.v>0 || state.finance.budgets[x.c]).sort((a,b)=>b.v-a.v);
  const maxCat = Math.max(1, ...byCat.map(x => Math.max(x.v, state.finance.budgets[x.c]||0)));
  const months = Array.from({length:6},(_,i) => {
    const d = new Date(+mk.slice(0,4), +mk.slice(5,7)-1-(5-i), 1);
    return {d, k:monthKey(d), ...monthTotals(monthKey(d))};
  });
  const maxM = Math.max(1, ...months.map(m => Math.max(m.ing, m.gas)));
  const [my,mm] = mk.split('-');

  return `
  ${sampleBanner()}
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <h2 style="font-size:16px;text-transform:capitalize">${MONTHS[+mm-1]} ${my}</h2>
    <div style="display:flex;gap:6px;margin-left:auto">
      <button class="round" data-act="month-shift" data-delta="-1" aria-label="Mes anterior">${ICON.left}</button>
      <button class="round" data-act="month-shift" data-delta="1" aria-label="Mes siguiente">${ICON.right}</button>
      <button class="btn pri sm" data-act="new-txn">${ICON.plus} Movimiento</button></div></div>

  <div class="tiles">
    <div class="tile good"><div class="k">Ingresos</div><div class="v" style="font-size:20px">${money(mt.ing)}</div><div class="s">${list.filter(t=>t.kind==='ingreso').length} movimientos</div></div>
    <div class="tile bad"><div class="k">Gastos</div><div class="v" style="font-size:20px">${money(mt.gas)}</div><div class="s">${gastos.length} movimientos</div></div>
    <div class="tile ${mt.bal>=0?'good':'bad'}"><div class="k">Balance</div><div class="v" style="font-size:20px">${money(mt.bal)}</div><div class="s">${mt.bal>=0?'A favor':'En rojo'}</div></div>
    <div class="tile accent"><div class="k">Tasa de ahorro</div><div class="v">${mt.rate}%</div><div class="s">${mt.ing?`de ${money(mt.ing)}`:'sin ingresos'}</div></div>
  </div>

  <div class="card pad sec">
    <div class="card-title">Gastos por categoría <span class="muted" style="font-weight:500;font-size:12.5px">· la línea marca el presupuesto</span></div>
    ${byCat.length ? `<div class="bars">${byCat.map(({c,v}) => {
      const b = +state.finance.budgets[c] || 0, over = b && v > b;
      const pct = mt.gas ? Math.round(v/mt.gas*100) : 0;
      return `<div class="bar-row">

function shiftPeriod(h, p, d){

  if(h === 'mes'){ const [y,m] = p.split('-').map(Number); return monthKey(new Date(y, m-1+d, 1)); }

/* ---------- vista: rueda de la vida ---------- */
function radar(cur, prev){
  const size = 430, cx = size/2, cy = size/2, R = 108, n = AREAS.length;
  const pt = (i,v) => { const a = -Math.PI/2 + i*2*Math.PI/n, r = R*clamp(v,0,10)/10;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const poly = vals => vals.map((v,i) => pt(i,v).map(x => x.toFixed(1)).join(',')).join(' ');
  let rings = '';
  [2,4,6,8,10].forEach(v => {
    rings += `<polygon points="${poly(AREAS.map(()=>v))}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  });
  let axes = '', labels = '';
  AREAS.forEach(([k,name],i) => {
    const [x,y] = pt(i,10);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    const [lx,ly] = pt(i,12.8);
    const anchor = Math.abs(lx-cx) < 12 ? 'middle' : (lx > cx ? 'start' : 'end');
    const words = name.split(' ');
    const half = words.length > 2 ? Math.ceil(words.length/2) : words.length;
    const lines = words.length > 2 ? [words.slice(0,half).join(' '), words.slice(half).join(' ')] : [name];
    labels += lines.map((l,li) =>
      `<text x="${lx.toFixed(1)}" y="${(ly + li*11 - (lines.length-1)*5).toFixed(1)}" text-anchor="${anchor}"
        font-size="10.5" fill="var(--muted)">${esc(l)}</text>`).join('');
  });
  const curV = AREAS.map(([k]) => +cur[k] || 0);
  const prevV = AREAS.map(([k]) => +prev[k] || 0);
  const dots = curV.map((v,i) => { const [x,y] = pt(i,v);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"/>`; }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:430px;height:auto;display:block" role="img" aria-label="Rueda de la vida">
    ${rings}${axes}
    ${prevV.some(v=>v) ? `<polygon points="${poly(prevV)}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3"/>` : ''}
    <polygon points="${poly(curV)}" fill="var(--accent)" fill-opacity=".2" stroke="var(--accent)" stroke-width="2"/>
    ${dots}${labels}</svg>`;
}
function lineChart(series, labels, max){
  const w = 760, h = 216, pl = 26, pb = 24, pt = 10, pr = 10, n = labels.length;
  const X = i => pl + (w-pl-pr) * (n===1 ? .5 : i/(n-1));
  const Y = v => pt + (h-pt-pb) * (1 - clamp(v,0,max)/max);
  let grid = '';
  for(let v=0; v<=max; v+=max/5){
    const y = Y(v);
    grid += `<line x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${pl-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--faint)">${Math.round(v)}</text>`;
  }
  let xl = '';
  labels.forEach((l,i) => { xl += `<text x="${X(i).toFixed(1)}" y="${h-7}" text-anchor="middle" font-size="10.5"
    fill="${i===labels.length-1?'var(--accent)':'var(--faint)'}">${esc(l)}</text>`; });
  const paths = series.map(s => {
    let d = '', open = false, dots = '';
    s.values.forEach((v,i) => {
      if(v == null){ open = false; return; }
      const x = X(i).toFixed(1), y = Y(v).toFixed(1);
      d += (open ? ` L ${x} ${y}` : ` M ${x} ${y}`);
      open = true;
      if(s.dots) dots += `<circle cx="${x}" cy="${y}" r="3.2" fill="${s.color}"><title>${esc(s.name)} · ${v}/10</title></circle>`;

function wheelEvolution(year){
  const keys = Array.from({length:12},(_,m) => `${year}-${pad(m+1)}`);
  const labels = MON3.map(m => m.slice(0,3).toLowerCase());
  const has = keys.some(k => state.wheel.months[k]);
  const sel = ui.wheelArea;
  const valOf = (k, area) => {
    const mo = state.wheel.months[k];
    if(!mo) return null;
    const v = +mo[area];
    return v > 0 ? v : null;
  };
  const avgOf = k => {
    const mo = state.wheel.months[k];
    if(!mo) return null;
    const vs = AREAS.map(([a]) => +mo[a] || 0).filter(v => v > 0);
    return vs.length ? +(sum(vs)/vs.length).toFixed(1) : null;
  };
  const series = sel === 'todas'
    ? [...AREAS.map(([a,n],i) => ({name:n, color:AREA_COLORS[i], values:keys.map(k => valOf(k,a)), w:1.6, op:.75})),
       {name:'Promedio', color:'var(--text)', values:keys.map(avgOf), w:2.6, dash:true, dots:true}]
    : (() => {
        const i = AREAS.findIndex(([a]) => a === sel);
        const [a,n] = AREAS[i];
        return [{name:'Promedio', color:'var(--faint)', values:keys.map(avgOf), w:1.6, dash:true, op:.7},
                {name:n, color:AREA_COLORS[i], values:keys.map(k => valOf(k,a)), w:3, dots:true}];
      })();

  let resumen = '';
  if(sel !== 'todas'){
    const vals = keys.map(k => valOf(k,sel)).filter(v => v != null);
    if(vals.length > 1){
      const d = vals[vals.length-1] - vals[0];
      resumen = `Arrancaste el año en ${vals[0]}/10 y estás en ${vals[vals.length-1]}/10:
        <strong style="color:${d>0?'var(--good)':d<0?'var(--bad)':'var(--muted)'}">${d>0?`subiste ${d}`:d<0?`bajaste ${Math.abs(d)}`:'sin cambios'}</strong>
        en ${vals.length} evaluaciones.`;
    } else if(vals.length === 1) resumen = 'Con una sola evaluación todavía no hay curva. Puntuá otro mes para ver la evolución.';
  } else {
    const evaluados = keys.filter(k => state.wheel.months[k]).length;
    resumen = `${evaluados} de 12 meses evaluados este año. La línea blanca punteada es el promedio de las ocho áreas.`;
  }

  return `<div class="sec" style="margin-top:22px">
    <div class="sec-title"><h2>Evolución del año</h2><span class="aside">${year}</span></div>
    <div class="card pad">
      <div class="chips" style="margin-bottom:14px">
        <button class="chip" data-act="wheel-area" data-area="todas" aria-pressed="${sel==='todas'}">Todas</button>
        ${AREAS.map(([a,n],i) => `<button class="chip" data-act="wheel-area" data-area="${a}" aria-pressed="${sel===a}"
          style="${sel===a?'':`border-color:${AREA_COLORS[i]}44`}">
          <span class="dot-color" style="background:${AREA_COLORS[i]};width:8px;height:8px;border-radius:99px"></span> ${esc(n)}</button>`).join('')}
      </div>
      ${has ? `<div class="chart-wrap scroll-x">${lineChart(series, labels, 10)}</div>
        <div class="muted" style="font-size:12.5px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">${resumen}</div>`
      : `<div class="empty">Puntuá al menos un mes para ver la curva del año.</div>`}
    </div>
  </div>`;
}

/* ---------- vista: revisión semanal ---------- */
function weekReport(wsISO){
  const ws = parse(wsISO), we = addDays(ws,6), a = wsISO, b = iso(we);
  const inW = d => d >= a && d <= b;
  let due = 0, done = 0;
  const perHabit = state.habits.list.map(h => {
    let hd = 0, hdo = 0;
    for(let i=0;i<7;i++){
      const d = addDays(ws,i), di = iso(d);
      if(di > TODAY) continue;
      if(h.freq === 'weekly' || isDue(h,d)){ hd++; due++; if(habitDone(h,di)){ hdo++; done++; } }
    }
    return {h, due:hd, done:hdo, pct: hd ? Math.round(hdo/hd*100) : 0};
  }).filter(x => x.due > 0);
  const orden = [...perHabit].sort((x,y) => y.pct - x.pct);
  const cerradas = state.tasks.list.filter(t => t.done && t.doneAt && inW(iso(new Date(t.doneAt))));
  const quedaron = state.tasks.list.filter(t => !t.done && t.date && t.date >= a && t.date <= b);
  const tr = state.training.list.filter(s => inW(s.date));
  const fin = state.finance.list.filter(t => inW(t.date));
  const ing = sum(fin.filter(t=>t.kind==='ingreso').map(t=>+t.amount||0));
  const gas = sum(fin.filter(t=>t.kind==='gasto').map(t=>+t.amount||0));
  const foc = state.focus.list.filter(f => inW(f.date));
  const rit = Object.keys(state.journal.days).filter(d => inW(d) && hasRitual(d)).length;
  const metas = state.projects.list.filter(p => p.status === 'terminado' && p.closedAt && inW(iso(new Date(p.closedAt))));
  const moods = Object.entries(state.journal.days).filter(([d,j]) => inW(d) && j.mood != null).map(([,j]) => j.mood);
  return {ws, we, due, done, pct: due ? Math.round(done/due*100) : 0, perHabit, orden,
    cerradas, quedaron, tr, trMin: sum(tr.map(s=>+s.minutes||0)), ing, gas, foc, rit, metas,
    mood: moods.length ? (sum(moods)/moods.length) : null};
}

  for(let i=0;i<days;i++){

  }
  const pct = due ? Math.round(done/due*100) : 0;
  const rachas = state.habits.list.map(h => ({h, s:streak(h)})).filter(x => x.s > 0).sort((a,b)=>b.s-a.s).slice(0,5);
  const mejores = state.habits.list.map(h => ({h, r:rate30(h)})).sort((a,b)=>b.r-a.r).slice(0,5);
  const inRange = di => di >= iso(from) && di <= TODAY;

  const ev = [

    ['Tareas cerradas',
      state.tasks.list.filter(t => t.done && t.doneAt && inRange(iso(new Date(t.doneAt)))).length,

    </div>

    <div class="card pad">

      ${rachas.length ? rachas.map(({h,s}) => `<div class="rank">
        <span class="e">${h.emoji?esc(h.emoji):'✅'}</span>
        <span class="nm">${esc(h.name)}</span>
        <span class="mono" style="font-weight:700">${s}</span><span>🔥</span></div>`).join('')

/* ---------- vista: enfoque + memento mori ---------- */
const TIMER_MODES = {enfoque:['Enfoque',25], corto:['Descanso corto',5], largo:['Descanso largo',15]};
const timer = {mode:'enfoque', left:25*60, running:false, h:null};
function timerTotal(){ return TIMER_MODES[timer.mode][1]*60; }
function timerText(){ const m = Math.floor(timer.left/60), s = timer.left%60; return `${pad(m)}:${pad(s)}`; }
function updateTimerDOM(){
  const t = document.getElementById('timer-time');
  if(t) t.textContent = timerText();
  const ring = document.getElementById('timer-ring');
  if(ring){
    const c = 2*Math.PI*86;
    ring.setAttribute('stroke-dashoffset', String(c * (timer.left/timerTotal())));
  }
  const b = document.getElementById('timer-btn');
  if(b) b.innerHTML = timer.running ? ICON.pause : ICON.play;
}
function timerTick(){
  if(timer.left > 0){ timer.left--; updateTimerDOM(); return; }
  clearInterval(timer.h); timer.h = null; timer.running = false;
  if(timer.mode === 'enfoque'){
    state.focus.list.push({id:uid(), date:TODAY, minutes:TIMER_MODES.enfoque[1], at:Date.now()});

  const out = [], add = (g,items) => { if(items.length) out.push({group:g, items:items.slice(0,6)}); };
  add('Tareas', state.tasks.list.filter(t => hit(t.title)||hit(t.notes)).map(t => ({kind:'task', id:t.id, icon:ICON.tareas,
    label:t.title, sub:(t.done?'hecha · ':'')+(t.date?fmtShort(parse(t.date)):'sin fecha')})));
  add('Proyectos', state.projects.list.filter(p => hit(p.name)||hit(p.notes)).map(p => ({kind:'project', id:p.id, icon:ICON.proyectos, label:p.name, sub:(p.horizon?HZ_LABEL[p.horizon]+' · ':'')+p.status})));
  add('Anotaciones', state.notes.list.filter(n => hit(n.title)||hit(n.body)).map(n => ({kind:'note', id:n.id, icon:ICON.anotaciones, label:n.title, sub:n.cat})));
  add('Hábitos', state.habits.list.filter(h => hit(h.name)).map(h => ({kind:'habit', id:h.id, icon:ICON.habitos, label:h.name, sub:freqLabel(h)})));
  add('Movimientos', state.finance.list.filter(t => hit(t.desc)||hit(t.cat)).map(t => ({kind:'txn', id:t.id, icon:ICON.finanzas,
    label:t.desc||t.cat, sub:`${money(+t.amount||0)} · ${fmtShort(parse(t.date))}`})));
  add('Entrenamientos', state.training.list.filter(s => hit(s.type)||hit(s.notes)||(s.exercises||[]).some(e => hit(e.name)))
    .map(s => ({kind:'training', id:s.id, icon:ICON.entrenamiento, label:`${s.type} · ${s.minutes}′`, sub:fmtShort(parse(s.date))})));
  return out;
}

async function exportData(){
  const payload = {app:'pluse', version:3, exportedAt:new Date().toISOString(),
    data: DOCS.reduce((o,k) => (o[k] = state[k], o), {})};
  const json = JSON.stringify(payload, null, 2);
  const filename = `pluse-${TODAY}.json`;
  /* dentro de claude.ai la descarga la hace la plataforma */
  try{
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename, data:json}); toast('Copia descargada'); return; }
  }catch(e){}
  /* instalada como app, alcanza con un enlace de descarga común */
  try{
    const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Copia descargada'); return;
  }catch(e){}
  openForm({title:'Copia de seguridad', saveLabel:'Listo',
    fields:[{k:'json', label:'Copiá este texto y guardalo en un archivo .json', type:'textarea', wide:true}],
    values:{json}, onSave:()=>{}});
  setTimeout(()=>{ const t = document.getElementById('f_json'); if(t){ t.style.minHeight='240px'; t.select(); } }, 40);
}
function importData(text){
  try{
    const p = JSON.parse(text), d = p && p.data ? p.data : p;
    if(!d || typeof d !== 'object' || !d.tasks || !Array.isArray(d.tasks.list))
      return toast('Ese archivo no parece una copia de Pluse');
    snap('importar datos');
    DOCS.forEach(k => { if(d[k]) state[k] = Object.assign(blank()[k], d[k]); });
    state.settings.sample = false; migrate(); touch(...DOCS);
    document.getElementById('modal-root').innerHTML = '';
    render(); toast('Datos importados', true);
  }catch(e){ toast('No pude leer el archivo: no es un JSON válido'); }
}

function addDayTask(dateISO, input){
  const title = (input.value||'').trim();
  if(!title) return;
  snap('crear tarea');
  state.tasks.list.push({id:uid(), title, priority:'media', date:dateISO, projectId:'', repeat:'no',
    notes:'', done:false, doneAt:null, created:Date.now()});
  input.value = '';
  touch('tasks'); render();
}
function addSub(taskId, input){
  const title = (input.value||'').trim();
  if(!title) return;
  const t = state.tasks.list.find(x => x.id === taskId); if(!t) return;
  snap('crear subtarea');
  t.subs = [...subsOf(t), {id:uid(), title, done:false}];
  input.value = ''; ui.openTask = taskId;
  touch('tasks'); render();
  const again = document.querySelector(`[data-addsub="${taskId}"]`);
  if(again) again.focus();
}
function setRev(patch){
  const k = ui.revWeek;
  state.reviews.weeks[k] = Object.assign({}, state.reviews.weeks[k], patch);
  touch('reviews');
}
function addDream(area, input){
  const title = (input.value||'').trim();
  if(!title) return;
  snap('crear sueño');
  state.goals.dreams.push({id:uid(), area, title, done:false, created:Date.now()});
  input.value = ''; ui.dreamsOpen = true;
  touch('goals'); render();
}
function addGoal(h, input){
  const title = (input.value||'').trim();

  snap('crear meta');
  state.goals.list.push({id:uid(), area:ui.goalArea, horizon:h, period:ui.goalP[h], title, done:false, created:Date.now()});
  input.value = '';
  touch('goals'); render();
  const again = document.querySelector(`[data-addgoal="${h}"]`);
  if(again) again.focus();
}
const ACTIONS = {
  quickadd(){ toggleQuickMenu(); },
  search(){ openSearch(); },
  settings(){ openSettings(); },
  undo(){ undo(); },
  ritual(){ toggleQuickMenu(false); formRitual(); },
  pillar(el){ setJday(TODAY, {pillar: el.dataset.p}); render(); },
  energy(el){ const n = +el.dataset.n; setJday(TODAY, {energy: jday(TODAY).energy === n ? 0 : n}); render(); },
  'pick-project'(el){
    const id = el.dataset.id, cur = jday(TODAY).projects || [];

    render();

  },

  },

  },

    const s = subsOf(t).find(x => x.id === el.dataset.sid); if(!s) return;
    snap('subtarea'); s.done = !s.done; touch('tasks'); render();

  'month-shift'(el){

  'new-note'(el){ toggleQuickMenu(false); formNote(null, el && el.dataset.cat); },

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el){
    if(ui.menu && !e.target.closest('#add-wrap')) toggleQuickMenu(false);
    if(e.target.dataset && e.target.dataset.scrim !== undefined){ if(searchOpen) closeSearch(); else closeForm(); }
    return;
  }
  const fn = ACTIONS[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'the-form') return;
  e.preventDefault();
  const v = readForm();
  const err = formCtx.onSave(v);
  if(err){ toast(err); return; }
  closeForm(); render();
});
document.addEventListener('change', e => {
  if(e.target.id === 'imp'){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => importData(rd.result);
    rd.onerror = () => toast('No pude abrir el archivo');
    rd.readAsText(f);
  }
  if(e.target.id === 'cur'){ state.finance.currency = e.target.value; touch('finance'); toast('Moneda actualizada'); }
  if(e.target.id === 'set-name'){ state.settings.name = e.target.value.trim(); touch('settings'); renderShell(); }
  if(e.target.id === 'set-birth'){ state.settings.birth = e.target.value; touch('settings'); renderShell(); }
  if(e.target.dataset && e.target.dataset.j){
    const d = e.target.dataset.date || TODAY;
    setJday(d, {[e.target.dataset.j]: e.target.value});
  }
  if(e.target.dataset && e.target.dataset.rev) setRev({[e.target.dataset.rev]: e.target.value});
  if(e.target.dataset && e.target.dataset.revfoco != null){
    const i = +e.target.dataset.revfoco;
    const focos = [...((state.reviews.weeks[ui.revWeek]||{}).focos || ['','',''])];
    focos[i] = e.target.value;
    setRev({focos});
  }
  if(e.target.dataset && e.target.dataset.wheel){
    const mk = ui.wheelMonth;
    state.wheel.months[mk] = Object.assign({}, state.wheel.months[mk], {[e.target.dataset.wheel]: +e.target.value});
    touch('wheel'); render();
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'note-q'){ ui.noteQ = e.target.value; render(); }
  if(e.target.id === 'gq'){
    ui.gq = e.target.value;
    const box = document.getElementById('gres'); if(box) box.innerHTML = searchResultsHTML();
  }
  if(e.target.name === 'kind' && formCtx){
    const sel = document.getElementById('f_cat');
    if(sel) sel.innerHTML = CATS[e.target.value].map(c => `<option value="${c}">${c}</option>`).join('');
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset){
    const ds = e.target.dataset;
    if(ds.addday){ e.preventDefault(); addDayTask(ds.addday, e.target); return; }
    if(ds.adddream){ e.preventDefault(); addDream(ds.adddream, e.target); return; }
    if(ds.addgoal){ e.preventDefault(); addGoal(ds.addgoal, e.target); return; }
    if(ds.addsub){ e.preventDefault(); addSub(ds.addsub, e.target); return; }
  }
  /* arrastrar tareas con el teclado en el planificador */
  {
    const card = e.target.closest && e.target.closest('[data-drag]');
    if(card || kbDrag){
      const id = kbDrag ? kbDrag.id : card.dataset.drag;
      const t = state.tasks.list.find(x => x.id === id);
      if(t){
        const refocus = () => { const n = document.querySelector(`[data-drag="${id}"]`); if(n) n.focus(); };
        const move = n => {
          t.date = iso(addDays(parse(t.date), n));
          touch('tasks'); render(); refocus();
          announce(`${t.title}: ${DOWL[dowIdx(parse(t.date))]} ${fmtShort(parse(t.date))}`);
        };
        if((e.key === 'Enter' || e.key === ' ') && card){
          e.preventDefault();
          if(kbDrag){
            kbDrag = null; render(); refocus();
            announce(`Soltada en ${DOWL[dowIdx(parse(t.date))]} ${fmtShort(parse(t.date))}`);
            toast(`«${t.title}» quedó el ${DOWL[dowIdx(parse(t.date))].toLowerCase()} ${fmtShort(parse(t.date))}`);
          } else {
            snap('mover tarea');
            kbDrag = {id, orig:t.date}; render(); refocus();
            announce('Tarea agarrada. Flechas para moverla, Enter para soltarla.');
          }
          return;
        }
        if(kbDrag){
          if(e.key === 'ArrowLeft'){ e.preventDefault(); move(-1); return; }
          if(e.key === 'ArrowRight'){ e.preventDefault(); move(1); return; }
          if(e.key === 'ArrowUp'){ e.preventDefault(); move(-7); return; }
          if(e.key === 'ArrowDown'){ e.preventDefault(); move(7); return; }
          if(e.key === 'Escape'){
            e.preventDefault();
            t.date = kbDrag.orig; kbDrag = null;
            touch('tasks'); render(); refocus();
            announce('Movimiento cancelado.'); toast('Movimiento cancelado');
            return;
          }
        }
      }
    }
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); if(!searchOpen) openSearch(); return; }
  if(e.key === 'Escape'){
    if(askResolve) answer(false);
    else if(searchOpen) closeSearch();
    else if(formCtx) closeForm();
    else if(ui.menu) toggleQuickMenu(false);
    return;
  }
  if(e.key === 'Tab'){
    const m = document.querySelector('#modal-root .modal');
    if(m){
      const f = [...m.querySelectorAll('button,input:not([type=hidden]),select,textarea')].filter(x => !x.disabled && x.offsetParent !== null);
      if(f.length){
        const first = f[0], last = f[f.length-1];
        if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      }
    }
    return;
  }
  const t = document.activeElement;
  const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  if(formCtx || searchOpen || askResolve || typing) return;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const quick = {t:()=>formTask(null), p:()=>formProject(null), h:()=>formHabit(null),
    e:()=>formTraining(null), n:()=>formNote(null)};
  const k = e.key.toLowerCase();
  if(quick[k]){ e.preventDefault(); quick[k](); }
  if(e.key === '/'){ e.preventDefault(); openSearch(); }
});

let dragId = null, kbDrag = null;
function announce(msg){
  let el = document.getElementById('live');
  if(!el){
    el = document.createElement('div');
    el.id = 'live'; el.setAttribute('aria-live','polite'); el.setAttribute('role','status');
    el.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap';
    document.body.appendChild(el);
  }
  el.textContent = msg;
}
document.addEventListener('dragstart', e => {
  const el = e.target.closest('[data-drag]'); if(!el) return;
  dragId = el.dataset.drag; e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
});
document.addEventListener('dragover', e => {
  const z = e.target.closest('[data-drop]'); if(!z || !dragId) return;
  e.preventDefault(); z.classList.add('drop');
});
document.addEventListener('dragleave', e => { const z = e.target.closest('[data-drop]'); if(z) z.classList.remove('drop'); });
document.addEventListener('drop', e => {
  const z = e.target.closest('[data-drop]'); if(!z || !dragId) return;
  e.preventDefault(); z.classList.remove('drop');
  const t = state.tasks.list.find(x => x.id === dragId);
  dragId = null;
  if(!t || t.date === z.dataset.drop) return;
  snap('mover tarea'); t.date = z.dataset.drop; touch('tasks'); render();
});

/* ---------- router ---------- */
function routeFromHash(){
  const k = (location.hash||'').replace(/^#\/?/, '');
  ui.view = RENDERERS[k] ? k : 'hoy';
}
window.addEventListener('hashchange', () => { routeFromHash(); toggleQuickMenu(false); window.scrollTo(0,0); render(); });

/* ---------- arranque ---------- */
if(!loadLocal()) seed();
else if(migrate()) touch('habits','projects','tasks','goals','settings');
if(!state.habits.list.some(h => h.id === ui.habitSel)) ui.habitSel = (state.habits.list[0]||{}).id || null;
routeFromHash();
render();
initDb();

</script>



<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const avisar = w => {
        if(!w) return;
        const barra = document.createElement('div');
        barra.id = 'nueva-version';
        barra.innerHTML = 'Hay una versión nueva <button>Actualizar</button>';
        barra.querySelector('button').onclick = () => { w.postMessage({type:'SKIP_WAITING'}); barra.remove(); };
        document.body.appendChild(barra);
      };
      if(reg.waiting) avisar(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', () => {
          if(nuevo.state === 'installed' && navigator.serviceWorker.controller) avisar(reg.waiting || nuevo);
        });
      });
    }).catch(() => {});
    let recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(recargando) return; recargando = true; location.reload();
    });
  });
}
</script>
