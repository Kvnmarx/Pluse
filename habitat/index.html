<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hábitat Madreperla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#061619;
    --panel:rgba(9,32,37,.78);
    --panel-solid:#0B252A;
    --line:rgba(205,187,147,.16);
    --ivory:#EFE9DD;
    --muted:#8FA7A5;
    --champagne:#CDBB93;
    --ok:#7FD6A4; --warn:#E9C46A; --bad:#FF6B6B; --meet:#F4A68C; --idle:#7D8F8E;
    --display:"Unbounded", "Trebuchet MS", sans-serif;
    --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ivory);font:14px/1.45 var(--body);overflow:hidden}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
  .ui{position:fixed;z-index:2;pointer-events:none}
  .ui > *{pointer-events:auto}

  /* Header */
  .top{top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;right:16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .brand{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;gap:4px}
  .eyebrow{font:500 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--champagne)}
  h1{margin:0;font:600 20px/1.1 var(--display);letter-spacing:-.01em}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px/1.2 var(--mono);color:var(--muted)}
  .mode{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ivory)}
  .mode i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .mode.live i{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
  .mode.lost i{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}
  .hint{font:12px/1.3 var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  /* Roster */
  .roster{top:calc(env(safe-area-inset-top,0px) + 108px);right:16px;width:300px;max-height:calc(100% - 220px);overflow:auto;display:grid;gap:8px;padding-right:2px}
  .card{all:unset;pointer-events:auto;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .2s, transform .2s}
  .card:hover{border-color:rgba(205,187,147,.4)}
  .card:focus-visible{outline:2px solid var(--champagne);outline-offset:2px}
  .card.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
  .card .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
  .card b{font:600 13px/1.2 var(--display);letter-spacing:.01em}
  .card .role{font:11px/1.2 var(--mono);color:var(--muted);margin-left:6px}
  .card .task{grid-column:2 / 4;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ivory);opacity:.86;line-height:1.35}
  .card .where{grid-column:2 / 4;font:11px/1.2 var(--mono);color:var(--muted)}
  .chip{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .st-trabajando{color:var(--ok)} .st-pensando{color:var(--warn)} .st-reunion{color:var(--meet)} .st-inactivo{color:var(--idle)} .st-error{color:var(--bad)}

  /* Feed */
  .feed{left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(380px, calc(100% - 32px));background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .feed ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:12.5px}
  .feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;color:var(--ivory);opacity:.9}
  .feed li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed time{font:11px/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .feed li span b{color:var(--c)}

  /* Labels projected from 3D */
  #labels{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:4px;will-change:transform}
  .tag .name{font:600 11px/1 var(--display);letter-spacing:.04em;padding:4px 8px;border-radius:999px;background:rgba(6,22,25,.82);border:1px solid var(--c);color:var(--ivory);white-space:nowrap;display:flex;gap:6px;align-items:center}
  .tag .name i{font-style:normal;font:10px/1 var(--mono);color:var(--muted)}
  .tag .bubble{max-width:200px;font:12px/1.35 var(--body);background:var(--ivory);color:#0B252A;padding:6px 9px;border-radius:10px;text-align:center;opacity:0;transform:translateY(4px);transition:opacity .25s, transform .25s}
  .tag.talk .bubble{opacity:1;transform:none}
  .room{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--c);text-shadow:0 0 14px rgba(0,0,0,.9);white-space:nowrap;opacity:.95}
  .room small{display:block;margin-top:4px;font:10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:none;text-align:center}

  /* Ficha del agente */
  .detail{pointer-events:auto;top:calc(env(safe-area-inset-top,0px) + 108px);right:16px;width:348px;max-height:calc(100% - 124px - env(safe-area-inset-top,0px));overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:16px;display:grid;gap:18px;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:slidein .28s ease-out}
  @keyframes slidein{from{transform:translateX(24px);opacity:.3}}
  .d-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  .d-avatar{width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 35% 30%, #fff8 0 12%, transparent 13%), var(--c);display:grid;place-items:center;box-shadow:0 0 18px color-mix(in srgb, var(--c) 55%, transparent)}
  .d-avatar::after{content:"";width:24px;height:7px;border-radius:6px;background:#061619}
  .d-head h2{margin:0;font:600 18px/1.1 var(--display)}
  .d-head .sub{font:11px/1.4 var(--mono);color:var(--muted)}
  .x{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:20px;line-height:1}
  .x:hover{background:rgba(255,255,255,.06);color:var(--ivory)} .x:focus-visible{outline:2px solid var(--champagne)}
  .d-sec{display:grid;gap:8px}
  .d-sec > .eyebrow{display:flex;justify-content:space-between;gap:8px}
  .d-sec > .eyebrow span{color:var(--muted);letter-spacing:.06em}
  .d-task{font:500 15px/1.4 var(--body)}
  .d-small{font:12px/1.4 var(--mono);color:var(--muted)}
  .meter{height:8px;border-radius:999px;background:rgba(239,233,221,.08);overflow:hidden}
  .meter i{display:block;height:100%;border-radius:999px;background:var(--c);transition:width .6s}
  .alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--bad);background:rgba(255,107,107,.08);border-radius:10px;padding:10px 12px;font-size:13px}
  .alert b{color:var(--bad);font:600 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em}
  .hero{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
  .hero strong{font:600 28px/1 var(--display);letter-spacing:-.02em}
  .hero span{font:12px var(--mono);color:var(--muted)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:8px;font:12px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .split b{display:block;font:500 14px/1.3 var(--mono);color:var(--ivory)}
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ivory);color:#0B252A;font:500 11.5px/1.3 var(--mono);padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px}
  .stat b{font:600 17px/1.2 var(--display);font-variant-numeric:tabular-nums}
  .stat span{font:10.5px/1.3 var(--mono);color:var(--muted)}
  .list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
  .list li{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:baseline}
  .list li time{font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .list.queue li{grid-template-columns:18px 1fr}
  .list.queue li span:first-child{font:11px var(--mono);color:var(--c)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .tool{font:11.5px/1 var(--mono);padding:5px 8px;border-radius:6px;background:rgba(239,233,221,.07);color:var(--ivory)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
  .kv dt{font:11px/1.6 var(--mono);color:var(--muted)} .kv dd{margin:0}
  .note{font:11px/1.4 var(--mono);color:var(--warn);border:1px dashed rgba(233,196,106,.4);border-radius:8px;padding:6px 8px}
  .tag .name{pointer-events:auto;cursor:pointer}

  /* Chat del equipo */
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .clockrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:11.5px/1.2 var(--mono);color:var(--muted)}
  .clock{font-variant-numeric:tabular-nums}
  .horasel{pointer-events:auto;background:rgba(239,233,221,.06);color:var(--ivory);border:1px solid var(--line);border-radius:8px;font:11.5px var(--mono);padding:3px 6px}
  .horasel:focus-visible{outline:2px solid var(--champagne)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .aprbtn{all:unset;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--display);letter-spacing:.02em;padding:8px 12px;border-radius:10px;border:1px solid var(--champagne);color:var(--champagne)}
  .aprbtn:hover{background:rgba(205,187,147,.1)} .aprbtn:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}
  .aprbtn .badge{background:var(--champagne);color:#0B252A}
  .apr{--c:var(--champagne)}
  .apr-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .apr-tab{all:unset;cursor:pointer;font:500 12px/1 var(--mono);padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .apr-tab.on{border-color:var(--champagne);color:var(--ivory)} .apr-tab:focus-visible{outline:2px solid var(--champagne)}
  .apr-list{display:grid;gap:10px}
  .apr-item{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:12px;display:grid;gap:8px;background:rgba(239,233,221,.02)}
  .apr-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .apr-who{font:600 12.5px/1.3 var(--body)} .apr-who small{font:11px var(--mono);color:var(--muted);font-weight:400;margin-left:6px}
  .apr-title{font:500 14.5px/1.35 var(--body);text-wrap:balance}
  .apr-body{font-size:13px;line-height:1.5;color:var(--ivory);opacity:.88;white-space:pre-wrap;overflow-wrap:anywhere;max-height:7.6em;overflow:hidden}
  .apr-body.open{max-height:none}
  .apr-more{all:unset;cursor:pointer;justify-self:start;font:11.5px var(--mono);color:var(--champagne)} .apr-more:focus-visible{outline:2px solid var(--champagne)}
  .apr-item textarea{width:100%;box-sizing:border-box;min-height:54px;resize:vertical;background:rgba(239,233,221,.06);border:1px solid var(--line);border-radius:8px;color:var(--ivory);font:13px/1.4 var(--body);padding:8px 10px}
  .apr-item textarea:focus{outline:none;border-color:var(--champagne)}
  .apr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .apr-ok{all:unset;cursor:pointer;padding:8px 14px;border-radius:9px;background:var(--champagne);color:#0B252A;font:600 12.5px/1 var(--display)}
  .apr-ok.confirm{background:var(--ok)}
  .apr-back{all:unset;cursor:pointer;padding:8px 14px;border-radius:9px;border:1px solid var(--line);color:var(--ivory);font:500 12.5px/1 var(--body)}
  .apr-ok:focus-visible,.apr-back:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}
  .apr-ok[disabled],.apr-back[disabled]{opacity:.45;cursor:not-allowed}
  .apr-err{font:11.5px/1.4 var(--mono);color:var(--bad)}
  .apr-note{font:11.5px/1.45 var(--mono);color:var(--muted)}
  .apr-dec{font-size:12.5px;line-height:1.45;color:var(--muted)} .apr-dec b{color:var(--ivory);font-weight:500}
  .apr-empty{font:13px/1.5 var(--body);color:var(--muted);text-align:center;padding:22px 8px}
  .st-pendiente{color:var(--champagne)} .st-aprobada{color:var(--ok)} .st-devuelta{color:var(--warn)}
  .tag .name .flag{display:none}
  .tag.wait .name .flag{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--champagne);box-shadow:0 0 8px var(--champagne)}
  .chatbtn{all:unset;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-self:start;font:600 12px/1 var(--display);letter-spacing:.02em;padding:9px 12px;border-radius:10px;background:var(--champagne);color:#0B252A}
  .chatbtn:hover{filter:brightness(1.08)} .chatbtn:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}
  .badge{min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#0B252A;color:var(--ivory);font:600 10.5px/18px var(--mono);text-align:center}
  .chat{pointer-events:auto;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(720px, calc(100% - 380px));display:grid;grid-template-columns:210px 1fr;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:4}
  .ch-list{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
  .ch-list .eyebrow{padding:4px 8px 6px}
  .ch-item{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:9px;color:var(--ivory)}
  .ch-item:hover{background:rgba(239,233,221,.05)} .ch-item:focus-visible{outline:2px solid var(--champagne)}
  .ch-item.on{background:rgba(205,187,147,.12)}
  .ch-item .av{width:22px;height:22px;border-radius:7px;background:var(--c);display:grid;place-items:center;font:600 10px/1 var(--display);color:#061619}
  .ch-item .nm{font:500 13px/1.2 var(--body);display:grid;gap:1px}
  .ch-item .nm small{font:10.5px/1.2 var(--mono);color:var(--muted)}
  .ch-item .badge{background:var(--champagne);color:#0B252A}
  .ch-main{display:grid;grid-template-rows:auto 1fr auto auto auto;min-height:0}
  .ch-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .ch-head h2{margin:0;font:600 15px/1.2 var(--display)}
  .ch-head .sub{font:11px/1.3 var(--mono);color:var(--muted)}
  .ch-head .grow{flex:1;min-width:0}
  .ch-msgs{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
  .msg{display:grid;grid-template-columns:28px 1fr;gap:10px;max-width:92%}
  .msg .av{width:28px;height:28px;border-radius:8px;background:var(--c);display:grid;place-items:center;font:600 11px/1 var(--display);color:#061619}
  .msg .who{font:600 12.5px/1.3 var(--body);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .msg .who .to{font:11px var(--mono);color:var(--muted);font-weight:400}
  .msg .who time{font:10.5px var(--mono);color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
  .msg .txt{font-size:13.5px;line-height:1.45;color:var(--ivory);opacity:.92;overflow-wrap:anywhere}
  .msg.mine{align-self:flex-end;grid-template-columns:1fr}
  .msg.mine .av{display:none}
  .msg.mine .body{background:var(--ivory);color:#0B252A;border-radius:12px 12px 4px 12px;padding:8px 12px}
  .msg.mine .txt{color:#0B252A;opacity:1}
  .msg.mine .who{color:#0B252A} .msg.mine .who time,.msg.mine .who .to{color:#50605f}
  .card-msg{margin-top:6px;border:1px solid var(--line);border-left:3px solid var(--c2, var(--champagne));border-radius:10px;padding:9px 11px;display:grid;gap:4px;background:rgba(239,233,221,.03)}
  .card-msg .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .card-msg .route{font:11px var(--mono);color:var(--muted)}
  .card-msg .what{font:500 13.5px/1.4 var(--body)}
  .card-msg.help{border-left-color:var(--bad)}
  .tk-pendiente{color:var(--warn)} .tk-aceptada{color:var(--ok)} .tk-hecha{color:var(--muted)}
  .sysline{align-self:center;font:11px/1.4 var(--mono);color:var(--muted);text-align:center;padding:2px 10px}
  .ch-typing{min-height:18px;padding:0 14px;font:11.5px/18px var(--mono);color:var(--muted)}
  .ch-quick{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px 0}
  .qk{all:unset;cursor:pointer;font:11.5px/1 var(--mono);padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ivory)}
  .qk:hover{border-color:var(--champagne)} .qk:focus-visible{outline:2px solid var(--champagne)}
  .ch-form{display:flex;gap:8px;padding:10px 14px 14px}
  .ch-form input{flex:1;min-width:0;background:rgba(239,233,221,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ivory);font:14px var(--body)}
  .ch-form input:focus{outline:none;border-color:var(--champagne)}
  .ch-form button{all:unset;cursor:pointer;padding:0 16px;border-radius:10px;background:var(--champagne);color:#0B252A;font:600 12.5px/1 var(--display)}
  .ch-form button:focus-visible{outline:2px solid var(--ivory)}
  .ch-note{padding:0 14px;font:11px/1.4 var(--mono);color:var(--warn)}
  .d-chat{all:unset;cursor:pointer;justify-self:start;font:600 12px/1 var(--display);padding:9px 12px;border-radius:10px;border:1px solid var(--c);color:var(--ivory)}
  .d-chat:focus-visible{outline:2px solid var(--champagne)}
  body.chat-open .feed{display:none}

  /* Barra de tu avatar */
  .avbar{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 8px;max-width:calc(100% - 32px);box-sizing:border-box}
  .av-me,.av-btn{all:unset;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;font:600 12px/1 var(--display);color:var(--ivory)}
  .av-me{background:rgba(230,211,168,.14)}
  .av-me .pearl{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff 0 18%, #f3e9d6 40%, #cdb98f 75%, #9fb8c6 100%);box-shadow:0 0 10px rgba(255,240,210,.6)}
  .av-btn{border:1px solid var(--line);font-weight:500;font-family:var(--body);font-size:12.5px}
  .av-btn.on{border-color:var(--champagne);color:var(--champagne)}
  .av-talk{border-color:var(--c, var(--champagne));background:color-mix(in srgb, var(--c, #CDBB93) 18%, transparent)}
  .av-me:focus-visible,.av-btn:focus-visible{outline:2px solid var(--champagne)}
  .av-hint{font:11px var(--mono);color:var(--muted);padding:0 8px}
  .tag.me .name{border-color:#E6D3A8;background:rgba(40,34,22,.85)}
  body.chat-open .avbar{display:none}

  /* Presentaciones */
  .nowbar{top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--panel-solid);border:1px solid var(--c, var(--champagne));border-radius:999px;padding:6px 6px 6px 14px;max-width:min(460px, calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .nowbar .dot{width:9px;height:9px;border-radius:50%;background:var(--c, var(--champagne));box-shadow:0 0 10px var(--c, var(--champagne));animation:pulse 1.6s infinite;flex:none}
  .nb-text{font:500 12.5px/1.3 var(--body);color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .nb-text b{font-weight:600}
  .nb-btn{all:unset;cursor:pointer;flex:none;padding:7px 12px;border-radius:999px;background:var(--champagne);color:#0B252A;font:600 11.5px/1 var(--display)}
  .nb-btn:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}
  .viewer{position:fixed;inset:0;z-index:7;display:grid;place-items:center;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-inline:16px;background:rgba(2,9,11,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .vw-box{width:min(1000px, 100%);max-height:100%;display:grid;grid-template-rows:auto 1fr auto;background:var(--panel-solid);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .vw-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .vw-av{width:36px;height:36px;border-radius:10px;background:var(--c)}
  .vw-hgroup{display:grid;gap:3px;min-width:0}
  .vw-head h2{margin:0;font:600 18px/1.2 var(--display);text-wrap:balance}
  .vw-head .sub{font:11.5px/1.3 var(--mono);color:var(--muted)}
  .vw-body{overflow:auto;padding:20px;min-height:0}
  .vw-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
  .vw-foot .note{flex:1 1 220px}
  .vw-nav{display:flex;gap:8px;align-items:center}
  .vw-btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:9px;border:1px solid var(--line);color:var(--ivory);font:500 12.5px/1 var(--body)}
  .vw-btn.pri{background:var(--champagne);border-color:var(--champagne);color:#0B252A;font-weight:600}
  .vw-btn:focus-visible{outline:2px solid var(--champagne);outline-offset:2px}
  .vw-btn[disabled]{opacity:.4;cursor:default}
  .vw-count{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .slide{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:radial-gradient(120% 90% at 85% 10%, color-mix(in srgb, var(--c) 22%, transparent), transparent 55%), linear-gradient(160deg, #0E3238, #081B1F);border:1px solid var(--line);padding:clamp(18px, 4vw, 44px);box-sizing:border-box;display:grid;align-content:center;gap:clamp(10px, 2vw, 22px);position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:clamp(18px, 4vw, 44px);bottom:clamp(14px, 3vw, 28px);width:56px;height:3px;border-radius:2px;background:var(--c)}
  .slide h3{margin:0;font:600 clamp(20px, 3.6vw, 38px)/1.12 var(--display);letter-spacing:-.01em;text-wrap:balance;color:var(--ivory)}
  .slide ul{margin:0;padding:0;list-style:none;display:grid;gap:clamp(6px, 1.2vw, 12px)}
  .slide li{font:400 clamp(14px, 2vw, 21px)/1.4 var(--body);color:var(--ivory);opacity:.9;padding-left:22px;position:relative}
  .slide li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--c)}
  .slide .snote{font:12.5px/1.5 var(--mono);color:var(--muted)}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(239,233,221,.2)} .dots i.on{background:var(--c)}
  .doc{max-width:68ch;margin:0 auto;display:grid;gap:18px}
  .doc h3{margin:0 0 4px;font:600 16px/1.3 var(--display);color:var(--ivory)}
  .doc p{margin:0;font:15px/1.65 var(--body);color:var(--ivory);opacity:.9;white-space:pre-wrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:10px;margin-bottom:18px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
  .kpi span{font:11px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .kpi b{font:600 26px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--ivory)}
  .kpi small{font:12px/1.3 var(--body);color:var(--muted)}
  .charts{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:14px}
  .chartbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
  .chartbox h4{margin:0 0 8px;font:600 13px/1.3 var(--body);color:var(--ivory)}
  .chartbox svg{display:block;width:100%;height:auto;overflow:visible}
  .chartbox .tip{position:absolute;transform:translate(-50%,-100%);background:var(--ivory);color:#0B252A;font:500 11.5px/1.3 var(--mono);padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
  .card-msg.pres{border-left-color:var(--c2, var(--champagne))}
  .card-msg .open-pres{all:unset;cursor:pointer;justify-self:start;margin-top:4px;padding:6px 10px;border-radius:8px;background:var(--champagne);color:#0B252A;font:600 11.5px/1 var(--display)}
  .card-msg .open-pres:focus-visible{outline:2px solid var(--ivory)}
  .d-pres{all:unset;cursor:pointer;display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
  .d-pres:hover{border-color:var(--c)} .d-pres:focus-visible{outline:2px solid var(--champagne)}
  .d-pres b{font:500 13px/1.3 var(--body)} .d-pres small{font:11px var(--mono);color:var(--muted)}
  body.presenting .hint{display:none}
  @media (max-width: 760px){ .nowbar{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 190px)} .vw-body{padding:14px} }

  .loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:var(--bg);font:12px var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;transition:opacity .6s}
  .loading.done{opacity:0;pointer-events:none}

  @media (max-width: 760px){
    h1{font-size:17px}
    .hint{display:none}
    .roster{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:16px;left:16px;width:auto;max-height:none;display:flex;overflow-x:auto;overflow-y:hidden;gap:8px;scroll-snap-type:x mandatory;padding-bottom:2px}
    .card{flex:0 0 78%;scroll-snap-align:start}
    .feed{display:none}
    .avbar{bottom:calc(env(safe-area-inset-bottom,0px) + 132px);border-radius:14px}
    .av-hint{display:none}
    .chat{left:0;right:0;top:0;bottom:0;width:auto;border-radius:0;grid-template-columns:1fr;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    .ch-list{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
    .ch-list .eyebrow{display:none}
    .ch-item{grid-template-columns:22px auto auto;flex:0 0 auto}
    .ch-item .nm small{display:none}
    .detail{top:auto;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:auto;max-height:64%;animation:none}
  }
  @media (prefers-reduced-motion: reduce){ .mode.live i{animation:none} }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(() => {
'use strict';

/* ───────────────────────── Configuración ─────────────────────────
   Salas y agentes. Para conectar agentes reales, crea un archivo
   "estado.json" junto a esta página (ver estado.ejemplo.json).       */

const ESTADO_URL = 'estado.json';
const BURBUJAS = false;   // burbujas de habla sobre los robots (apagadas mientras desarrollamos)
const REFRESCO_MS = 15000;

const ROOMS = {
  code:      { name:'Code Lab',       sub:'Código',                 x:-17.4, z:-14.1 },
  design:    { name:'Design Room',    sub:'Contenido y diseño',     x:    0, z:-14.1 },
  analitica: { name:'Analítica',      sub:'Marketing y leads',      x: 17.4, z:-14.1 },
  libreria:  { name:'Librería',       sub:'Investigación',          x:-17.4, z: 14.1 },
  archivo:   { name:'Archivo',        sub:'CRM y documentos',       x:    0, z: 14.1 },
  ventas:    { name:'Sala de Ventas', sub:'Propuestas y clientes',  x: 17.4, z: 14.1 },
  meeting:   { name:'Meeting Room',   sub:'Sala principal',         x:    0, z:    0, w:24, d:12,
               doorsX:[-6, 6] },
};

const AGENTS = [
  { id:'sylvia',  hermes:'@sylvia',                               name:'Sylvia',  role:'Coordina',       home:'meeting',   color:'#FF8663' },
  { id:'viktor',  hermes:'@viktor',                               name:'Viktor',  role:'Ventas',         home:'ventas',    color:'#3FD0E0' },
  { id:'sergio',  hermes:'@ageente-de-investigacion-madreperla',  name:'Sergio',  role:'Investigación',  home:'libreria',  color:'#6FD68E' },
  { id:'bety',    hermes:'@contenido-madreperla',                 name:'Bety',    role:'Contenido',      home:'design',    color:'#E86AC0' },
  { id:'mark',    hermes:'@mark',                                 name:'Mark',    role:'Marketing',      home:'analitica', color:'#F2B544' },
  { id:'marcelo', hermes:'@marcelo',                              name:'Marcelo', role:'CRM y clientes', home:'archivo',   color:'#9C82FF' },
];
/* acepta el id o el usuario de Hermes (con o sin @) */
function resolveId(x){
  const k = String(x || '').trim().toLowerCase().replace(/^@/, '');
  const a = AGENTS.find(a => a.id === k || a.hermes.slice(1) === k || a.name.toLowerCase() === k);
  return a ? a.id : k;
}

const STATE_LABEL = { trabajando:'Trabajando', pensando:'Pensando', reunion:'En reunión', inactivo:'En pausa', error:'Necesita ayuda' };

/* Ficha fija de cada agente (se puede sobrescribir desde estado.json) */
const PROFILE = {
  sylvia:  { mision:'Asistente principal y coordinadora de los demás agentes de Madreperla: reparte tareas, prepara reuniones y consolida avances.', herramientas:['Hermes Agent','Calendario','Chat del equipo'], modelo:'Hermes Agent' },
  viktor:  { mision:'Asesor inmobiliario enfocado en ventas: prepara propuestas y acompaña oportunidades. Precios y condiciones finales los confirma una persona autorizada.', herramientas:['Hermes Agent','Fichas de proyectos'], modelo:'Hermes Agent' },
  sergio:  { mision:'Investiga proyectos, destinos y el mercado inmobiliario de República Dominicana; verifica fuentes y fechas.', herramientas:['Hermes Agent','Búsqueda web','Carpeta Proyectos'], modelo:'Hermes Agent' },
  bety:    { mision:'Planifica calendarios y redacta contenido con la voz de Madreperla. Prepara borradores para revisión; no publica ni responde a clientes sin aprobación.', herramientas:['Hermes Agent','Calendario de contenido','LinkedIn (borradores)'], modelo:'Hermes Agent' },
  mark:    { mision:'Se encarga del marketing y la captación de leads: campañas, alcance y resultados.', herramientas:['Hermes Agent','Campañas','Analítica'], modelo:'Hermes Agent' },
  marcelo: { mision:'Gestiona el CRM y el seguimiento de clientes, con cuidado de los datos sensibles.', herramientas:['Hermes Agent','CRM (en cambio)'], modelo:'Hermes Agent' },
};

/* Tareas de ejemplo para el modo simulación */
const SIM_TASKS = {
  sylvia:  ['Preparando la agenda semanal','Asignando tareas al equipo','Revisando prioridades del día','Consolidando avances para María Andrea'],
  viktor:  ['Preparando propuesta de Cap Cana para revisión','Revisando disponibilidad en Cana Bay','Ordenando oportunidades de la semana','Preparando comparativa de villas en Bávaro'],
  sergio:  ['Investigando tendencias en Miches','Verificando fechas de entrega de Puerto Marina','Resumiendo novedades de CONFOTUR','Comparando precios por zona en Punta Cana'],
  bety:    ['Redactando carrusel para LinkedIn','Planificando el calendario de octubre','Preparando borrador sobre Las Terrenas','Ajustando textos con la voz de Madreperla'],
  mark:    ['Midiendo leads de la semana','Analizando alcance de publicaciones','Preparando campaña de Cabeza de Toro','Revisando origen de los leads'],
  marcelo: ['Actualizando el seguimiento de clientes','Ordenando registros para el nuevo CRM','Programando recordatorios de seguimiento','Revisando contactos pendientes'],
};

/* ───────────────────────── Escena ───────────────────────── */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

let composer = null, bloom = null;   // se crean más abajo si hay postprocesado
const scene = new THREE.Scene();
scene.background = new THREE.Color('#061619');
scene.fog = new THREE.Fog('#061619', 70, 150);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
camera.position.set(0, 40, 40);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.25;
controls.minDistance = 10;
controls.maxDistance = 115;
controls.target.set(0, 0, 0);

/* reflejos suaves: un estudio neutro como entorno */
if (THREE.RoomEnvironment) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
}
const hemi = new THREE.HemisphereLight('#bfe8e4', '#0a1d20', 0.16);
scene.add(hemi);
const ROOM_LIGHTS = [], NIGHT_GLOWS = [];      // se ajustan con la hora del día
const rim = new THREE.DirectionalLight('#7fd3d6', 0.35);      // contraluz frío
rim.position.set(20, 14, -26); scene.add(rim);
const sun = new THREE.DirectionalLight('#ffe9c9', 0.95);
sun.position.set(-24, 40, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(3072, 3072);
Object.assign(sun.shadow.camera, { left:-40, right:40, top:32, bottom:-32, near:1, far:110 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* materiales base */
const M = {
  floor:  new THREE.MeshStandardMaterial({ color:'#071A1E', roughness:.42, metalness:.35 }),
  roomFl: new THREE.MeshStandardMaterial({ color:'#0D2B30', roughness:.3, metalness:.3 }),
  glass:  new THREE.MeshStandardMaterial({ color:'#b9ecea', transparent:true, opacity:.11, roughness:.04, metalness:.7, depthWrite:false }),
  frame:  new THREE.MeshStandardMaterial({ color:'#274C51', roughness:.5, metalness:.4 }),
  desk:   new THREE.MeshStandardMaterial({ color:'#E8E1D2', roughness:.55 }),
  dark:   new THREE.MeshStandardMaterial({ color:'#14262A', roughness:.5, metalness:.3 }),
  metal:  new THREE.MeshStandardMaterial({ color:'#6F8587', roughness:.35, metalness:.7 }),
  ivory:  new THREE.MeshStandardMaterial({ color:'#EFE9DD', roughness:.4, metalness:.1 }),
  wood:   new THREE.MeshStandardMaterial({ color:'#8A6A4B', roughness:.7 }),
};
const glow = (c, i=1.4) => new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:i, roughness:.4 });

function box(w,h,d,mat,x=0,y=0,z=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,seg=24,parent=scene){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;

const NODES = {}, EDGES = {};
function node(k, x, z){ NODES[k] = new THREE.Vector3(x, 0, z); EDGES[k] = []; }
function link(a, b){ EDGES[a].push(b); EDGES[b].push(a); }
const NX = [-17.4, -6, 0, 6, 17.4];
NX.forEach(x => { node('T' + x, x, -7.3); node('B' + x, x, 7.3); });

const EDGE_LIST = Object.keys(EDGES).flatMap(a => EDGES[a].filter(b => a < b).map(b => [a, b]));

function shortest(a, b){
  const dist = { [a]: 0 }, prev = {}, todo = new Set(Object.keys(NODES));
  while (todo.size) {
    let u = null; for (const k of todo) if (dist[k] !== undefined && (u === null || dist[k] < dist[u])) u = k;
    if (u === null || u === b) break;
    todo.delete(u);
    for (const v of EDGES[u]) { const d = dist[u] + NODES[u].distanceTo(NODES[v]); if (dist[v] === undefined || d < dist[v]) { dist[v] = d; prev[v] = u; } }
  }
  const out = [b]; while (out[0] !== a && prev[out[0]]) out.unshift(prev[out[0]]);
  return out[0] === a ? out : [a, b];
}
function nearestNode(p){ let best = null, bd = Infinity; for (const k in NODES) { const d = NODES[k].distanceTo(p); if (d < bd) { bd = d; best = k; } } return best; }
function polyLen(pts){ let L = 0; for (let i = 1; i < pts.length; i++) L += pts[i-1].distanceTo(pts[i]); return L; }
/* camino de A a B pasando por puertas y pasillos */
function planPath(fromRoom, pos, toRoom, finalPt){
  if (fromRoom && fromRoom === toRoom) return [finalPt.clone()];
  const starts = fromRoom ? ROOMS[fromRoom].doors.map(d => ({ pre:[d.inner, d.outer], node:d.node })) : [{ pre:[], node:nearestNode(pos) }];
  const ends = toRoom ? ROOMS[toRoom].doors.map(d => ({ node:d.node, post:[d.outer, d.inner] })) : [{ node:nearestNode(finalPt), post:[] }];
  let best = null, bl = Infinity;
  for (const st of starts) for (const en of ends) {
    const pts = [...st.pre, ...shortest(st.node, en.node).map(k => NODES[k]), ...en.post, finalPt];
    const L = polyLen([pos, ...pts]);
    if (L < bl) { bl = L; best = pts; }
  }
  return best.map(p => p.clone());
}
function roomAt(p){
  for (const k in ROOMS) { const r = ROOMS[k]; if (Math.abs(p.x - r.x) < r.w/2 - 0.5 && Math.abs(p.z - r.z) < r.d/2 - 0.5) return k; }
  return null;
}

function buildRoom(key){
  const r = ROOMS[key];
  const owner = AGENTS.find(a => a.home === key);
  r.color = owner ? owner.color : '#8FB3B5';          // sala sin residente
  if (!owner) r.sub += ' · libre';
  r.w = r.w || W; r.d = r.d || D;
  const Wr = r.w, Dr = r.d;
  const s = Math.sign(r.z);
  const g = new THREE.Group(); scene.add(g);

  const fl = box(Wr-0.3, 0.06, Dr-0.3, M.roomFl, r.x, 0.03, r.z, g);
  fl.castShadow = false;
  // alfombra de color de la sala
  const rug = box(Wr-3, 0.02, Dr-3.4, new THREE.MeshStandardMaterial({ color:r.color, roughness:.9, transparent:true, opacity:.14 }), r.x, 0.07, r.z, g);
  rug.castShadow = false;

  const backZ = r.z + (s || -1)*Dr/2, frontZ = r.z - (s || -1)*Dr/2;
  const wall = (len, x, z, rotY) => {
    const p = box(len, WALL_H, 0.06, M.glass, x, WALL_H/2, z, g);
    p.rotation.y = rotY; p.castShadow = false;
    const rail = box(len, 0.06, 0.08, glow(r.color, 0.75), x, WALL_H, z, g);
    rail.rotation.y = rotY; rail.castShadow = false;
    const base = box(len, 0.14, 0.14, M.frame, x, 0.07, z, g);
    base.rotation.y = rotY;
  };
  const doorXs = (r.doorsX || [0]).map(dx => r.x + dx);
  const doorWall = z => {                          // pared con huecos de puerta
    let x0 = r.x - Wr/2;
    for (const dx of doorXs) { const x1 = dx - DOOR/2; if (x1 > x0) wall(x1 - x0, (x0 + x1)/2, z, 0); x0 = dx + DOOR/2; }
    const x1 = r.x + Wr/2; if (x1 > x0) wall(x1 - x0, (x0 + x1)/2, z, 0);
  };
  wall(Dr, r.x - Wr/2, r.z, Math.PI/2);
  wall(Dr, r.x + Wr/2, r.z, Math.PI/2);

  if (s === 0) {                                   // sala central: puertas al norte y al sur
    doorWall(r.z - Dr/2); doorWall(r.z + Dr/2);
    r.doors = doorXs.flatMap(x => [ mkDoor(x, r.z - Dr/2, -1, 'T' + x), mkDoor(x, r.z + Dr/2, 1, 'B' + x) ]);
  } else {
    wall(Wr, r.x, backZ, 0);
    doorWall(frontZ);
    r.doors = [ mkDoor(r.x, frontZ, -s, (s < 0 ? 'T' : 'B') + r.x) ];
  }
  // luz de la sala
  const pl = new THREE.PointLight(r.color, s === 0 ? 1.2 : 0.7, s === 0 ? 24 : 14, 2);
  pl.position.set(r.x, 3.4, r.z); g.add(pl);
  pl.userData.base = pl.intensity; ROOM_LIGHTS.push(pl);

  r.center = new THREE.Vector3(r.x, 0, r.z);
  r.labelPos = new THREE.Vector3(r.x, WALL_H + 0.9, r.z - Dr/2);   // borde más lejano a la cámara

  FURNITURE[key](r, g);
}

function spotFor(id, roomKey, state){
  const r = ROOMS[roomKey];
  const seatLook = seat => new THREE.Vector3(Math.max(-6.5, Math.min(6.5, seat.x)), 0, r.center.z);
  if (id === 'tu') return r.seats ? { pos: r.seats[7].clone(), look: r.center.clone() } : { pos: toWorld(r, 0, -2.4), look: r.center.clone() };
  const idx = AGENTS.findIndex(a => a.id === id);
  if (roomKey === 'meeting') { const seat = r.seats[idx % 7]; return { pos: seat.clone(), look: seatLook(seat) }; }
  if (AGENTS[idx].home === roomKey) return { pos: r.spot.clone(), look: r.look.clone() };
  // visitante: se ubica en la sala sin chocar con el anfitrión
  const off = ((idx % 3) - 1) * 1.4;
  const p = toWorld(r, off, -1.9);
  return { pos: p, look: r.center.clone() };
}
function corridorPoint(){
  const [a, b] = EDGE_LIST[Math.floor(Math.random() * EDGE_LIST.length)];

}
function routeTo(rb, roomKey, state){

function destinationFor(ag){
  if (ag.sala && ROOMS[ag.sala]) return ag.sala;
  if (ag.estado === 'reunion') return 'meeting';
  if (ag.estado === 'inactivo') return null;
  return AGENTS.find(a => a.id === ag.id).home;
}

function num(v){ return typeof v === 'number' && isFinite(v) ? v : null; }
function mergeInfo(rb, ag, taskChanged){
  const I = rb.info;
  if (typeof ag.modelo === 'string') I.modelo = ag.modelo;
  if (Array.isArray(ag.herramientas)) I.herramientas = ag.herramientas.map(String).slice(0, 8);
  if (typeof ag.mision === 'string') I.mision = ag.mision;
  if (ag.tarea_inicio && !isNaN(Date.parse(ag.tarea_inicio))) I.inicio = Date.parse(ag.tarea_inicio);
  else if (taskChanged) I.inicio = Date.now();
  if (num(ag.avance) !== null) I.avance = Math.max(0, Math.min(100, ag.avance));
  else if (taskChanged) I.avance = null;
  if (ag.activo_desde && !isNaN(Date.parse(ag.activo_desde))) I.activoDesde = Date.parse(ag.activo_desde);
  I.ultima = ag.ultima_actividad && !isNaN(Date.parse(ag.ultima_actividad)) ? Date.parse(ag.ultima_actividad) : Date.now();
  const t = ag.tokens;
  if (t && typeof t === 'object') {
    if (num(t.entrada) !== null) I.tokens.entrada = t.entrada;
    if (num(t.salida) !== null) I.tokens.salida = t.salida;
    if (num(t.limite_diario) !== null) I.tokens.limite = t.limite_diario;
    if (Array.isArray(t.por_hora)) { const a = t.por_hora.map(v => num(v) || 0).slice(-12); I.tokens.porHora = new Array(12 - a.length).fill(0).concat(a); }
  }
  if (num(ag.completadas_hoy) !== null) I.completadas = ag.completadas_hoy;
  if (Array.isArray(ag.cola)) I.cola = ag.cola.map(String).slice(0, 5);
  if (Array.isArray(ag.historial)) I.historialExt = ag.historial.slice(0, 8).map(h => ({ hora: String(h.hora || ''), texto: String(h.texto || '') }));
}

function applyState(ag, silent){
  if (ag && ag.id) ag = { ...ag, id: resolveId(ag.id), sala: ag.sala };
  const rb = robots[ag.id]; if (!rb) return;
  mergeInfo(rb, ag, (ag.tarea || '') !== rb.task);
  const estado = STATE_LABEL[ag.estado] ? ag.estado : 'trabajando';
  const dest = destinationFor({ ...ag, estado });
  const changed = estado !== rb.state || dest !== rb.room || (ag.tarea || '') !== rb.task;
  const moved = dest !== rb.room || (estado === 'reunion') !== (rb.state === 'reunion');
  rb.state = estado; rb.task = ag.tarea || ''; rb.room = dest;
  if (!rb.presenting && (moved || !rb.path.length && dest !== rb.at)) routeTo(rb, dest, estado);
  if (changed && !silent) {
    rb.talkUntil = performance.now() + 6000;
    log(rb, dest);
  }
  if (changed) {
    rb.info.historial.unshift({ t: Date.now(), texto: `${STATE_LABEL[rb.state]}${rb.task ? ' · ' + rb.task : ''}` });
    rb.info.historial.length = Math.min(rb.info.historial.length, 8);
  }
  renderRoster();
  if (selected === rb.a.id) renderDetail();
}

function fmtTokens(n){
  if (n >= 1e6) return (n/1e6).toFixed(2).replace('.', ',') + ' M';
  if (n >= 1e4) return Math.round(n/1e3) + ' k';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace('.', ',') + ' k';
  return String(Math.round(n));
}
function fmtFull(n){ return Math.round(n).toLocaleString('es-DO'); }
function fmtDur(ms){
  const m = Math.max(0, Math.round(ms/60000));
  if (m < 1) return 'menos de 1 min';
  if (m < 60) return m + ' min';
  return Math.floor(m/60) + ' h ' + String(m % 60).padStart(2, '0') + ' min';
}

function hourChart(rb){
  const vals = rb.info.tokens.porHora, n = vals.length;
  const W = 300, H = 92, top = 14, base = 72;
  const max = Math.max(...vals, 1);
  const slot = W / n, bw = slot - 4;
  const nowH = new Date().getHours();
  const hourOf = i => (nowH - (n - 1 - i) + 24) % 24;
  let bars = '', hits = '';
  vals.forEach((v, i) => {
    const h = v ? Math.max(3, (v / max) * (base - top)) : 0;
    const x = i*slot + 2, y = base - h, r = Math.min(4, bw/2, h);
    if (h) bars += `<path d="M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${base} Z" fill="${rb.a.color}" opacity="${i === n - 1 ? 1 : .72}"/>`;
    hits += `<rect x="${i*slot}" y="0" width="${slot}" height="${base}" fill="transparent" data-i="${i}" data-v="${v}" data-h="${hourOf(i)}"/>`;
  });
  const lbl = (i, anchor) => `<text x="${i*slot + slot/2}" y="${base + 14}" text-anchor="${anchor}" fill="var(--muted)" font-size="10" font-family="IBM Plex Mono, monospace">${String(hourOf(i)).padStart(2,'0')}:00</text>`;
  return `<div class="chart" id="hourChart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens por hora en las últimas 12 horas, máximo ${fmtFull(max)}">
      <line x1="0" x2="${W}" y1="${top}" y2="${top}" stroke="rgba(239,233,221,.08)"/>
      <text x="0" y="${top - 4}" fill="var(--muted)" font-size="10" font-family="IBM Plex Mono, monospace">${fmtTokens(max)}</text>
      ${bars}
      <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="rgba(239,233,221,.22)"/>
      ${lbl(0, 'start')}${lbl(Math.floor(n/2), 'middle')}
      <text x="${W - slot/2}" y="${base + 14}" text-anchor="end" fill="var(--ivory)" font-size="10" font-family="IBM Plex Mono, monospace">ahora</text>
      ${hits}
    </svg>
    <div class="tip" hidden></div>
  </div>`;
}

let server = null;
async function detectServer(){
  try {
    const r = await fetch('api/salud', { cache:'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.ok && j.token) server = j;
  } catch {}
}
async function api(path, body){
  const r = await fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json', 'X-Habitat-Token': server.token }, body: JSON.stringify(body) });
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.error || 'El servidor del hábitat no respondió.');
  return j;
}

async function poll(){
  try {
    const res = await fetch(`${ESTADO_URL}?t=${Date.now()}`, { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (!Array.isArray(data.agentes)) throw new Error('formato');
    const first = !live;
    live = true; stopSim();
    modeEl.className = 'mode live'; modeText.textContent = server ? 'Conectado a Hermes' : 'En vivo';
    data.agentes.forEach(ag => applyState(ag, false));
    if (Array.isArray(data.mensajes)) loadLiveMessages(data.mensajes);
    if (Array.isArray(data.aprobaciones)) loadLiveApprovals(data.aprobaciones);
    if (Array.isArray(data.presentaciones)) loadLivePresentations(data.presentaciones);
    if (Array.isArray(data.escribiendo)) {
      for (const k in typing) delete typing[k];
      data.escribiendo.forEach(e => { const id = resolveId(e.bot); typing[e.canal === 'equipo' ? 'equipo' : resolveId(e.canal)] = id; });
      renderTyping();
    }
    const when = data.actualizado ? new Date(data.actualizado) : new Date();
    updatedEl.textContent = 'Actualizado ' + when.toLocaleString('es-DO', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short', hour12:false });
    if (first) setInterval(poll, server ? 3000 : REFRESCO_MS);
  } catch (err) {
    if (live) { modeEl.className = 'mode lost'; modeText.textContent = 'Sin conexión'; }
    else startSim();
  }
}

/* modo simulación */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
const SIM_WEIGHT = { sylvia:1.1, viktor:.8, sergio:1.3, bety:1.2, mark:.9, marcelo:.6 };
function seedSim(){
  const start = new Date(); start.setHours(8, 0, 0, 0);
  const nowH = new Date().getHours();
  AGENTS.forEach(a => {
    const I = robots[a.id].info, w = SIM_WEIGHT[a.id];
    I.tokens.porHora = new Array(12).fill(0).map((_, i) => {
      const h = (nowH - (11 - i) + 24) % 24;
      return h < 8 || h > 20 ? 0 : Math.round((6000 + Math.random()*22000) * w);
    });
    const sum = I.tokens.porHora.reduce((x, y) => x + y, 0);
    I.tokens.entrada = Math.round(sum * .82); I.tokens.salida = sum - I.tokens.entrada;
    I.tokens.limite = 400000;
    I.completadas = 2 + Math.floor(Math.random()*8);
    I.activoDesde = Math.min(start.getTime(), Date.now() - 3600e3);
    I.avance = 10 + Math.random()*60;
    I.inicio = Date.now() - (5 + Math.random()*40) * 60000;
    I.cola = SIM_TASKS[a.id].filter(t => t !== robots[a.id].task).slice(0, 2 + Math.floor(Math.random()*2));
  });
}
function simTokens(){
  AGENTS.forEach(a => {
    const rb = robots[a.id], I = rb.info;
    if (rb.state === 'inactivo' || rb.state === 'error') return;
    const add = Math.round((200 + Math.random()*1300) * SIM_WEIGHT[a.id]);
    const out = Math.round(add * (rb.state === 'pensando' ? .1 : .22));
    I.tokens.entrada += add - out; I.tokens.salida += out;
    I.tokens.porHora[11] += add;
    if (I.avance !== null && rb.state === 'trabajando') I.avance = Math.min(98, I.avance + Math.random()*4);
    I.ultima = Date.now();
  });
}
function simAssign(a, estado, tarea, extra = {}){
  const I = robots[a.id].info;
  if (robots[a.id].task && tarea !== robots[a.id].task && robots[a.id].state === 'trabajando') {
    I.completadas++;
    I.cola = I.cola.filter(t => t !== tarea);
    if (I.cola.length < 2) I.cola.push(pick(SIM_TASKS[a.id].filter(t => t !== tarea && !I.cola.includes(t))) || '');
    I.cola = I.cola.filter(Boolean);
  }
  applyState({ id:a.id, estado, tarea, avance: estado === 'trabajando' ? 5 : undefined, ...extra });
}
let meetingUntil = 0;
function simStep(){
  simTokens();
  if (selected && !detailEl.querySelector('.tip:not([hidden])')) renderDetail();
  const now = performance.now();
  if (now > meetingUntil && Math.random() < .12) {
    meetingUntil = now + 60000;
    const tema = pick(['Revisión semanal de leads','Planificación de contenido de octubre','Prioridades del CRM','Lanzamiento de nuevo proyecto']);
    AGENTS.forEach(a => { if (a.id === 'sylvia' || Math.random() < .7) applyState({ id:a.id, estado:'reunion', tarea:tema }); });
    setTimeout(() => simPresent(), 8000);
    setTimeout(() => AGENTS.forEach(a => { if (robots[a.id].state === 'reunion') applyState({ id:a.id, estado:'trabajando', tarea:pick(SIM_TASKS[a.id]) }); }), 60000);
    return;
  }
  if (now < meetingUntil || sceneBusy) return;
  if (Math.random() < .55) return;          // los agentes no cambian de tarea tan seguido
  const a = pick(AGENTS);
  if (robots[a.id].presenting) return;
  const roll = Math.random();
  if (roll < .6) simAssign(a, 'trabajando', pick(SIM_TASKS[a.id]));
  else if (roll < .75) simAssign(a, 'pensando', 'Planificando: ' + pick(SIM_TASKS[a.id]).toLowerCase());
  else if (roll < .87) simAssign(a, 'trabajando', 'Consultando referencias', { sala: a.home === 'libreria' ? 'archivo' : 'libreria' });
  else if (roll < .97) simAssign(a, 'inactivo', '');
  else { simAssign(a, 'error', 'Espera una aprobación del equipo'); helpFlow(a); }
}
function startSim(){
  modeEl.className = 'mode'; modeText.textContent = 'Simulación';
  updatedEl.textContent = 'Datos de ejemplo';
  setTimeout(poll, REFRESCO_MS);   // sigue buscando estado.json por si se conecta
  if (simTimer) return;
  AGENTS.forEach(a => applyState({ id:a.id, estado:'trabajando', tarea:pick(SIM_TASKS[a.id]) }, true));
  seedSim();
  simTimer = setInterval(simStep, 3500);
  startChatter();
  startSimApprovals();
}
function stopSim(){ if (simTimer) { clearInterval(simTimer); simTimer = null; } }

/* ───────── Chat del equipo ─────────
   Canal "Equipo": todos los agentes y las conversaciones entre ellos.
   Canales privados: tú con cada agente.
   En modo simulación los agentes responden solos; en vivo, los mensajes
   llegan en el campo "mensajes" de estado.json.                          */

const ME = { id:'tu', name:'Tú', color:'#EFE9DD' };
const who = id => id === 'tu' ? ME : AGENTS.find(a => a.id === id) || { id, name:id, color:'#8FA7A5' };
const localMsgs = [];
let liveMsgs = [];
let msgSeq = 0, channel = 'equipo', chatOpen = false, sceneBusy = false;
const unread = { equipo:0 }; AGENTS.forEach(a => unread[a.id] = 0);
const typing = {};                       // canal → id del agente que escribe
const seenLive = new Set();

const chatEl = document.getElementById('chat'), chList = document.getElementById('chList'),
      chHead = document.getElementById('chHead'), chMsgs = document.getElementById('chMsgs'),
      chTyping = document.getElementById('chTyping'), chQuick = document.getElementById('chQuick'),
      chForm = document.getElementById('chForm'), chInput = document.getElementById('chInput'),
      chNote = document.getElementById('chNote'), chatBtn = document.getElementById('chatBtn'),
      chatBadge = document.getElementById('chatBadge');

const TK_LABEL = { pendiente:'Pendiente', aceptada:'Aceptada', hecha:'Hecha' };
function chanOf(m){
  if (m.canal) return m.canal;
  if (m.de === 'tu' && m.para !== 'todos' && AGENTS.some(a => a.id === m.para)) return m.para;
  if (m.para === 'tu') return m.de;
  return 'equipo';
}
function allMsgs(){ return liveMsgs.concat(localMsgs).sort((a, b) => a.t - b.t); }

function post(m){
  m.id = m.id || 'l' + (++msgSeq); m.t = m.t || Date.now(); m.tipo = m.tipo || 'mensaje';
  localMsgs.push(m); if (localMsgs.length > 300) localMsgs.shift();
  notify(m);
  renderChat();
  return m;
}
function notify(m){
  const ch = chanOf(m);
  if (m.de !== 'tu' && !(chatOpen && channel === ch)) unread[ch]++;
  const rb = m.de === 'tu' ? avatar : robots[m.de];
  if (rb) {
    rb.say = m.tipo === 'tarea' ? `Tarea para ${who(m.para).name}: ${m.texto}` : m.tipo === 'ayuda' ? `Pido ayuda: ${m.texto}` : m.texto;
    if (rb.say.length > 110) rb.say = rb.say.slice(0, 107) + '…';
    rb.sayUntil = performance.now() + 6000;
  }
  if (m.tipo === 'tarea' && robots[m.para]) {
    const I = robots[m.para].info;
    if (!I.cola.includes(m.texto)) { I.cola.push(m.texto); I.cola = I.cola.slice(-5); }
    if (selected === m.para) renderDetail();
  }
}
function setTaskState(m, estado){ m.estado = estado; renderChat(); }

/* escribir con pausa natural */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function say(de, para, texto, extra = {}, delay){
  const ch = chanOf({ de, para, ...extra });
  typing[ch] = de; renderTyping();
  await wait(delay ?? 900 + Math.min(2200, texto.length * 22));
  if (typing[ch] === de) delete typing[ch];
  renderTyping();
  return post({ de, para, texto, ...extra });
}

/* ---------- a quién le toca ---------- */
const SKILLS = [
  ['bety',    /contenido|redact|texto|post|publicaci|carrusel|calendario|linkedin|copy|borrador|art[ií]culo|newsletter/i],
  ['mark',    /marketing|lead|campa[nñ]|anuncio|alcance|m[eé]trica|captaci|audiencia|redes|ads/i],
  ['marcelo', /crm|cliente|seguimiento|contacto|recordatorio|registro/i],
  ['viktor',  /venta|vender|propuesta|oferta de compra|comprador|negociaci|visita|cierre|inversionista/i],
  ['sergio',  /investig|mercado|tendencia|noticia|zona|destino|confotur|ley|verific|fuente|proyecto|dato/i],
  ['sylvia',  /reuni[oó]n|agenda|coordina|prioridad|planifica|equipo/i],
];
function mentioned(text){
  const m = text.match(/@([a-záéíóúñ0-9_-]+)/i);
  if (!m) return null;
  const id = resolveId(m[1]);
  return AGENTS.some(a => a.id === id) ? id : null;
}
function route(text){ for (const [id, re] of SKILLS) if (re.test(text)) return id; return null; }
const isTask   = t => /tarea|asigna|prepara|hazme|haz |necesito|puedes|podr[ií]as|revisa|crea|busca|actualiza|dise[nñ]a|investiga|env[ií]a|arma|redacta/i.test(t);
const isStatus = t => /c[oó]mo va|estado|avance|en qu[eé] est|qu[eé] hac/i.test(t);
const isMeet   = t => /reuni[oó]n|junta|re[uú]nanse/i.test(t);
const clean    = t => t.replace(/@[a-záéíóúñ0-9_-]+/ig, '').replace(/^\s*(tarea|asigna(r)?( tarea)?)\s*:?\s*/i, '').replace(/^\s*(por favor,?\s*)?(necesito( que)?|puedes|podr[ií]as|hazme)\s+/i, '').replace(/[?¿]/g, '').replace(/\s+/g, ' ').trim();
const cap      = t => t.charAt(0).toUpperCase() + t.slice(1);

function statusLine(id){
  const rb = robots[id], I = rb.info;
  if (rb.state === 'inactivo') return 'Estoy en pausa ahora mismo. Puedo tomar algo nuevo si lo necesitas.';
  if (rb.state === 'error') return `Estoy detenido: ${rb.task.toLowerCase()}.`;
  if (rb.state === 'reunion') return `Estoy en la reunión: ${rb.task}.`;
  if (!rb.task) return 'Estoy disponible. Puedo tomar una tarea nueva.';
  return `${rb.state === 'pensando' ? 'Estoy planificando' : 'Estoy con'} «${rb.task}»${I.avance !== null ? `, al ${Math.round(I.avance)}%` : ''}. ${I.cola.length ? `Después sigo con «${I.cola[0]}».` : 'No tengo nada más en la lista.'}`;
}

let sampler = null, aiState = 'pendiente', aiAsked = false;

async function aiReply(ch, text){
  const responder = ch !== 'equipo' ? ch : (mentioned(text) || 'sylvia');
  const ag = who(responder);
  const team = AGENTS.map(a => {
    const rb = robots[a.id];
    return `- ${a.id} = ${a.name} (${a.role}, sala ${ROOMS[a.home].name}). ${rb.info.mision} Ahora: ${STATE_LABEL[rb.state]}${rb.task ? ' · ' + rb.task : ''}. Su lista: ${rb.info.cola.join('; ') || 'vacía'}.`;
  }).join('\n');
  const convo = allMsgs().filter(m => chanOf(m) === ch && m.tipo !== 'sistema').slice(-12)
    .map(m => `${who(m.de).name}${m.tipo === 'tarea' ? ` (asigna tarea a ${who(m.para).name})` : ''}: ${m.texto}`).join('\n');
  const prompt = `Eres ${ag.name}, un agente de IA (bot de Hermes Agent) del equipo interno de Madreperla Realtors, una firma boutique de bienes raíces de lujo en República Dominicana (Cap Cana, Bávaro, Cabeza de Toro, Cana Bay, Bayahibe, Miches, Las Terrenas). Tu función: ${robots[responder].info.mision}
${ch === 'equipo' ? 'Hablas en el canal general del equipo, donde están los seis agentes y María Andrea, fundadora de Madreperla ("Tú").' : 'Hablas en privado con María Andrea, fundadora de Madreperla ("Tú").'}

El equipo:
${team}

Reglas:
- Responde en español, en 1 a 3 frases, con tono cercano y profesional (es una conversación interna).
- No inventes cifras, resultados ni datos de clientes. Si no sabes algo, dilo y propone cómo averiguarlo.
- No decides temas legales, contractuales ni precios finales: eso lo revisa una persona autorizada.
- Nunca digas que enviaste o publicaste algo hacia clientes; como mucho preparas borradores para revisión.
- Si te piden una tarea que es tuya, acéptala. Si corresponde mejor a otro agente, asígnasela y dilo.

Conversación reciente:
${convo}

Responde solo con JSON, así: {"respuesta": "texto", "asignar": null}
o, si asignas una tarea: {"respuesta": "texto", "asignar": {"para": "pixel", "texto": "tarea corta y concreta"}}
Valores válidos de "para": ${AGENTS.map(a => a.id).join(', ')}.`;

  const replyTo = ch === 'equipo' ? 'todos' : 'tu';
  typing[ch] = responder; renderTyping();
  aiAsked = true; renderChat();
  let out;
  try {
    out = await sampler.json(prompt, { modelTier:'quick', cache:false });
  } finally {
    if (typing[ch] === responder) delete typing[ch];
    renderTyping();
  }
  const respuesta = typeof out?.respuesta === 'string' && out.respuesta.trim() ? out.respuesta.trim().slice(0, 600) : null;
  if (!respuesta) throw { code:'invalid_json' };
  post({ de:responder, para:replyTo, texto:respuesta });
  const asg = out.asignar;
  if (asg && typeof asg === 'object' && AGENTS.some(a => a.id === asg.para) && typeof asg.texto === 'string' && asg.texto.trim()) {
    const tarea = cap(asg.texto.trim().slice(0, 160));
    if (asg.para === responder) await assignFlow('tu', responder, tarea, ch === 'equipo');
    else await assignFlow(responder, asg.para, tarea, true);
  }
}

/* ---------- respuestas (modo simulación) ---------- */
async function assignFlow(from, to, texto, inTeam = true){
  const extra = { tipo:'tarea', estado:'pendiente', canal: inTeam ? 'equipo' : undefined };
  const card = from === 'tu' ? post({ de:'tu', para:to, texto, ...extra }) : await say(from, to, texto, extra, 700);
  const back = inTeam ? 'todos' : 'tu';
  await wait(1400);
  setTaskState(card, 'aceptada');
  await say(to, back, pick([
    `Recibido. Lo agrego a mi lista; queda en la posición ${robots[to].info.cola.length}.`,
    `Entendido, me encargo. Te aviso cuando esté listo.`,
    `Hecho, lo tomo. Empiezo en cuanto termine lo actual.`,
  ]));
  setTimeout(async () => {
    if (live) return;
    setTaskState(card, 'hecha');
    const I = robots[to].info; I.cola = I.cola.filter(t => t !== texto); I.completadas++;
    await say(to, back, `Listo: «${texto}».${from !== 'tu' ? ` ${who(from).name}, ya lo tienes.` : ''}`);
  }, 40000 + Math.random()*40000);
}

async function replyToUser(ch, text){
  if (live) return;                                   // en vivo responden los agentes reales
  const target = mentioned(text);
  const body = clean(text);
  if (isPresentReq(text)) return presentRequest(ch, target, body || text);
  const special = isMeet(text) && ch === 'equipo' || isStatus(text) && !(ch === 'equipo' && target);
  if (aiState === 'on' && !special) {
    try { return await aiReply(ch, text); }
    catch (e) {
      if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e?.code)) { aiState = 'off'; renderChat(); }
      else if (e?.code === 'rate_limited') { post({ de:'sistema', para:'todos', canal:ch, tipo:'sistema', texto:'Demasiadas consultas seguidas. Espera un momento y vuelve a escribir.' }); return; }
      else if (e?.code === 'session_expired') { post({ de:'sistema', para:'todos', canal:ch, tipo:'sistema', texto:'Tu sesión de Claude expiró. Vuelve a iniciar sesión para que los agentes respondan con IA.' }); return; }
      // cualquier otro fallo: seguimos con la respuesta simulada
    }
  }
  if (ch !== 'equipo') {                              // conversación privada
    const id = ch;
    if (isStatus(text)) return say(id, 'tu', statusLine(id));
    if (isTask(text) && body.length > 3) {
      const best = route(body);
      if (best && best !== id && id !== 'sylvia') {
        await say(id, 'tu', `Esto le corresponde más a ${who(best).name}. Se lo paso y le doy seguimiento.`);
        return assignFlow(id, best, cap(body));
      }
      if (id === 'sylvia' && best && best !== 'sylvia') {
        await say('sylvia', 'tu', `Perfecto. Se lo asigno a ${who(best).name}.`);
        return assignFlow('sylvia', best, cap(body));
      }
      return assignFlow('tu', id, cap(body), false);
    }
    return say(id, 'tu', /hola|buen/i.test(text) ? GREET[id] : pick([
      'Anotado. ¿Quieres que lo convierta en una tarea?',
      'Tomo nota. Si necesitas que haga algo concreto, dímelo y lo agrego a mi lista.',
      'Entendido. ¿Hay algún plazo que deba tener en cuenta?',
    ]));
  }
  // canal Equipo
  if (isMeet(text)) {
    await say('sylvia', 'todos', 'Convoco a todo el equipo al Meeting Room.');
    const tema = body.length > 10 ? cap(body) : 'Reunión convocada desde el chat';
    AGENTS.forEach(a => applyState({ id:a.id, estado:'reunion', tarea:tema }));
    avatarToSeat();
    meetingUntil = performance.now() + 60000;
    setTimeout(() => simPresent(), 8000);
    setTimeout(() => AGENTS.forEach(a => { if (robots[a.id].state === 'reunion') applyState({ id:a.id, estado:'trabajando', tarea:pick(SIM_TASKS[a.id]) }); }), 60000);
    return;
  }
  if (isStatus(text) && !target) {
    for (const a of AGENTS) await say(a.id, 'todos', statusLine(a.id), {}, 700 + Math.random()*700);
    return;
  }
  if (isTask(text) && body.length > 3) {
    const to = target || route(body) || 'sylvia';
    if (target) return assignFlow('tu', to, cap(body), true);
    await say('sylvia', 'todos', to === 'sylvia' ? 'Lo tomo yo y lo organizo.' : `Se lo asigno a ${who(to).name}.`);
    return assignFlow('sylvia', to, cap(body));
  }
  if (target) return say(target, 'todos', GREET[target]);
  return say('sylvia', 'todos', 'Anotado. Si quieres que alguien se encargue, escribe la tarea o menciona a un agente con @.');
}

async function runScene(scene){
  if (sceneBusy || live) return;
  sceneBusy = true;
  // el primero camina a la sala del otro si le habla directo
  const [a0, b0] = scene[0];
  const visit = b0 !== 'todos' && Math.random() < .6 && robots[a0].state !== 'reunion';
  const prev = visit ? { estado: robots[a0].state, tarea: robots[a0].task } : null;
  if (visit) { applyState({ id:a0, estado:'trabajando', sala: AGENTS.find(a => a.id === b0).home, tarea:`Conversando con ${who(b0).name}` }); await wait(4500); }
  try {
    for (const [de, para, texto, tipo] of scene) {
      if (live) break;
      if (tipo === 'tarea') await assignFlow(de, para, texto);
      else await say(de, para, texto);
      await wait(900);
    }
  } finally {
    if (visit && !live) applyState({ id:a0, estado: prev.estado === 'reunion' ? 'trabajando' : prev.estado, tarea: prev.tarea || pick(SIM_TASKS[a0]) });
    sceneBusy = false;
  }
}

  applyState({ id:helper, estado:'trabajando', sala:a.home, tarea:`Ayudando a ${a.name}` });

}

function loadLiveMessages(list){
  const next = list.slice(-300).map((m, i) => ({
    id: 'v' + (m.id ?? i), de: resolveId(m.de), para: ['todos','tu'].includes(m.para) || !m.para ? (m.para || 'todos') : resolveId(m.para), texto: String(m.texto || ''),
    tipo: ['mensaje','tarea','ayuda','sistema','presentacion'].includes(m.tipo) ? m.tipo : 'mensaje',
    ref: m.ref ? 'v' + m.ref : undefined,
    estado: TK_LABEL[m.estado] ? m.estado : (m.tipo === 'tarea' ? 'pendiente' : undefined),
    t: m.hora && !isNaN(Date.parse(m.hora)) ? Date.parse(m.hora) : Date.now(),
    canal: m.canal ? (m.canal === 'equipo' ? 'equipo' : resolveId(m.canal)) : undefined,
  })).filter(m => m.texto);
  const sig = next.map(m => m.id + (m.estado || '')).join('|');
  if (sig === liveSig) return;
  liveSig = sig;
  next.forEach(m => { if (!seenLive.has(m.id)) { seenLive.add(m.id); if (liveMsgs.length) notify(m); } });
  liveMsgs = next;
  renderChat();
}

      <span class="nm">${name}<small>${sub}</small></span>

    <button class="x" id="chClose" aria-label="Cerrar chat">×</button>`;

function renderMsg(m){
  if (m.tipo === 'sistema') return `<div class="sysline">${esc(m.texto)}</div>`;
  const w = who(m.de), mine = m.de === 'tu';
  const to = channel === 'equipo' && m.para !== 'todos' && m.tipo !== 'tarea' ? `<span class="to">→ ${esc(who(m.para).name)}</span>` : '';
  let content = `<div class="txt">${esc(m.texto)}</div>`;
  if (m.tipo === 'tarea') {
    const dest = who(m.para);
    content = `<div class="card-msg" style="--c2:${dest.color}">
      <div class="top"><span class="eyebrow">Tarea asignada</span><span class="chip tk-${m.estado || 'pendiente'}">${TK_LABEL[m.estado || 'pendiente']}</span></div>
      <div class="route">${esc(w.name)} → ${esc(dest.name)}</div>
      <div class="what">${esc(m.texto)}</div></div>`;
  } else if (m.tipo === 'ayuda') {
    content = `<div class="card-msg help"><span class="eyebrow" style="color:var(--bad)">Pide ayuda</span><div class="what">${esc(m.texto)}</div></div>`;
  } else if (m.tipo === 'presentacion') {
    const pr = presentations.find(x => x.id === m.ref);
    content = `<div class="card-msg pres" style="--c2:${w.color}">
      <span class="eyebrow">${pr ? PRES_TIPO[pr.tipo] : 'Presentación'}</span>
      <div class="what">${esc(pr ? pr.titulo : m.texto)}</div>
      ${pr ? `<button class="open-pres" data-pres="${esc(pr.id)}">Abrir</button>` : ''}</div>`;
  }
  return `<div class="msg${mine ? ' mine' : ''}" style="--c:${w.color}">
    <span class="av" aria-hidden="true">${esc(initials(w.name))}</span>
    <div class="body"><div class="who">${esc(w.name)} ${to}<time>${hhmm(m.t)}</time></div>${content}</div>
  </div>`;
}

  e.preventDefault();
  const text = chInput.value.trim(); if (!text) return;
  chInput.value = '';
  const ch = channel;
  if (live && server) {
    if (ch === 'equipo' && isMeet(text)) return sendMeeting(text.replace(/^reuni[oó]n\s*:?\s*/i, '') || 'Reunión convocada por María Andrea');
    try { await api('api/mensaje', { para: ch === 'equipo' ? 'todos' : who(ch).hermes, texto: text }); poll(); }
    catch (err) { post({ de:'sistema', para:'tu', canal: ch, tipo:'sistema', texto: err.message }); chInput.value = text; }
    return;
  }
  if (live) { post({ de:'sistema', para:'tu', canal: ch, tipo:'sistema', texto:'En esta versión el chat es de solo lectura. Abre el hábitat con el servidor local para escribirles.' }); return; }
  post({ de:'tu', para: ch === 'equipo' ? 'todos' : ch, texto:text });
  replyToUser(ch, text);
});

const CLASE_LABEL = { borrador:'Borrador', propuesta:'Propuesta', consulta:'Consulta' };

const pendingApprovals = () => approvals.filter(a => a.estado === 'pendiente');

}
aprBtn.addEventListener('click', () => aprOpen ? closeApprovals() : openApprovals());

aprPanel.addEventListener('input', e => {
  const id = e.target.dataset?.apr; if (!id) return;
  (aprUI[id] ||= {}).comment = e.target.value;
  if (aprUI[id].err) { aprUI[id].err = ''; }
});
aprPanel.addEventListener('click', e => {
  if (e.target.closest('#aprClose')) return closeApprovals();
  const tab = e.target.closest('[data-tab]'); if (tab) { aprTab = tab.dataset.tab; return renderApprovals(true); }
  const more = e.target.closest('[data-more]'); if (more) { const u = (aprUI[more.dataset.more] ||= {}); u.open = !u.open; return renderApprovals(true); }
  const ok = e.target.closest('[data-ok]'); if (ok) return decide(ok.dataset.ok, 'aprobada');
  const back = e.target.closest('[data-back]'); if (back) return decide(back.dataset.back, 'devuelta');
});

async function decide(id, decision){
  const a = approvals.find(x => x.id === id);
  if (!a || a.estado !== 'pendiente') return;
  const ui = (aprUI[id] ||= {});
  const comentario = (ui.comment || '').trim();
  if (decision === 'devuelta' && !comentario) { ui.err = 'Escribe qué hay que ajustar para devolverlo.'; return renderApprovals(true); }
  if (decision === 'aprobada' && !ui.confirm) {            // segundo toque para confirmar
    ui.confirm = true; renderApprovals(true);
    setTimeout(() => { if (ui.confirm) { ui.confirm = false; renderApprovals(true); } }, 8000);
    return;
  }
  ui.confirm = false; ui.err = '';
  if (live) {
    if (!server) return;
    ui.busy = true; renderApprovals(true);
    try { await api('api/aprobacion', { id: a.srcId, decision, comentario }); delete aprUI[id]; poll(); }
    catch (err) { ui.err = err.message; }
    ui.busy = false; renderApprovals(true);
    return;
  }
  a.estado = decision; a.comentario = comentario; a.td = Date.now();
  delete aprUI[id];
  renderApprovals(true);
  simApprovalReply(a);
}
