/* ───────── Presentaciones ─────────
   Los bots muestran su trabajo como diapositivas, documento o dashboard.
   Se ven en la pantalla grande del Meeting Room y en grande en el visor.  */
const PRES_TIPO = { slides:'Presentación', documento:'Documento', dashboard:'Dashboard' };
var presentations = [];
let presActive = null, presPage = 0, presClock = 0, presEndsAt = 0;
const viewerState = { open:false, id:null, i:0 };
const nowbar = document.getElementById('nowbar'), nbText = document.getElementById('nbText'),
      viewerEl = document.getElementById('viewer'), vwBody = document.getElementById('vwBody'), vwFoot = document.getElementById('vwFoot');

function normPres(r, extra = {}){
  const str = (v, n = 400) => String(v ?? '').trim().slice(0, n);
  const arr = v => Array.isArray(v) ? v : [];
  const tipo = PRES_TIPO[r.tipo] ? r.tipo : (r.kpis || r.series ? 'dashboard' : r.secciones ? 'documento' : 'slides');
  const slides = arr(r.slides).slice(0, 20).map(x => ({ titulo: str(x.titulo, 140), puntos: arr(x.puntos).slice(0, 8).map(y => str(y, 240)).filter(Boolean), nota: str(x.nota, 400) })).filter(x => x.titulo || x.puntos.length);
  const secciones = arr(r.secciones).slice(0, 20).map(x => ({ titulo: str(x.titulo, 140), texto: str(x.texto, 4000) })).filter(x => x.titulo || x.texto);
  const kpis = arr(r.kpis).slice(0, 6).map(k => ({ nombre: str(k.nombre, 60), valor: str(k.valor, 24), cambio: str(k.cambio, 80) })).filter(k => k.nombre);
  const series = arr(r.series).slice(0, 3).map(x => ({ nombre: str(x.nombre, 80), tipo: x.tipo === 'linea' ? 'linea' : 'barras',
    puntos: arr(x.puntos).slice(0, 24).map(q => Array.isArray(q) ? [str(q[0], 24), Number(q[1]) || 0] : [str(q.x ?? q.etiqueta, 24), Number(q.y ?? q.valor) || 0]) })).filter(x => x.puntos.length);
  const titulo = str(r.titulo, 140) || 'Presentación';
  if (tipo === 'slides' && !slides.length) slides.push({ titulo, puntos: [], nota: '' });
  return { id: extra.id || 'p' + (++msgSeq), de: extra.de || resolveId(r.de), titulo, tipo, slides, secciones, kpis, series,
           t: extra.t || Date.now(), ejemplo: !!extra.ejemplo };
}
const presPages = pr => pr.tipo === 'slides' ? pr.slides.length : pr.tipo === 'documento' ? Math.max(1, pr.secciones.length) : 1;

/* --- pantalla grande en 3D --- */
function wrapLines(x, text, maxW, maxLines){
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; if (lines.length === maxLines) break; } else cur = t; }
  if (lines.length < maxLines && cur) lines.push(cur);
  if (lines.length === maxLines && words.join(' ').length > lines.join(' ').length + 1) lines[maxLines - 1] = lines[maxLines - 1].replace(/.{0,2}$/, '…');
  return lines;
}
function drawPresScreen(){
  if (!PRES_SCREEN) return;
  const { cv, tex } = PRES_SCREEN, x = cv.getContext('2d'), w = cv.width, h = cv.height;
  const pr = presActive;
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#0E3238'); g.addColorStop(1, '#071A1E');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  if (!pr) {
    x.fillStyle = '#CDBB93'; x.font = '600 30px sans-serif'; x.fillText('MEETING ROOM', 56, 110);
    x.fillStyle = '#EFE9DD'; x.font = '600 58px sans-serif'; x.fillText('Madreperla', 56, 190);
    x.fillStyle = '#8FA7A5'; x.font = '26px sans-serif';
    x.fillText(presentations.length ? `Última: ${presentations[presentations.length - 1].titulo}`.slice(0, 60) : 'Sin presentación en curso', 56, 250);
    tex.needsUpdate = true; return;
  }
  const col = robots[pr.de]?.a.color || '#CDBB93', name = robots[pr.de]?.a.name || '';
  x.fillStyle = col; x.fillRect(0, 0, 14, h);
  x.fillStyle = '#8FA7A5'; x.font = '22px sans-serif';
  x.fillText(`${name} · ${PRES_TIPO[pr.tipo]}${pr.ejemplo ? ' · ejemplo' : ''}`, 56, 52);
  const n = presPages(pr), i = presPage % n;
  if (pr.tipo === 'dashboard') {
    x.fillStyle = '#EFE9DD'; x.font = '600 40px sans-serif'; x.fillText(pr.titulo.slice(0, 44), 56, 108);
    pr.kpis.slice(0, 4).forEach((k, j) => {
      const bx = 56 + j * 230, by = 140;
      x.strokeStyle = 'rgba(205,187,147,.3)'; x.lineWidth = 2; x.strokeRect(bx, by, 210, 110);
      x.fillStyle = '#8FA7A5'; x.font = '18px sans-serif'; x.fillText(k.nombre.slice(0, 20), bx + 16, by + 32);
      x.fillStyle = '#EFE9DD'; x.font = '600 44px sans-serif'; x.fillText(k.valor.slice(0, 9), bx + 16, by + 84);
    });
    const se = pr.series[0];
    if (se) {
      const max = Math.max(...se.puntos.map(q => q[1]), 1), bw = (w - 112) / se.puntos.length;
      se.puntos.forEach((q, j) => { const bh = (q[1] / max) * 130; x.fillStyle = col; x.fillRect(56 + j * bw + 4, 410 - bh, bw - 8, bh); });
      x.fillStyle = 'rgba(239,233,221,.3)'; x.fillRect(56, 410, w - 112, 2);
    }
  } else {
    const item = pr.tipo === 'slides' ? pr.slides[i] : (pr.secciones[i] || { titulo: pr.titulo, texto: '' });
    x.fillStyle = '#EFE9DD'; x.font = '600 46px sans-serif';
    const tl = wrapLines(x, item.titulo || pr.titulo, w - 120, 2); tl.forEach((l, j) => x.fillText(l, 56, 118 + j * 54));
    let y = 118 + tl.length * 54 + 26;
    x.font = '28px sans-serif'; x.fillStyle = 'rgba(239,233,221,.9)';
    const pts = pr.tipo === 'slides' ? item.puntos : [item.texto];
    for (const pt of pts) {
      const lines = wrapLines(x, pt, w - 150, pr.tipo === 'slides' ? 2 : 5);
      if (pr.tipo === 'slides') { x.fillStyle = col; x.beginPath(); x.arc(64, y - 9, 7, 0, Math.PI * 2); x.fill(); x.fillStyle = 'rgba(239,233,221,.9)'; }
      for (const l of lines) { if (y > h - 40) break; x.fillText(l, pr.tipo === 'slides' ? 88 : 56, y); y += 36; }
      y += 10;
    }
  }
  if (n > 1) { x.fillStyle = '#8FA7A5'; x.font = '20px sans-serif'; x.fillText(`${i + 1} / ${n}`, w - 110, h - 26); }
  tex.needsUpdate = true;
}

/* --- inicio y fin --- */
function startPresentation(pr, opts = {}){
  if (!presentations.some(q => q.id === pr.id)) presentations.push(pr);
  if (presActive && presActive.id !== pr.id) endPresentation(true);
  presActive = pr; presPage = 0; presClock = 0;
  presEndsAt = opts.live ? 0 : performance.now() + Math.max(30000, presPages(pr) * 8000 + 8000);
  const rb = robots[pr.de];
  if (rb && PODIUM) {
    rb.presenting = true;
    rb.path = planPath(rb.at, rb.g.position, 'meeting', PODIUM.clone());
    rb.at = 'meeting'; rb.look = ROOMS.meeting.center.clone();
  }
  drawPresScreen(); renderNowBar();
  if (selected) renderDetail();
}
function endPresentation(silent){
  const pr = presActive; if (!pr) return;
  presActive = null;
  const rb = robots[pr.de];
  if (rb) { rb.presenting = false; routeTo(rb, rb.room, rb.state); }
  drawPresScreen(); renderNowBar();
}
function presTick(dt, now){
  if (!presActive) return;
  presClock += dt;
  if (presClock > 7) { presClock = 0; presPage++; drawPresScreen(); }
  if (presEndsAt && now > presEndsAt) endPresentation();
}
function renderNowBar(){
  const pr = presActive;
  nowbar.hidden = !pr;
  document.body.classList.toggle('presenting', !!pr);
  if (!pr) return;
  const rb = robots[pr.de];
  nowbar.style.setProperty('--c', rb?.a.color || '#CDBB93');
  nbText.innerHTML = `<b>${esc(rb?.a.name || 'Un agente')}</b> presenta · ${esc(pr.titulo)}`;
}
document.getElementById('nbOpen').addEventListener('click', () => { if (presActive) openViewer(presActive.id); });

/* --- visor en grande --- */
function openViewer(id){
  const pr = presentations.find(q => q.id === id); if (!pr) return;
  viewerState.open = true; viewerState.id = id; viewerState.i = 0;
  viewerEl.hidden = false; renderViewer();
  document.getElementById('vwClose').focus();
}
function closeViewer(){ viewerState.open = false; viewerEl.hidden = true; }
function viewerStep(d){
  const pr = presentations.find(q => q.id === viewerState.id); if (!pr || pr.tipo !== 'slides') return;
  viewerState.i = Math.max(0, Math.min(pr.slides.length - 1, viewerState.i + d)); renderViewer();
}
function barChart(se, col, idx){
  const W = 520, H = 220, top = 16, base = 178, left = 8;
  const max = Math.max(...se.puntos.map(q => q[1]), 1), n = se.puntos.length;
  const slot = (W - left) / n, bw = Math.max(6, slot - 6);
  const maxI = se.puntos.findIndex(q => q[1] === max);
  let marks = '', hits = '', labels = '';
  if (se.tipo === 'linea') {
    const pts = se.puntos.map((q, i) => [left + i * slot + slot/2, base - (q[1] / max) * (base - top)]);
    marks = `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>` +
      pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === maxI || i === n - 1 ? 4.5 : 3}" fill="${col}" stroke="#0B252A" stroke-width="2"/>`).join('');
  } else {
    se.puntos.forEach((q, i) => {
      const h = q[1] > 0 ? Math.max(3, (q[1] / max) * (base - top)) : 0, x = left + i * slot + 3, y = base - h, r = Math.min(4, bw/2, h);
      if (h) marks += `<path d="M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${base} Z" fill="${col}" opacity="${i === maxI ? 1 : .75}"/>`;
    });
  }
  se.puntos.forEach((q, i) => {
    hits += `<rect x="${left + i * slot}" y="0" width="${slot}" height="${base}" fill="transparent" data-l="${esc(q[0])}" data-v="${q[1]}"/>`;
    if (n <= 8 || i % Math.ceil(n / 8) === 0) labels += `<text x="${left + i * slot + slot/2}" y="${base + 18}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">${esc(q[0].slice(0, 10))}</text>`;
  });
  const mx = left + maxI * slot + slot/2, my = base - (max / max) * (base - top) - 8;
  return `<div class="chartbox" data-chart="${idx}"><h4>${esc(se.nombre || 'Serie')}</h4>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(se.nombre)}: máximo ${max.toLocaleString('es-DO')} en ${esc(se.puntos[maxI][0])}">
      <line x1="${left}" x2="${W}" y1="${top}" y2="${top}" stroke="rgba(239,233,221,.08)"/>
      <line x1="${left}" x2="${W}" y1="${(top + base)/2}" y2="${(top + base)/2}" stroke="rgba(239,233,221,.06)"/>
      ${marks}
      <text x="${Math.min(W - 20, Math.max(20, mx))}" y="${Math.max(12, my)}" text-anchor="middle" fill="var(--ivory)" font-size="12" font-family="IBM Plex Mono, monospace">${max.toLocaleString('es-DO')}</text>
      <line x1="${left}" x2="${W}" y1="${base}" y2="${base}" stroke="rgba(239,233,221,.25)"/>
      ${labels}${hits}
    </svg><div class="tip" hidden></div></div>`;
}

let tonePass = null;
if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass && THREE.ShaderPass) {
  renderer.toneMapping = THREE.NoToneMapping;          // el tono se aplica al final
  renderer.outputEncoding = THREE.LinearEncoding;
  const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: renderer.capabilities.isWebGL2 ? 4 : 0 });
  composer = new THREE.EffectComposer(renderer, rt);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth/2, innerHeight/2), 0.6, 0.28, 1.05);
  composer.addPass(bloom);
  composer.addPass(tonePass = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, exposure: { value: 0.8 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform float exposure; varying vec2 vUv;
      vec3 fit(vec3 v){ vec3 a = v*(v+0.0245786)-0.000090537; vec3 b = v*(0.983729*v+0.4329510)+0.238081; return a/b; }
      void main(){
        vec3 c = texture2D(tDiffuse, vUv).rgb * exposure / 0.6;
        const mat3 I = mat3(vec3(0.59719,0.07600,0.02840), vec3(0.35458,0.90834,0.13383), vec3(0.04823,0.01566,0.83777));
        const mat3 O = mat3(vec3(1.60475,-0.10208,-0.00327), vec3(-0.53108,1.10813,-0.07276), vec3(-0.07367,-0.00605,1.07602));
        c = clamp(O * fit(I * c), 0.0, 1.0);
        c = mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c));
        float d = distance(vUv, vec2(0.5));
        c *= mix(1.0, 0.7, smoothstep(0.42, 0.95, d));
        gl_FragColor = vec4(c, 1.0);
      }`,
  }));
}

];
DN_KEYS.forEach(k => { k.bgC = new THREE.Color(k.bg); k.sunC = new THREE.Color(k.sun); });
const dn = { bg: new THREE.Color(), sun: new THREE.Color(), si:0, hi:0, ex:.8, rl:1, du:.55, pos: new THREE.Vector3(), ready:false };
const dnTmp = { bg: new THREE.Color(), sun: new THREE.Color(), pos: new THREE.Vector3() };
function horaRD(){
  try {
    const p = new Intl.DateTimeFormat('es-DO', { timeZone:'America/Santo_Domingo', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(new Date());
    const h = +p.find(x => x.type === 'hour').value, m = +p.find(x => x.type === 'minute').value;
    return { h, m, f: h + m/60 };
  } catch { const d = new Date(); return { h:d.getHours(), m:d.getMinutes(), f:d.getHours() + d.getMinutes()/60 }; }
}
function periodo(f){ return f < 5.5 ? 'Madrugada' : f < 12 ? 'Mañana' : f < 14 ? 'Mediodía' : f < 18 ? 'Tarde' : f < 19.4 ? 'Atardecer' : 'Noche'; }
let dnLastClock = 0;
function updateDayNight(dt){
  const real = horaRD();
  const mode = horaSel.value;
  const f = PRESET_H[mode] ?? real.f;
  let i = 0; while (i < DN_KEYS.length - 2 && DN_KEYS[i+1].t <= f) i++;
  const A = DN_KEYS[i], B = DN_KEYS[i+1], u = Math.min(1, Math.max(0, (f - A.t) / (B.t - A.t)));
  dnTmp.bg.copy(A.bgC).lerp(B.bgC, u); dnTmp.sun.copy(A.sunC).lerp(B.sunC, u);
  const lerp = (a, b) => a + (b - a) * u;
  const T = { si:lerp(A.si, B.si), hi:lerp(A.hi, B.hi), ex:lerp(A.ex, B.ex), rl:lerp(A.rl, B.rl), du:lerp(A.du, B.du) };
  // el sol cruza de este a oeste; de noche, la luna queda alta y fría
  if (f >= 6 && f <= 19) { const ang = (f - 6) / 13 * Math.PI; dnTmp.pos.set(-Math.cos(ang) * 40, 10 + Math.sin(ang) * 34, 18); }
  else dnTmp.pos.set(16, 40, -12);
  const k = dn.ready ? 1 - Math.exp(-dt * 2.2) : 1;       // transición suave al cambiar de hora
  dn.ready = true;
  dn.bg.lerp(dnTmp.bg, k); dn.sun.lerp(dnTmp.sun, k); dn.pos.lerp(dnTmp.pos, k);
  for (const key of ['si', 'hi', 'ex', 'rl', 'du']) dn[key] += (T[key] - dn[key]) * k;
  scene.background.copy(dn.bg); scene.fog.color.copy(dn.bg);
  sun.color.copy(dn.sun); sun.intensity = dn.si; sun.position.copy(dn.pos);
  hemi.intensity = dn.hi;
  if (tonePass) tonePass.uniforms.exposure.value = dn.ex; else renderer.toneMappingExposure = dn.ex + .12;
  ROOM_LIGHTS.forEach(l => { l.intensity = l.userData.base * dn.rl; });
  NIGHT_GLOWS.forEach(m => { m.emissiveIntensity = m.userData.base * dn.rl; });
  if (DUST) DUST.material.opacity = dn.du;
  const now = performance.now();
  if (now - dnLastClock > 5000 || dt === 0) {
    dnLastClock = now;
    const hh = String(real.h).padStart(2, '0') + ':' + String(real.m).padStart(2, '0');
    relojEl.textContent = mode === 'auto' ? `Santo Domingo · ${hh} · ${periodo(real.f)}` : `Santo Domingo · ${hh} · vista de ${horaSel.options[horaSel.selectedIndex].text.toLowerCase()}`;
  }
}
horaSel.addEventListener('change', () => { dnLastClock = 0; try { localStorage.setItem('habitat-hora', horaSel.value); } catch {} });
try { const v = localStorage.getItem('habitat-hora'); if (v && [...horaSel.options].some(o => o.value === v)) horaSel.value = v; } catch {}
updateDayNight(0);

/* entrada de cámara */
const intro = { t: reduceMotion ? 1 : 0, from: new THREE.Vector3(-20, 70, 76), to: camera.position.clone() };
if (intro.t < 1) { camera.position.copy(intro.from); controls.enabled = false; }

/* ───────── Bucle ───────── */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
const SPEED = 2.6;

function project(v, el, dy = 0){
  tmp.copy(v); tmp.y += dy; tmp.project(camera);
  const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.2 && Math.abs(tmp.y) < 1.2;
  el.style.display = vis ? '' : 'none';
  if (vis) el.style.transform = `translate(${(tmp.x*.5+.5)*innerWidth}px, ${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
}

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updaters.forEach(fn => fn(reduceMotion ? dt*.3 : dt, reduceMotion ? t*.3 : t));

  const now = performance.now();
  for (const rb of MOVERS) {
    const p = rb.g.position;
    if (rb.path.length) {
      const target = rb.path[0];
      tmp.subVectors(target, p); tmp.y = 0;
      const d = tmp.length();
      if (d < 0.08) { rb.path.shift(); }
      else {
        const step = Math.min(d, SPEED*dt);
        tmp.normalize();
        p.addScaledVector(tmp, step);
        const ang = Math.atan2(tmp.x, tmp.z);
        rb.g.rotation.y += shortAngle(ang - rb.g.rotation.y) * Math.min(1, dt*10);
      }
    } else if (rb.look || (presActive && rb.at === 'meeting')) {
      const L = presActive && rb.at === 'meeting' && !rb.presenting && PRES_SCREEN ? PRES_SCREEN.pos : rb.look;
      if (L) {
        const ang = Math.atan2(L.x - p.x, L.z - p.z);
        rb.g.rotation.y += shortAngle(ang - rb.g.rotation.y) * Math.min(1, dt*4);
      }
    } else if (rb.state === 'inactivo' && !rb.isMe && Math.random() < dt*0.15) {
      rb.path = planPath(null, p, null, corridorPoint());
    }

    const moving = rb.path.length > 0;
    const k = rb.phase + t;
    rb.body.position.y = (reduceMotion ? 0 : Math.sin(k*2.4) * 0.06) + 0.05;
    const busy = rb.state === 'trabajando' && !moving && !rb.isMe;
    rb.arms[0].rotation.x = moving ? Math.sin(k*8)*.5 : busy ? -0.9 + Math.sin(k*9)*.15 : 0;
    rb.arms[1].rotation.x = moving ? -Math.sin(k*8)*.5 : busy ? -0.9 + Math.cos(k*9)*.15 : 0;
    rb.head.rotation.y = rb.state === 'pensando' ? Math.sin(k*1.2)*.5 : 0;
    rb.body.rotation.z = rb.state === 'pensando' ? Math.sin(k*.9)*.06 : 0;

    let vi = 1.8, ti = 2.2;
    if (rb.state === 'inactivo') { vi = 0.5; ti = 0.6; }
    if (rb.state === 'pensando') { ti = 1 + (Math.sin(k*3)*.5+.5)*3; }
    if (rb.state === 'error') { const on = Math.sin(k*8) > 0; rb.visorMat.emissive.set(on ? '#FF4D4D' : rb.a.color); ti = on ? 3 : .6; }
    else rb.visorMat.emissive.set(rb.a.color);
    rb.visorMat.emissiveIntensity = vi; rb.tipMat.emissiveIntensity = ti;
    if (t > rb.blink.next) { rb.blink.until = t + 0.12; rb.blink.next = t + 2 + Math.random()*4; }
    const eyeY = rb.state === 'inactivo' ? 0.35 : t < rb.blink.until ? 0.1 : 1;
    rb.eyes.forEach(e => { e.scale.y += (eyeY - e.scale.y) * Math.min(1, dt*30); });
    rb.ring.position.y = 0.2 + Math.sin(k*2.4) * 0.03;
    rb.ring.rotation.z += dt * (moving ? 4 : 0.8);
    rb.halo.material.opacity = rb.state === 'inactivo' ? .25 : .5 + Math.sin(k*2)*.08;

    // etiqueta
    project(p, rb.tag, 2.55);
    if (!rb.isMe) rb.stateEl.textContent = rb.state === 'pensando' ? '…' : STATE_LABEL[rb.state].toLowerCase();
    const saying = rb.say && now < rb.sayUntil;
    const text = saying ? rb.say : rb.task;
    const talk = (saying || (!rb.isMe && (now < rb.talkUntil || selected === rb.a.id))) && text;
    rb.tag.classList.toggle('talk', BURBUJAS && !!talk);
    if (talk && rb.bubble.textContent !== text) rb.bubble.textContent = text;
  }

  if (selected) {
    const p = robots[selected].g.position;
    controls.target.lerp(tmp.set(p.x, 0.8, p.z), 0.06);
  } else if (followMe) {
    const p = avatar.g.position;
    controls.target.lerp(tmp.set(p.x, 0.8, p.z), 0.08);
  }
  avatarWorld(now);
  updateDayNight(dt);
  presTick(dt, now);
  roomTags.forEach(({ r, el }) => project(r.labelPos, el, 0));

  if (intro.t < 1) {
    intro.t = Math.min(1, intro.t + dt/2.6);
    const e = 1 - Math.pow(1 - intro.t, 3);
    camera.position.lerpVectors(intro.from, intro.to, e);
    if (intro.t >= 1) controls.enabled = true;
  }
  controls.update();
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
function shortAngle(a){ return ((a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI; }

renderRoster();
renderApprovals(true);
drawAprScreen();
drawPresScreen();
detectServer().then(poll);
tick();
document.getElementById('loading').classList.add('done');
})();
</script>
</body>
