<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hábitat Madreperla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#061619;
    --panel:rgba(9,32,37,.78);
    --panel-solid:#0B252A;
    --line:rgba(205,187,147,.16);
    --ivory:#EFE9DD;
    --muted:#8FA7A5;
    --champagne:#CDBB93;
    --ok:#7FD6A4; --warn:#E9C46A; --bad:#FF6B6B; --meet:#F4A68C; --idle:#7D8F8E;
    --display:"Unbounded", "Trebuchet MS", sans-serif;
    --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ivory);font:14px/1.45 var(--body);overflow:hidden}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
  .ui{position:fixed;z-index:2;pointer-events:none}
  .ui > *{pointer-events:auto}

  /* Header */
  .top{top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;right:16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .brand{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;gap:4px}
  .eyebrow{font:500 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--champagne)}
  h1{margin:0;font:600 20px/1.1 var(--display);letter-spacing:-.01em}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px/1.2 var(--mono);color:var(--muted)}
  .mode{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ivory)}
  .mode i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .mode.live i{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
  .mode.lost i{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}
  .hint{font:12px/1.3 var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  /* Roster */
  .roster{top:calc(env(safe-area-inset-top,0px) + 108px);right:16px;width:300px;max-height:calc(100% - 220px);overflow:auto;display:grid;gap:8px;padding-right:2px}
  .card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .2s, transform .2s}
  .card:hover{border-color:rgba(205,187,147,.4)}
  .card:focus-visible{outline:2px solid var(--champagne);outline-offset:2px}
  .card.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
  .card .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
  .card b{font:600 13px/1.2 var(--display);letter-spacing:.01em}
  .card .role{font:11px/1.2 var(--mono);color:var(--muted);margin-left:6px}
  .card .task{grid-column:2 / 4;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ivory);opacity:.86;line-height:1.35}
  .card .where{grid-column:2 / 4;font:11px/1.2 var(--mono);color:var(--muted)}
  .chip{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .st-trabajando{color:var(--ok)} .st-pensando{color:var(--warn)} .st-reunion{color:var(--meet)} .st-inactivo{color:var(--idle)} .st-error{color:var(--bad)}

  /* Feed */
  .feed{left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(380px, calc(100% - 32px));background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .feed ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:12.5px}
  .feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;color:var(--ivory);opacity:.9}
  .feed li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed time{font:11px/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .feed li span b{color:var(--c)}

  /* Labels projected from 3D */
  #labels{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:4px;will-change:transform}
  .tag .name{font:600 11px/1 var(--display);letter-spacing:.04em;padding:4px 8px;border-radius:999px;background:rgba(6,22,25,.82);border:1px solid var(--c);color:var(--ivory);white-space:nowrap;display:flex;gap:6px;align-items:center}
  .tag .name i{font-style:normal;font:10px/1 var(--mono);color:var(--muted)}
  .tag .bubble{max-width:200px;font:12px/1.35 var(--body);background:var(--ivory);color:#0B252A;padding:6px 9px;border-radius:10px;text-align:center;opacity:0;transform:translateY(4px);transition:opacity .25s, transform .25s}
  .tag.talk .bubble{opacity:1;transform:none}
  .room{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--c);text-shadow:0 0 14px rgba(0,0,0,.9);white-space:nowrap;opacity:.95}
  .room small{display:block;margin-top:4px;font:10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:none;text-align:center}

  .loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:var(--bg);font:12px var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;transition:opacity .6s}
  .loading.done{opacity:0;pointer-events:none}

  @media (max-width: 760px){
    h1{font-size:17px}
    .hint{display:none}
    .roster{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:16px;left:16px;width:auto;max-height:none;display:flex;overflow-x:auto;overflow-y:hidden;gap:8px;scroll-snap-type:x mandatory;padding-bottom:2px}
    .card{flex:0 0 78%;scroll-snap-align:start}
    .feed{display:none}
  }
  @media (prefers-reduced-motion: reduce){ .mode.live i{animation:none} }
</style>
</head>
<body>
<canvas id="scene" aria-label="Laboratorio 3D con los agentes de IA de Madreperla"></canvas>
<div id="labels" aria-hidden="true"></div>

<div class="ui top">
  <div class="brand">
    <span class="eyebrow">Madreperla Realtors · Laboratorio</span>
    <h1>Hábitat de agentes</h1>
    <div class="meta">
      <span class="mode" id="mode"><i></i><span id="modeText">Simulación</span></span>
      <span id="updated">—</span>
    </div>
  </div>
  <div class="hint">Arrastra para girar · pellizca o rueda para acercar · toca un robot para seguirlo</div>
</div>

<div class="ui roster" id="roster" role="list" aria-label="Agentes"></div>

<div class="ui feed" aria-live="polite">
  <span class="eyebrow">Actividad reciente</span>
  <ol id="feed"></ol>
</div>

<div class="loading" id="loading">Encendiendo el laboratorio…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';

/* ───────────────────────── Configuración ─────────────────────────
   Salas y agentes. Para conectar agentes reales, crea un archivo
   "estado.json" junto a esta página (ver estado.ejemplo.json).       */

const ESTADO_URL = 'estado.json';
const REFRESCO_MS = 15000;

const ROOMS = {
  code:      { name:'Code Lab',      sub:'Código',              x:-11, z:-7.5 },
  design:    { name:'Design Room',   sub:'Diseño',              x:  0, z:-7.5 },
  analitica: { name:'Analítica',     sub:'Datos y métricas',    x: 11, z:-7.5 },
  libreria:  { name:'Librería',      sub:'Investigación',       x:-11, z: 7.5 },
  archivo:   { name:'Archivo',       sub:'Documentos',          x:  0, z: 7.5 },
  meeting:   { name:'Meeting Room',  sub:'Reuniones',           x: 11, z: 7.5 },
};

const AGENTS = [
  { id:'byte',   name:'Byte',   role:'Código',     home:'code',      color:'#3FD0E0' },
  { id:'pixel',  name:'Pixel',  role:'Diseño',     home:'design',    color:'#E86AC0' },
  { id:'metric', name:'Metric', role:'Analítica',  home:'analitica', color:'#F2B544' },
  { id:'folio',  name:'Folio',  role:'Librería',   home:'libreria',  color:'#6FD68E' },
  { id:'arca',   name:'Arca',   role:'Archivo',    home:'archivo',   color:'#9C82FF' },
  { id:'nexo',   name:'Nexo',   role:'Coordina',   home:'meeting',   color:'#FF8663' },
];

const STATE_LABEL = { trabajando:'Trabajando', pensando:'Pensando', reunion:'En reunión', inactivo:'En pausa', error:'Necesita ayuda' };

/* Tareas de ejemplo para el modo simulación */
const SIM_TASKS = {
  byte:   ['Actualizando la web de propiedades','Conectando el CRM con el formulario','Corrigiendo la ficha de L\'Atelier Cap Cana','Automatizando el reporte de leads'],
  pixel:  ['Diseñando carrusel para LinkedIn','Ajustando la paleta de la presentación','Preparando piezas de Velero at Bayahibe','Revisando fotos de Cana Bay'],
  metric: ['Midiendo leads de la semana','Comparando ocupación por zona','Analizando alcance de publicaciones','Actualizando el tablero comercial'],
  folio:  ['Investigando tendencias en Miches','Resumiendo noticias de CONFOTUR','Leyendo informe de turismo 2025','Preparando notas sobre Las Terrenas'],
  arca:   ['Ordenando fichas de proyectos','Archivando brochures nuevos','Indexando documentos de Puerto Marina','Clasificando borradores de correos'],
  nexo:   ['Preparando la agenda semanal','Asignando tareas al equipo','Revisando prioridades con el CRM','Consolidando avances del día'],
};

/* ───────────────────────── Escena ───────────────────────── */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#061619');
scene.fog = new THREE.Fog('#061619', 45, 95);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
camera.position.set(0, 30, 30);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.25;
controls.minDistance = 10;
controls.maxDistance = 70;
controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight('#bfe8e4', '#0a1d20', 0.32));
const sun = new THREE.DirectionalLight('#fff4e2', 0.9);
sun.position.set(-18, 32, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-30, right:30, top:22, bottom:-22, near:1, far:80 });
scene.add(sun);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* materiales base */
const M = {
  floor:  new THREE.MeshStandardMaterial({ color:'#081D21', roughness:.9 }),
  roomFl: new THREE.MeshStandardMaterial({ color:'#0E2E33', roughness:.7, metalness:.1 }),
  glass:  new THREE.MeshStandardMaterial({ color:'#9fe3e0', transparent:true, opacity:.07, roughness:.1, metalness:.2, depthWrite:false }),
  frame:  new THREE.MeshStandardMaterial({ color:'#274C51', roughness:.5, metalness:.4 }),
  desk:   new THREE.MeshStandardMaterial({ color:'#E8E1D2', roughness:.55 }),
  dark:   new THREE.MeshStandardMaterial({ color:'#14262A', roughness:.5, metalness:.3 }),
  metal:  new THREE.MeshStandardMaterial({ color:'#6F8587', roughness:.35, metalness:.7 }),
  ivory:  new THREE.MeshStandardMaterial({ color:'#EFE9DD', roughness:.4, metalness:.1 }),
  wood:   new THREE.MeshStandardMaterial({ color:'#8A6A4B', roughness:.7 }),
};
const glow = (c, i=1.4) => new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:i, roughness:.4 });

function box(w,h,d,mat,x=0,y=0,z=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,seg=24,parent=scene){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

/* suelo general con cuadrícula */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), M.floor);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(60, 60, '#1E4A50', '#12353A');
grid.position.y = 0.01; scene.add(grid);

/* pasillo central iluminado */
const corridor = new THREE.Mesh(new THREE.PlaneGeometry(36, 5.4), new THREE.MeshStandardMaterial({ color:'#0B262A', roughness:.6 }));
corridor.rotation.x = -Math.PI/2; corridor.position.y = 0.02; corridor.receiveShadow = true; scene.add(corridor);
for (const zz of [-2.7, 2.7]) {
  box(36, 0.04, 0.08, glow('#CDBB93', .9), 0, 0.04, zz);
}

/* ───────── Salas ───────── */
const W = 10, D = 9, WALL_H = 2.1, DOOR = 2.6;
const updaters = [];   // animaciones de mobiliario

function toWorld(room, lx, lb){      // lb > 0 = hacia la pared del fondo
  const s = Math.sign(room.z);
  return new THREE.Vector3(room.x + lx, 0, room.z + s * lb);
}

function buildRoom(key){
  const r = ROOMS[key];
  const owner = AGENTS.find(a => a.home === key);
  r.color = owner.color;
  const s = Math.sign(r.z);
  const g = new THREE.Group(); scene.add(g);

  const fl = box(W-0.3, 0.06, D-0.3, M.roomFl, r.x, 0.03, r.z, g);
  fl.castShadow = false;
  // alfombra de color de la sala
  const rug = box(W-3, 0.02, D-3.4, new THREE.MeshStandardMaterial({ color:r.color, roughness:.9, transparent:true, opacity:.14 }), r.x, 0.07, r.z, g);
  rug.castShadow = false;

  const backZ = r.z + s*D/2, frontZ = r.z - s*D/2;
  const wall = (len, x, z, rotY) => {
    const p = box(len, WALL_H, 0.06, M.glass, x, WALL_H/2, z, g);
    p.rotation.y = rotY; p.castShadow = false;
    const rail = box(len, 0.08, 0.1, glow(r.color, 1.1), x, WALL_H, z, g);
    rail.rotation.y = rotY; rail.castShadow = false;
    const base = box(len, 0.14, 0.14, M.frame, x, 0.07, z, g);
    base.rotation.y = rotY;
  };
  wall(W, r.x, backZ, 0);
  wall(D, r.x - W/2, r.z, Math.PI/2);
  wall(D, r.x + W/2, r.z, Math.PI/2);
  const seg = (W - DOOR)/2;
  wall(seg, r.x - DOOR/2 - seg/2, frontZ, 0);
  wall(seg, r.x + DOOR/2 + seg/2, frontZ, 0);
  // luz de la sala
  const pl = new THREE.PointLight(r.color, 0.7, 11, 2);
  pl.position.set(r.x, 3.2, r.z); g.add(pl);

  r.door = { inner: new THREE.Vector3(r.x, 0, frontZ + s*1.2), outer: new THREE.Vector3(r.x, 0, frontZ - s*1.3) };
  r.center = new THREE.Vector3(r.x, 0, r.z);
  r.labelPos = new THREE.Vector3(r.x, WALL_H + 0.9, r.z - D/2);   // borde más lejano a la cámara

  FURNITURE[key](r, g);
}

/* texturas dibujadas */
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function codeTex(color){
  const t = canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = '#071A1E'; x.fillRect(0,0,w,h);
    const cols = [color, '#EFE9DD', '#CDBB93', '#7FD6A4'];
    for (let y = 8; y < h; y += 12) {
      let px = 10 + (Math.random() < .5 ? 0 : 16) + (Math.random() < .3 ? 16 : 0);
      const n = 1 + Math.floor(Math.random()*4);
      for (let i = 0; i < n && px < w-20; i++) {
        const len = 12 + Math.random()*60;
        x.fillStyle = cols[Math.floor(Math.random()*cols.length)];
        x.globalAlpha = .55 + Math.random()*.45;
        x.fillRect(px, y, len, 5); px += len + 8;
      }
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function screen(tex, w, h, pos, rotY, parent){
  const mat = new THREE.MeshBasicMaterial({ map:tex, toneMapped:false });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.copy(pos); m.rotation.y = rotY; parent.add(m); return m;
}
const faceFront = r => (Math.sign(r.z) > 0 ? Math.PI : 0);  // mirar hacia el pasillo

const FURNITURE = {
  code(r, g){
    const s = Math.sign(r.z);
    [-3, 0, 3].forEach((lx, i) => {
      const p = toWorld(r, lx, 2.6);
      box(2.4, 0.08, 1.1, M.desk, p.x, 0.9, p.z, g);
      box(0.08, 0.9, 0.9, M.dark, p.x-1.1, 0.45, p.z, g);
      box(0.08, 0.9, 0.9, M.dark, p.x+1.1, 0.45, p.z, g);
      const mp = toWorld(r, lx, 2.95);
      box(1.5, 0.95, 0.06, M.dark, mp.x, 1.55, mp.z, g);
      const tex = codeTex(r.color);
      const scr = screen(tex, 1.38, 0.84, new THREE.Vector3(mp.x, 1.55, mp.z - s*0.04), faceFront(r), g);
      const speed = .02 + i*.01;
      updaters.push(dt => { tex.offset.y -= dt*speed; });
    });
    // rack de servidores con luces
    const rk = toWorld(r, -4.1, -1.2);
    box(0.9, 2.2, 0.9, M.dark, rk.x, 1.1, rk.z, g);
    const leds = [];
    for (let i = 0; i < 6; i++) {
      const l = box(0.5, 0.05, 0.02, glow(i%2 ? '#7FD6A4' : r.color, 1.6), rk.x + 0.46, 0.4 + i*0.3, rk.z, g);
      l.rotation.y = Math.PI/2; l.castShadow = false; leds.push(l);
    }
    updaters.push((dt, t) => leds.forEach((l,i) => l.material.emissiveIntensity = 0.6 + (Math.sin(t*6 + i*1.7) > .3 ? 1.4 : 0)));
    r.spot = toWorld(r, 0, 1.4);  r.look = toWorld(r, 0, 3);
  },

  design(r, g){
    const s = Math.sign(r.z);
    // gran pantalla de diseño con muestras de color
    const bp = toWorld(r, 0, 4.2);
    box(5.2, 2.6, 0.1, M.dark, bp.x, 1.7, bp.z, g);
    const tex = canvasTex(512, 256, (x, w, h) => {
      x.fillStyle = '#EFE9DD'; x.fillRect(0,0,w,h);
      const pal = ['#0E4B52','#CDBB93','#E86AC0','#3FD0E0','#F2B544','#1B2B2E'];
      pal.forEach((c,i) => { x.fillStyle = c; x.fillRect(24 + i*56, 24, 44, 44); });
      x.fillStyle = '#0E4B52'; x.font = '600 34px sans-serif'; x.fillText('Aa  Madreperla', 24, 120);
      x.strokeStyle = '#E86AC0'; x.lineWidth = 4;
      x.beginPath(); x.moveTo(24, 210); x.bezierCurveTo(140,130, 260,250, 380,170); x.stroke();
      x.fillStyle = '#CDBB93'; x.beginPath(); x.arc(440, 190, 38, 0, Math.PI*2); x.fill();
    });
    screen(tex, 5, 2.4, new THREE.Vector3(bp.x, 1.7, bp.z - s*0.06), faceFront(r), g);
    // mesa de trabajo con formas flotando
    const tp = toWorld(r, 0, 0.6);
    cyl(1.4, 1.4, 0.08, M.desk, tp.x, 0.85, tp.z, 32, g);
    cyl(0.12, 0.3, 0.85, M.metal, tp.x, 0.42, tp.z, 16, g);
    const shapes = [
      new THREE.Mesh(new THREE.TorusKnotGeometry(0.22, 0.07, 64, 8), glow(r.color, .6)),
      new THREE.Mesh(new THREE.IcosahedronGeometry(0.25), glow('#CDBB93', .5)),
      new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 24), glow('#3FD0E0', .5)),
    ];
    shapes.forEach((m, i) => { m.position.set(tp.x - 0.7 + i*0.7, 1.5, tp.z); m.castShadow = true; g.add(m); });
    updaters.push((dt, t) => shapes.forEach((m,i) => { m.rotation.y += dt*(0.6+i*.2); m.position.y = 1.45 + Math.sin(t*1.5 + i)*0.12; }));
    // caballete lateral
    const ep = toWorld(r, 3.6, 1.8);

/* rutas: sala → puerta → pasillo → puerta → sala */
function spotFor(id, roomKey, state){
  const r = ROOMS[roomKey];
  const idx = AGENTS.findIndex(a => a.id === id);
  if (roomKey === 'meeting' && (state === 'reunion' || id === 'nexo')) return { pos: r.seats[idx % 6].clone(), look: r.look.clone() };
  if (AGENTS[idx].home === roomKey) return { pos: r.spot.clone(), look: r.look.clone() };
  // visitante: se ubica en la sala sin chocar con el anfitrión
  const off = ((idx % 3) - 1) * 1.4;
  const p = toWorld(r, off, -1.9);
  return { pos: p, look: r.center.clone() };
}
function corridorPoint(){
  return new THREE.Vector3((Math.random()*2-1)*15, 0, (Math.random()*2-1)*1.6);
}
function routeTo(rb, roomKey, state){
  const pts = [];
  const from = rb.at;
  if (from && from === roomKey) {
    const t = spotFor(rb.a.id, roomKey, state);
    rb.path = [t.pos]; rb.look = t.look; return;
  }
  if (from) { pts.push(ROOMS[from].door.inner.clone(), ROOMS[from].door.outer.clone()); }
  if (roomKey) {
    const d = ROOMS[roomKey].door;
    pts.push(new THREE.Vector3(d.outer.x, 0, (Math.random()-.5)*1.2), d.outer.clone(), d.inner.clone());
    const t = spotFor(rb.a.id, roomKey, state);
    pts.push(t.pos); rb.look = t.look;
  } else {
    const p = corridorPoint(); pts.push(new THREE.Vector3(p.x, 0, 0), p); rb.look = null;
  }
  rb.path = pts; rb.at = roomKey;
}

/* ───────── Estado de los agentes (en vivo o simulado) ───────── */

function destinationFor(ag){
  if (ag.sala && ROOMS[ag.sala]) return ag.sala;
  if (ag.estado === 'reunion') return 'meeting';
  if (ag.estado === 'inactivo') return null;
  return AGENTS.find(a => a.id === ag.id).home;
}

function applyState(ag, silent){
  const rb = robots[ag.id]; if (!rb) return;
  const estado = STATE_LABEL[ag.estado] ? ag.estado : 'trabajando';
  const dest = destinationFor({ ...ag, estado });
  const changed = estado !== rb.state || dest !== rb.room || (ag.tarea || '') !== rb.task;
  const moved = dest !== rb.room || (estado === 'reunion') !== (rb.state === 'reunion');
  rb.state = estado; rb.task = ag.tarea || ''; rb.room = dest;
  if (moved || !rb.path.length && dest !== rb.at) routeTo(rb, dest, estado);
  if (changed && !silent) {
    rb.talkUntil = performance.now() + 6000;
    log(rb, dest);
  }
  renderRoster();
}

  feedEl.innerHTML = feed.map(f => `<li><time>${f.t}</time><span style="--c:${f.c}">${f.html}</span></li>`).join('');
}

/* modo en vivo: lee estado.json */
const modeEl = document.getElementById('mode'), modeText = document.getElementById('modeText'), updatedEl = document.getElementById('updated');
let live = false, simTimer = null;

async function poll(){
  try {
    const res = await fetch(`${ESTADO_URL}?t=${Date.now()}`, { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (!Array.isArray(data.agentes)) throw new Error('formato');
    const first = !live;
    live = true; stopSim();
    modeEl.className = 'mode live'; modeText.textContent = 'En vivo';
    data.agentes.forEach(ag => applyState(ag, false));
    const when = data.actualizado ? new Date(data.actualizado) : new Date();
    updatedEl.textContent = 'Actualizado ' + when.toLocaleString('es-DO', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short', hour12:false });
    if (first) setInterval(poll, REFRESCO_MS);
  } catch (err) {
    if (live) { modeEl.className = 'mode lost'; modeText.textContent = 'Sin conexión'; }
    else startSim();
  }
}

/* modo simulación */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
let meetingUntil = 0;
function simStep(){
  const now = performance.now();
  if (now > meetingUntil && Math.random() < .12) {
    meetingUntil = now + 22000;
    const tema = pick(['Revisión semanal de leads','Planificación de contenido de octubre','Prioridades del CRM','Lanzamiento de nuevo proyecto']);
    AGENTS.forEach(a => { if (a.id === 'nexo' || Math.random() < .7) applyState({ id:a.id, estado:'reunion', tarea:tema }); });
    setTimeout(() => AGENTS.forEach(a => { if (robots[a.id].state === 'reunion') applyState({ id:a.id, estado:'trabajando', tarea:pick(SIM_TASKS[a.id]) }); }), 22000);
    return;
  }
  if (now < meetingUntil) return;
  const a = pick(AGENTS);
  const roll = Math.random();
  if (roll < .6) applyState({ id:a.id, estado:'trabajando', tarea:pick(SIM_TASKS[a.id]) });
  else if (roll < .75) applyState({ id:a.id, estado:'pensando', tarea:'Evaluando la mejor forma de ' + pick(SIM_TASKS[a.id]).toLowerCase() });
  else if (roll < .87) applyState({ id:a.id, estado:'trabajando', sala: a.home === 'libreria' ? 'archivo' : 'libreria', tarea:'Consultando referencias' });
  else if (roll < .97) applyState({ id:a.id, estado:'inactivo', tarea:'' });
  else applyState({ id:a.id, estado:'error', tarea:'Espera una aprobación del equipo' });
}
function startSim(){
  modeEl.className = 'mode'; modeText.textContent = 'Simulación';
  updatedEl.textContent = 'Datos de ejemplo';
  setTimeout(poll, REFRESCO_MS);   // sigue buscando estado.json por si se conecta
  if (simTimer) return;
  AGENTS.forEach(a => applyState({ id:a.id, estado:'trabajando', tarea:pick(SIM_TASKS[a.id]) }, true));
  simTimer = setInterval(simStep, 3500);
}
function stopSim(){ if (simTimer) { clearInterval(simTimer); simTimer = null; } }

/* ───────── Bucle ───────── */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
const SPEED = 2.6;

function project(v, el, dy = 0){
  tmp.copy(v); tmp.y += dy; tmp.project(camera);
  const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.2 && Math.abs(tmp.y) < 1.2;
  el.style.display = vis ? '' : 'none';
  if (vis) el.style.transform = `translate(${(tmp.x*.5+.5)*innerWidth}px, ${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
}

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updaters.forEach(fn => fn(reduceMotion ? dt*.3 : dt, reduceMotion ? t*.3 : t));

  const now = performance.now();
  for (const rb of Object.values(robots)) {
    const p = rb.g.position;
    if (rb.path.length) {
      const target = rb.path[0];
      tmp.subVectors(target, p); tmp.y = 0;
      const d = tmp.length();
      if (d < 0.08) { rb.path.shift(); }
      else {
        const step = Math.min(d, SPEED*dt);
        tmp.normalize();
        p.addScaledVector(tmp, step);
        const ang = Math.atan2(tmp.x, tmp.z);
        rb.g.rotation.y += shortAngle(ang - rb.g.rotation.y) * Math.min(1, dt*10);
      }
    } else if (rb.look) {
      const ang = Math.atan2(rb.look.x - p.x, rb.look.z - p.z);
      rb.g.rotation.y += shortAngle(ang - rb.g.rotation.y) * Math.min(1, dt*4);
    } else if (rb.state === 'inactivo' && Math.random() < dt*0.15) {
      const q = corridorPoint(); rb.path = [q];
    }

    const moving = rb.path.length > 0;
    const k = rb.phase + t;
    rb.body.position.y = (reduceMotion ? 0 : Math.sin(k*2.4) * 0.06) + 0.05;
    const busy = rb.state === 'trabajando' && !moving;
    rb.arms[0].rotation.x = moving ? Math.sin(k*8)*.5 : busy ? -0.9 + Math.sin(k*9)*.15 : 0;
    rb.arms[1].rotation.x = moving ? -Math.sin(k*8)*.5 : busy ? -0.9 + Math.cos(k*9)*.15 : 0;
    rb.head.rotation.y = rb.state === 'pensando' ? Math.sin(k*1.2)*.5 : 0;
    rb.body.rotation.z = rb.state === 'pensando' ? Math.sin(k*.9)*.06 : 0;

    let vi = 1.8, ti = 2.2;
    if (rb.state === 'inactivo') { vi = 0.5; ti = 0.6; }
    if (rb.state === 'pensando') { ti = 1 + (Math.sin(k*3)*.5+.5)*3; }
    if (rb.state === 'error') { const on = Math.sin(k*8) > 0; rb.visorMat.emissive.set(on ? '#FF4D4D' : rb.a.color); ti = on ? 3 : .6; }
    else rb.visorMat.emissive.set(rb.a.color);
    rb.visorMat.emissiveIntensity = vi; rb.tipMat.emissiveIntensity = ti;

    // etiqueta
    project(p, rb.tag, 2.55);
    rb.stateEl.textContent = rb.state === 'pensando' ? '…' : STATE_LABEL[rb.state].toLowerCase();
    const talk = (now < rb.talkUntil || selected === rb.a.id) && rb.task;
    rb.tag.classList.toggle('talk', !!talk);
    if (talk && rb.bubble.textContent !== rb.task) rb.bubble.textContent = rb.task;
  }

  if (selected) {
    const p = robots[selected].g.position;
    controls.target.lerp(tmp.set(p.x, 0.8, p.z), 0.06);
  }
  roomTags.forEach(({ r, el }) => project(r.labelPos, el, 0));

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
function shortAngle(a){ return ((a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI; }

renderRoster();
poll();
tick();
document.getElementById('loading').classList.add('done');
})();
</script>
